name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        # actions/setup-python@v6 -> ece7cb06caefa5fff74198d8649806c4678c61a1
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.3
      - name: Set up Go
        # actions/setup-go@v5.5.0 -> d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Run quick checks
        run: bash scripts/check.sh --quick

  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeoutMinutes: 30
          - os: windows-latest
            timeoutMinutes: 30
          - os: macos-latest
            timeoutMinutes: 30
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Go
        # actions/setup-go@v5.5.0 -> d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build and test
        run: GOPROXY=off go test -C backend -mod=vendor -count=1 ./...

  database:
    name: Database (PostgreSQL 18 + pgvector) - Linux-only reference platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run full migrations and SQL test suite
        env:
          VC_DB_LOG_DIR: db-test-logs
        run: bash infra/db/run-rls-tests.sh
      - name: Set up Go
        # actions/setup-go@v5.5.0 -> d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go store RLS / least-privilege tests
        run: bash infra/db/run-go-store-tests.sh
      - name: Upload database logs on failure
        if: failure()
        # actions/upload-artifact@v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-logs
          path: db-test-logs/**
          if-no-files-found: ignore

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Go
        # actions/setup-go@v5.5.0 -> d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify vendored Go dependencies
        run: GOPROXY=off go list -C backend -mod=vendor -deps ./... > /dev/null

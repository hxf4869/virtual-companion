name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        # actions/setup-python@v6 -> ece7cb06caefa5fff74198d8649806c4678c61a1
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.3
      - name: Run quick checks
        run: bash scripts/check.sh --quick

  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeoutMinutes: 30
          - os: windows-latest
            timeoutMinutes: 30
          - os: macos-latest
            timeoutMinutes: 30
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Java
        # actions/setup-java@v4 -> cf277c60eb25467037889841efdb72551f06f6c3
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Maven wrapper
        run: chmod +x mvnw && ./mvnw --version
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  database:
    name: Database (PostgreSQL 18 + pgvector) - Linux-only reference platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run full migrations and SQL test suite
        env:
          VC_DB_LOG_DIR: db-test-logs
        run: bash infra/db/run-rls-tests.sh
      - name: Upload database logs on failure
        if: failure()
        # actions/upload-artifact@v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-logs
          path: db-test-logs/**
          if-no-files-found: ignore

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeoutMinutes: 20
          - os: windows-latest
            timeoutMinutes: 25
          - os: macos-latest
            timeoutMinutes: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up pnpm
        # pnpm/action-setup@v6 -> 0977fd99725f1db4007ccb2928dbb4e90d06cc86
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
          install: false
      - name: Set up Node.js
        # actions/setup-node@v6 -> 249970729cb0ef3589644e2896645e5dc5ba9c38
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Test H5 (vitest incl. page component glue)
        run: pnpm --dir frontend test:run
      - name: Type-check H5
        run: pnpm --dir frontend type-check
      - name: Build H5
        run: pnpm --dir frontend build

  supply-chain:
    name: Supply chain (SBOM + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Java
        # actions/setup-java@v4 -> cf277c60eb25467037889841efdb72551f06f6c3
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Maven wrapper
        run: chmod +x mvnw && ./mvnw --version
      - name: Generate CycloneDX SBOM
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DoutputName=virtual-companion
      - name: Upload SBOM artifact
        # actions/upload-artifact@v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyclonedx-sbom
          path: target/*.json
          if-no-files-found: error
      - name: Set up pnpm
        # pnpm/action-setup@v6 -> 0977fd99725f1db4007ccb2928dbb4e90d06cc86
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
          install: false
      - name: Set up Node.js
        # actions/setup-node@v6 -> 249970729cb0ef3589644e2896645e5dc5ba9c38
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm --dir frontend audit --audit-level=high
        continue-on-error: true

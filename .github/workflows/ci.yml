name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness-full:
    name: Harness full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeoutMinutes: 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-harness.txt
      - name: Install harness dependencies
        run: python -m pip install -r requirements-harness.txt
      - name: Test Harness failure and portability rules
        run: python -m unittest discover -s scripts/harness/tests -p "test_*.py"
      - name: Run canonical Harness precheck (POSIX wrapper)
        shell: bash
        run: bash scripts/harness/precheck.sh

  harness-smoke:
    name: Harness smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            timeoutMinutes: 20
          - os: macos-latest
            timeoutMinutes: 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-harness.txt
      - name: Install harness dependencies
        run: python -m pip install -r requirements-harness.txt
      - name: Run canonical Harness precheck (Windows wrapper)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\harness\precheck.ps1
      - name: Run canonical Harness precheck (POSIX wrapper)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/harness/precheck.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Maven wrapper
        run: chmod +x mvnw && ./mvnw --version
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Build H5
        run: pnpm --dir frontend build

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness-full:
    name: Harness full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeoutMinutes: 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python
        # actions/setup-python@v6 -> ece7cb06caefa5fff74198d8649806c4678c61a1
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-harness.txt
      - name: Install harness dependencies
        run: python -m pip install --require-hashes -r requirements-harness.txt
      - name: Test Harness failure and portability rules
        run: python -m unittest discover -s scripts/harness/tests -p "test_*.py"
      - name: Run canonical Harness precheck (POSIX wrapper)
        shell: bash
        run: bash scripts/harness/precheck.sh

  harness-smoke:
    name: Harness smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            timeoutMinutes: 20
          - os: macos-latest
            timeoutMinutes: 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python
        # actions/setup-python@v6 -> ece7cb06caefa5fff74198d8649806c4678c61a1
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-harness.txt
      - name: Install harness dependencies
        run: python -m pip install --require-hashes -r requirements-harness.txt
      - name: Run canonical Harness precheck (Windows wrapper)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\harness\precheck.ps1
      - name: Run canonical Harness precheck (POSIX wrapper)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/harness/precheck.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Java
        # actions/setup-java@v4 -> cf277c60eb25467037889841efdb72551f06f6c3
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Maven wrapper
        run: chmod +x mvnw && ./mvnw --version
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  database:
    name: Database (PostgreSQL 18 + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run full migrations and SQL test suite
        env:
          VC_DB_LOG_DIR: db-test-logs
        run: bash infra/db/run-rls-tests.sh
      - name: Upload database logs on failure
        if: failure()
        # actions/upload-artifact@v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-logs
          path: db-test-logs/**
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6 -> d23441a48e516b6c34aea4fa41551a30e30af803
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up pnpm
        # pnpm/action-setup@v6 -> 0977fd99725f1db4007ccb2928dbb4e90d06cc86
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
          install: false
      - name: Set up Node.js
        # actions/setup-node@v6 -> 249970729cb0ef3589644e2896645e5dc5ba9c38
        # 升级流程：在受审 PR 中同时更新 40-char SHA 与下方注释 tag，禁止直接使用可变 tag。
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Test H5 (vitest incl. page component glue)
        run: pnpm --dir frontend test:run
      - name: Type-check H5
        run: pnpm --dir frontend type-check
      - name: Build H5
        run: pnpm --dir frontend build

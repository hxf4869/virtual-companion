schemaVersion: 2
paths:
  - glob: specs/catalog/**
    riskClass: C3
    requiredSkill: catalog-change
    independentReview: true
  - glob: specs/contracts/**
    riskClass: C3
    requiredSkill: contract-change
    independentReview: true
  - glob: specs/generated/**
    riskClass: C3
    requiredSkill: catalog-change
    independentReview: true
    generatedOnly: true
  - glob: "**/db/migration/**"
    riskClass: C4
    requiredSkill: database-migration
    humanApproval: true
  - glob: service/**/safety/**
    riskClass: C4
    requiredSkill: safety-change
    humanApproval: true
  - glob: service/**/memory/**
    riskClass: C3
    requiredSkill: memory-change
    independentReview: true
  - glob: service/**/modelruntime/**
    riskClass: C3
    requiredSkill: model-routing-change
    independentReview: true
  - glob: AGENTS.md
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: CLAUDE.md
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: .github/copilot-instructions.md
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: .github/workflows/**
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: ci/**
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: .harness/**
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
    lifecycleExemptions:
      - .harness/project-state.yaml
      - .harness/task-ledger.yaml
  - glob: .harness/project-state.yaml
    riskClass: C2
    requiredSkill: task-intake
  - glob: .harness/task-ledger.yaml
    riskClass: C2
    requiredSkill: task-intake
  - glob: scripts/harness/**
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: skills/**
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: docs/schemas/**
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: docs/tasks/task-card-template.md
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: docs/tasks/**
    riskClass: C2
    requiredSkill: task-intake
  - glob: docs/evidence/**
    riskClass: C2
    requiredSkill: task-intake
  - glob: docs/handoffs/**
    riskClass: C2
    requiredSkill: task-intake
  - glob: requirements-harness.txt
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true
  - glob: .gitattributes
    riskClass: C4
    requiredSkill: harness-change
    humanApproval: true

schemaVersion: 1
policyId: task-delivery
canonicalLifecycleSource: .harness/task-lifecycle.yaml
taskSource: .harness/task-backlog.yaml
ciExecutionPolicy: .harness/ci-execution-policy.yaml
skill:
  id: task-delivery-flow
  registry: .harness/skills.yaml
modes:
  single-card:
    kind: TASK_EXECUTION
    happyPath:
      - PLANNED
      - DRAFT
      - READY
      - IN_PROGRESS
      - IN_REVIEW
      - ACCEPTED
    governanceExceptions:
      - IDLE_DRAFT
      - PLANNING_ONLY_RESOLUTION
      - TERMINAL_CLOSURE
    stopConditions:
      - OWNER_GATE
      - EVIDENCED_BLOCKED
  longline:
    kind: BACKLOG_ORCHESTRATION
    cardMode: single-card
    maximumConcurrentCards: 1
    freshVisibleTaskPerCard: true
    nextCardRequires:
      - ACCEPTED
      - PUSHED
      - HANDOFF_COMPLETE
      - REMOTE_REVERIFIED
      - EXACT_TREE_VALIDATION_REVERIFIED
    terminalStatesThatDoNotReleaseDependencies:
      - REJECTED
      - SUPERSEDED
    blockedCardBehavior:
      blocksDependencyDescendantsOnly: true
      continueIndependentPromotableCards: true
    pauseConditions:
      - NO_PROMOTABLE_CARD
      - OWNER_GATE_ONLY
complexityGate:
  evaluateBefore: READY
  splitWhen:
    crossRiskSurfaces:
      minimumDistinct: 2
      surfaces:
        - GOVERNANCE
        - AUTHORIZATION
        - HISTORY
    reviewerMinutesGreaterThan: 15
    terminalCheckMinutesGreaterThan: 20
    estimatedWallMinutesGreaterThan: 90
budgets:
  schemaVersion: 2
  targetWallMinutes: 60
  hardFuseWallMinutes: 90
  candidateDeadlineMinutes: 45
  iterationTargetedMaxSeconds: 60
  maximumFixBatches: 1
  maximumReviewRounds: 2
  thirdReviewForbidden: true
  timingContract:
    overallElapsed:
      anchor: DRAFT_COMMIT
      terminal: TERMINAL_COMMIT
      recordingRequired: true
      resetOrReanchorForbidden: true
    intakeActivation:
      anchor: DRAFT_COMMIT
      terminal: READY_DOCTOR_TERMINAL
      targetWallMinutes: 60
      hardFuseWallMinutes: 90
      timeoutStatus: TIMEOUT
      closureOnlyOverrun: true
    candidateExecution:
      requiredAnchorEvents:
        - READY_DOCTOR_PASS
        - IN_PROGRESS_COMMIT
      anchorSelection: LATER_OF_REQUIRED_EVENTS
      candidateDeadlineMinutes: 45
      targetWallMinutes: 60
      hardFuseWallMinutes: 90
      timeoutStatus: TIMEOUT
      closureOnlyOverrun: true
      notStarted:
        outcome: NOT_STARTED
        eligibleOnlyWhen:
          readyDoctorOutcome: NON_PASS
          readyDoctorPassExists: false
          inProgressCommitExists: false
          candidateFreezeExists: false
        anchor: NOT_STARTED_READY_DOCTOR_NON_PASS
        anchorCommit: null
        startedAt: null
        endedAt: null
        readyDoctorPassAt: null
        inProgressCommit: null
        elapsedSeconds: 0
        closureOnlyOverrunSeconds: 0
        reasonRequired: true
        reanchored: false
        passClaimed: false
    taskBindings:
      - TASK-0074
      - TASK-0075
      - TASK-0076
  stopOnR2NewStructural:
    - P0
    - P1
  hardFuse:
    stopImmediately:
      - IMPLEMENTATION
      - FIXES
      - REVIEWER
      - CANDIDATE_CANONICAL
      - CI
    mandatoryTerminalClosure:
      activeOrHalfClosedRepositoryMustClose: true
      closureOnlyOverrunAllowed: true
      allowedActions:
        - EVIDENCE_HANDOFF
        - PRE_CLOSURE
        - TERMINAL_COMMIT
        - PUSH
        - REMOTE_ZERO_ZERO
      recordSeparately:
        - DURATION
        - ROOT_CAUSE
      implementationForbidden: true
validation:
  sequence:
    - TARGETED
    - CANDIDATE_COMMIT_TREE
    - REVIEWER
    - CANDIDATE_CANONICAL
    - EXACT_TREE_VALIDATION_CHANNEL
    - CLOSURE
  ordinaryCard:
    canonicalPythonPrecheckCount: 1
    canonicalPythonArgv:
      - python
      - scripts/harness/precheck.py
      - --task
      - TASK-ID
    wrapperEvidenceAlias: false
    affectedModuleTestsRequired: true
    diffCheckCount: 1
    duplicateCanonicalSubcommandsForbidden: true
  task0074HarnessPortabilityCombinedGate:
    taskId: TASK-0074
    eligibleProfile: HARNESS_PORTABILITY_LOCAL
    readyFrozenProfileRequired: true
    sameCleanCandidateCommitAndTreeRequired: true
    windowsDurableReceiptCount: 1
    satisfies:
      - CANDIDATE_CANONICAL
      - WINDOWS_EXACT_TREE
    commandRegistryProfile: harnessPortabilityLocal
    exactCommandIds:
      - harnessTests
      - doctor
      - catalogValidate
      - catalogDrift
      - paidFeatureCheck
      - betaRosterGate
    canonicalCommandIds:
      - doctor
      - catalogValidate
      - catalogDrift
      - paidFeatureCheck
      - betaRosterGate
    eachCommandExactlyOnce: true
    wrapperAliasCacheSkipForbidden: true
    wslStillIndependent: true
    ordinaryCardsRemainIndependentCanonical: true
    resultBasedProfileDowngradeForbidden: true
  task0075HarnessPortabilityCombinedGate:
    taskId: TASK-0075
    eligibleProfile: HARNESS_PORTABILITY_LOCAL
    readyFrozenProfileRequired: true
    sameCleanCandidateCommitAndTreeRequired: true
    windowsDurableReceiptCount: 1
    satisfies:
      - CANDIDATE_CANONICAL
      - WINDOWS_EXACT_TREE
    commandRegistryProfile: harnessPortabilityLocal
    exactCommandIds:
      - harnessTests
      - doctor
      - catalogValidate
      - catalogDrift
      - paidFeatureCheck
      - betaRosterGate
    canonicalCommandIds:
      - doctor
      - catalogValidate
      - catalogDrift
      - paidFeatureCheck
      - betaRosterGate
    eachCommandExactlyOnce: true
    wrapperAliasCacheSkipForbidden: true
    wslStillIndependent: true
    ordinaryCardsRemainIndependentCanonical: true
    resultBasedProfileDowngradeForbidden: true
  task0076HarnessPortabilityCombinedGate:
    taskId: TASK-0076
    eligibleProfile: HARNESS_PORTABILITY_LOCAL
    readyFrozenProfileRequired: true
    sameCleanCandidateCommitAndTreeRequired: true
    windowsDurableReceiptCount: 1
    satisfies:
      - CANDIDATE_CANONICAL
      - WINDOWS_EXACT_TREE
    commandRegistryProfile: harnessPortabilityLocal
    exactCommandIds: [harnessTests, doctor, catalogValidate, catalogDrift, paidFeatureCheck, betaRosterGate]
    canonicalCommandIds: [doctor, catalogValidate, catalogDrift, paidFeatureCheck, betaRosterGate]
    eachCommandExactlyOnce: true
    wrapperAliasCacheSkipForbidden: true
    wslStillIndependent: true
    ordinaryCardsRemainIndependentCanonical: true
    resultBasedProfileDowngradeForbidden: true
  fullPlatformWrappersFor:
    - HARNESS
    - PORTABILITY
  exactTreeValidation:
    policySource: .harness/ci-execution-policy.yaml
    channels:
      - PRIMARY_REMOTE_EXACT_SHA
      - LOCAL_EXACT_TREE_FALLBACK
    defaultChannel: PRIMARY_REMOTE_EXACT_SHA
    fallbackRequiresReadyFrozenProfile: true
    resultBasedDowngradeForbidden: true
    unknownRemoteAvailabilityCannotSkip: true
    terminalMetadataOnlyProfile: TERMINAL_METADATA_ONLY
    notRunOrDeferredNeverPass: true
  longRunningCommand:
    singleProcess: true
    expectedDurationThresholdSeconds: 60
    transportPriority:
      - DIRECT_PERSISTENT_SESSION_OR_PTY
      - DURABLE_ATOMIC_RECEIPT
    directPersistentSessionOrPtyPreferred: true
    durableAtomicReceipt:
      commandRegistryId: durableCommand
      helper: scripts/harness/durable_command.ps1
      platform: WINDOWS_ONLY
      powershellMinimumMajor: 7
      powershell51FallbackForbidden: true
      encodedCommandEncoding: UTF16LE
      hiddenWindowRequired: true
      smokePassRequiredBeforeExpensiveLaunch: true
      exactArgumentArrayRequired: true
      stringCommandLineAssemblyForbidden: true
      concurrentStdoutStderrDrainRequired: true
      realInnerExitCodeRequired: true
      outputFlushAndCloseBeforeReceipt: true
      sameDirectoryAtomicMoveRequired: true
      uniqueSystemTempDirectoryRequired: true
      missingOrInvalidReceiptResult: UNKNOWN
      unsupportedPlatformBehavior: DIRECT_OR_FAIL
    appliesTo:
      - DOCTOR
      - CANDIDATE_CANONICAL
      - PRE_CLOSURE
    preserve:
      - SAME_PROCESS
      - STDOUT
      - STDERR
      - REAL_EXIT_CODE
    outerYieldOrTimeoutBehavior: YIELD_CONTROL_ONLY
    lostExitCodeStatuses:
      - NOT_RUN
      - UNKNOWN
    passWithLostExitCodeForbidden: true
    polling: LOW_FREQUENCY_RECEIPT_EXISTENCE_ONLY
    defaultPollingIntervalSeconds: 60
    receiptReadOnceAfterPublication: true
    pidProcessStatusAndLogPollingForbidden: true
    parallelStatusCommandForbidden: true
    parallelProcessInspectionCommandForbidden: true
    repeatedLogFetchForbidden: true
    duplicateExecutionForbidden: true
review:
  conditionalRiskClasses:
    - C1
    - C2
  independentRiskClasses:
    - C3
    - C4
  protectedRuleRequirementsApply: true
  independentForkTurns: none
  maximumMinutes: 15
  missingTerminalStatuses:
    - TIMEOUT
    - UNKNOWN
  r1:
    scope:
      - COMPLETE_MATRIX
      - ACCEPTANCE
      - INVARIANTS
      - ADJACENT_RISK
    blocking:
      - P0
      - P1
      - ACCEPTANCE_VIOLATION
      - INVARIANT_VIOLATION
    nonBlocking:
      - P2
      - P3
  r2:
    scope:
      - FINDING_CLOSURE
      - DELTA
      - ADJACENT_RISK
      - NEW_P0_P1
    restartFullReviewForbidden: true
  reviewerRunsExpensiveFullTests: false
candidateIdentity:
  requiredInputs:
    - HEAD_SHA
    - INDEX_TREE
    - WORKTREE
    - UNTRACKED_CANDIDATE
    - EXACT_COMMAND
    - OPERATING_SYSTEM
    - INTERPRETER
    - TOOLCHAIN
    - DEPENDENCIES
    - ENVIRONMENT
    - GIT_CONFIG
    - EXTERNAL_SERVICES
    - DATA_STATE
    - TASK_AUTHORIZATION
    - CONTEXT
    - COMMAND_REGISTRY
  reuseRequiresAllInputsUnchanged: true
  unknownOrChanged: RERUN_REQUIRED
  acceptedResult: PASS
  reusedPassStatusForbidden: true
  nonPassResults:
    - FAIL
    - CANCELLED
    - TIMEOUT
    - NOT_RUN
    - UNKNOWN
  preCandidateResultContract:
    NOT_STARTED:
      eligibleOnlyAfterReadyDoctorNonPass: true
      readyDoctorPassForbidden: true
      inProgressCommitForbidden: true
      candidateFreezeForbidden: true
      candidateAndTimeAnchors: null
      elapsedSeconds: 0
      reasonRequired: true
      passClaimed: false
  evidenceResultContract:
    PASS:
      exitCode: ZERO
      terminalResultRequired: true
    FAIL:
      exitCode: NON_ZERO_INTEGER
      terminalResultRequired: true
    TIMEOUT:
      exitCode: null
      artifactHash: null
      requiredFields:
        - reason
        - candidateCommit
        - candidateTree
        - budget
        - interruption
      passClaimed: false
    UNKNOWN:
      exitCode: null
      artifactHash: null
      requiredFields:
        - reason
        - candidateCommit
        - candidateTree
        - budget
        - interruption
      passClaimed: false
  exactShaCiCrossShaReuse: false
  exactTreeChannelCrossCommitOrTreeReuse: false
followUpTasks:
  idlePlanningCheckpointCore: TASK-0073
  idlePlanningCheckpointConsumers: TASK-0056
  harnessPerformance: TASK-0057
  pathAwareCi: TASK-0058
  snapshotReceipt: TASK-0059

schemaVersion: 2
runner: scripts/harness/precheck.py
commands:
  doctor:
    description: Validate project state, task context, Skills, protected paths, schemas, and diff scope
    argv: [scripts/harness/doctor.py]
    passTask: true
    timeoutSeconds: 900
  catalogValidate:
    description: Validate the Catalog sources
    argv: [scripts/harness/catalog_tool.py, validate]
    timeoutSeconds: 300
  catalogDrift:
    description: Regenerate Catalog outputs in a temporary directory and reject drift
    argv: [scripts/harness/catalog_tool.py, diff, --fail-on-drift]
    timeoutSeconds: 300
  openapiValidate:
    description: Validate the OpenAPI contract source
    argv: [scripts/dev/openapi_tool.py, validate]
    timeoutSeconds: 300
  openapiDrift:
    description: Regenerate OpenAPI outputs in a temporary directory and reject drift
    argv: [scripts/dev/openapi_tool.py, diff, --fail-on-drift]
    timeoutSeconds: 300
  paidFeatureCheck:
    description: Reject paid-only runtime prerequisites
    argv: [scripts/harness/check_paid_features.py]
    timeoutSeconds: 120
  licenseCheck:
    description: Verify all direct dependencies have allowed license families
    argv: [scripts/harness/check_licenses.py]
    timeoutSeconds: 120
  betaRosterGate:
    description: Keep generation closed unless the duty-roster structure is complete
    argv: [scripts/harness/check_beta_gate.py]
    timeoutSeconds: 120
  durableCommand:
    description: Launch one Windows PowerShell 7 command with an atomic durable receipt
    argv: [scripts/harness/durable_command.ps1]
    interpreter: POWERSHELL_7_WINDOWS
    profileEligible: false
    timeoutSeconds: 600
  harnessTests:
    description: Run the complete portable Harness unit and integration test suite
    argv: [scripts/harness/tests/test_harness.py]
    timeoutSeconds: 3600
profiles:
  precheck:
    - doctor
    - catalogValidate
    - catalogDrift
    - paidFeatureCheck
    - licenseCheck
    - betaRosterGate
    - openapiValidate
    - openapiDrift
  harnessPortabilityLocal:
    - harnessTests
    - doctor
    - catalogValidate
    - catalogDrift
    - paidFeatureCheck
    - betaRosterGate

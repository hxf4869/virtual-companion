schemaVersion: 2
states:
  - PLANNED
  - DRAFT
  - READY
  - IN_PROGRESS
  - BLOCKED
  - IN_REVIEW
  - ACCEPTED
  - REJECTED
  - SUPERSEDED
activeStates:
  - READY
  - IN_PROGRESS
  - BLOCKED
  - IN_REVIEW
terminalStates:
  - ACCEPTED
  - REJECTED
  - SUPERSEDED
transitions:
  PLANNED: [DRAFT, REJECTED, SUPERSEDED]
  DRAFT: [READY, REJECTED, SUPERSEDED]
  READY: [IN_PROGRESS, BLOCKED, REJECTED, SUPERSEDED]
  IN_PROGRESS: [BLOCKED, IN_REVIEW, REJECTED, SUPERSEDED]
  BLOCKED: [READY, IN_PROGRESS, REJECTED, SUPERSEDED]
  IN_REVIEW: [IN_PROGRESS, BLOCKED, ACCEPTED, REJECTED, SUPERSEDED]
  ACCEPTED: []
  REJECTED: []
  SUPERSEDED: []
rules:
  maximumActiveTasks: 1
  maximumPendingDraftTasks: 1
  plannedConsumesActiveTask: false
  plannedRequiresBacklogEntry: true
  plannedDynamicEvidenceForbidden: true
  planningTerminalStates: [REJECTED, SUPERSEDED]
  planningTerminalRequiresBacklogResolution: true
  planningTerminalConsumesTaskLedger: false
  readyRequiresOwnerApproval: true
  terminalRequiresEvidenceAndHandoff: true
  c3AndC4RequireIndependentReview: true

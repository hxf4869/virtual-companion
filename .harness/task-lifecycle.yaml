schemaVersion: 2
states:
  - PLANNED
  - DRAFT
  - READY
  - IN_PROGRESS
  - BLOCKED
  - IN_REVIEW
  - ACCEPTED
  - REJECTED
  - SUPERSEDED
activeStates:
  - READY
  - IN_PROGRESS
  - BLOCKED
  - IN_REVIEW
terminalStates:
  - ACCEPTED
  - REJECTED
  - SUPERSEDED
transitions:
  PLANNED: [DRAFT, REJECTED, SUPERSEDED]
  DRAFT: [READY, REJECTED]
  READY: [IN_PROGRESS, BLOCKED, REJECTED]
  IN_PROGRESS: [BLOCKED, IN_REVIEW, REJECTED]
  BLOCKED: [READY, IN_PROGRESS, REJECTED]
  IN_REVIEW: [IN_PROGRESS, BLOCKED, ACCEPTED, REJECTED]
  ACCEPTED: []
  REJECTED: []
  SUPERSEDED: []
rules:
  maximumActiveTasks: 1
  maximumPendingDraftTasks: 1
  plannedConsumesActiveTask: false
  plannedRequiresBacklogEntry: true
  plannedDynamicEvidenceForbidden: true
  planningTerminalStates: [REJECTED, SUPERSEDED]
  planningTerminalRequiresBacklogResolution: true
  planningTerminalConsumesTaskLedger: false
  backlogHistoryPolicy:
    activationCommit: 46278e80287d9f3d5d36e2033fa208f79f453b4b
    mode: VALIDATE_ACTIVATION_SNAPSHOT_THEN_ALL_PARENT_EDGES
  readyRequiresOwnerApproval: true
  terminalRequiresEvidenceAndHandoff: true
  c3AndC4RequireIndependentReview: true
  authorizationAmendments:
    machineSource: .harness/task-backlog.yaml
    taskCardProjectionField: scopeAmendments
    approvedBy: repository-owner
    singleParentAtomicCommitRequired: true
    uncommittedAuthorizationForbidden: true
    appendOnlyAndImmutable: true
    explicitClauseReplacementRequired: true
    canonicalExactPosixPathsRequired: true
    forbiddenPathsAlwaysWins: true

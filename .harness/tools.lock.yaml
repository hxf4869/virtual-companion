schemaVersion: 1
baselineDate: 2026-07-29
governance:
  python:
    minimum: "3.11"
    verifiedLine: "3.12.x"
  pyyaml:
    minimum: 6.0
    maximumExclusive: 7.0
    verifiedVersions: [6.0.1, 6.0.3]
  timezoneData:
    provider: SYSTEM_OR_TZDATA_PACKAGE
    requiredZone: Asia/Shanghai
runtime:
  java:
    distribution: Eclipse Temurin or compatible OpenJDK
    versionLine: 25-LTS
    fallback: 21-LTS_BY_ACCEPTED_ADR_ONLY
  maven:
    versionLine: 3.9.x
frameworks:
  springBoot: 4.1.x
  springAi: 2.0.x
  springModulith: 2.1.x
data:
  postgresql: 18.4
  pgvector: 0.8.5
frontend:
  node: UNI_APP_COMPATIBLE_LTS
  packageManager: LOCKFILE_REQUIRED
rules:
  snapshotsAllowed: false
  releaseCandidatesAllowed: false
  latestContainerTagsAllowed: false
  majorUpgradeRequiresAdr: true
  containerDigestRequiredForRelease: true

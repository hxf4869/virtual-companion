        - 跨 job、跨会话或跨提交的通用远端缓存服务
    forbidden:
      - 跨 SHA 复用终态 exact-SHA CI
      - 在 manifest 不完整、字段未知或输入无法证明相同时复用
      - 把失败、超时、取消或 NOT_RUN 复用为 PASS
      - 在 pre-closure 与真实提交 HEAD 之间互相复用结果
    acceptanceCriteria:
      - snapshot receipt 严格内容寻址并绑定完整 manifest，缺失、未知或不一致输入均失败关闭
      - 复用只发生于同一 job 或会话的调度决定且仅接受可验证 PASS
      - Evidence 可审计命中来源、原因、输入身份和结果状态，失败、超时、取消与 NOT_RUN 永不命中
      - 终态 exact-SHA CI 对当前实现 SHA 真实运行且不能由其他 SHA、pre-closure 或历史 receipt 替代
    promotionConditions:
      requiresRepositoryIdle: true
      requiresAcceptedDependencies: true
      requiresApprovedDecisionGates: true

tasks:
  TASK-0012:
    title: PLANNED 队列、Backlog 和 Harness 治理
    taskCard: docs/tasks/TASK-0012-planned-backlog-harness-governance.md
    dependencies:
      - TASK-0011
    decisionGates: []
    objective: 建立 Technical Alpha 唯一机器 Backlog、PLANNED 生命周期和失败关闭 Harness。
    scope:
      in:
        - Backlog、DAG、关键路径、晋级条件、永久 ID 和 PLANNED 卡
        - Sources of Truth、Invariants、Doctor、Precheck、测试和恢复文档
      out:
        - 后续任务业务实现
        - 数据库、真实外发和 Beta
    forbidden:
      - 多张 DRAFT 冒充规划队列
      - 第二套任务、ADR 或规划系统
    acceptanceCriteria:
      - TASK-0012 至 TASK-0036 的 25 个编号、名称和规划合同完整受控
      - 独立 Reviewer、跨平台检查和精确实现 CI 全部通过
    promotionConditions:
      requiresRepositoryIdle: true
      requiresAcceptedDependencies: true
      requiresApprovedDecisionGates: true
      requiresFirstByExecutionOrder: true
  TASK-0037:
    title: Harness 性能基线、分层验证与快照复用
    taskCard: docs/tasks/TASK-0037-harness-performance-layered-validation.md
    dependencies:
      - TASK-0012
    decisionGates: []
    objective: 在不弱化失败关闭、精确 SHA Evidence、历史不可变性或跨平台保障的前提下，缩短 Harness 治理与普通业务卡的反馈关键路径。
    scope:
      in:
        - 分阶段计时、慢项报告、同环境前后对比与可追溯性能基线
        - 迭代定向检查、终态全量验证和相同输入快照的可审计复用
        - 路径感知 CI、包装器 smoke、参考平台全量策略及临时 Git 历史 fixture、NTFS、WSL 跨盘扫描优化
        - 实测基线：本地完整 Harness 119 项 674.036s；PowerShell canonical 39118 checks 174.037s；WSL 载入 246.590s；GitHub Windows Harness 首轮 18m11s（job 90878411943）
      out:
        - 删除测试、增加跳过或弱化失败关闭、精确 SHA Evidence、历史不可变性和跨平台保障
        - 在 PLANNED 阶段冻结工具版本、精确命令或最终性能阈值
        - Provider、数据库、API、H5、身份、模型外发或其他业务功能
    forbidden:
      - 用路径感知或快照复用跳过终态精确 SHA 全量验证
      - 复用输入、工具链、环境或外部状态无法证明相同的结果
      - 让普通业务卡无条件串行运行三种跨平台全量包装器
    acceptanceCriteria:
      - 同一环境提供优化前后对比，测试删除数为零、跳过数不增加，并证明语义等价和失败关闭不变
      - 普通业务卡只冻结一个 canonical precheck 与受影响模块测试，跨平台全量仅用于 Harness 或可移植性变更
      - 终态全量和 CI 仍绑定精确实现 SHA，快照复用具有完整输入身份、命中原因和审计记录
      - 具体版本、动态命令和最终性能阈值只在 TASK-0037 晋级唯一 DRAFT 时基于最新 main 冻结
    promotionConditions:
      requiresRepositoryIdle: true
      requiresAcceptedDependencies: true
      requiresApprovedDecisionGates: true
      requiresFirstByExecutionOrder: true
  TASK-0038:
    title: 任务交付执行策略、双模式 Skill 与 AGENTS 入口
    taskCard: docs/tasks/TASK-0038-task-delivery-policy-skill-entrypoint.md
    dependencies:
      - TASK-0012
    decisionGates: []
    objective: 建立适用于单卡和长线严格串行协调的唯一机器交付策略、可复用操作规程与薄文档入口。
    scope:
      in:
        - 在 Harness 唯一机器策略中约束验证层级、风险分级 Reviewer、阶段预算、熔断、候选身份和长线串行条件
        - 注册双模式 task-delivery-flow Skill，并让 AGENTS 仅保留硬约束与机器策略、Skill 入口
        - 接入 Sources、Invariants、Doctor 和定向测试，并修复 idle planning checkpoint 与 planning-only resolution 的自举组合缺口
      out:
        - Harness 阶段计时、Git/history/fixture 与 NTFS/WSL 性能引擎
        - 路径感知 CI、包装器平台策略和内容寻址快照复用
        - Technical Alpha 产品功能、Provider、数据库、API、H5、身份或模型外发
    forbidden:
      - 只写说明文档或另建平行计划系统
      - 在 AGENTS 中复制机器策略或 Skill 正文
      - 用删测、skip、放宽失败关闭或无界 Reviewer 循环换取时延
    acceptanceCriteria:
      - 唯一机器策略被 Sources、Invariants、Doctor 和定向测试失败关闭地约束，并覆盖单卡与长线严格串行模式
      - task-delivery-flow Skill 通过仓库注册和 Skill 校验，AGENTS 只提供可审计薄入口
      - 规划态自举组合可端到端覆盖 idle checkpoint、planning-only resolution 与后续合法晋级
      - 具体 Skill 版本、动态命令和时间阈值只在本卡晋级唯一 DRAFT 时冻结
    promotionConditions:
      requiresRepositoryIdle: true
      requiresAcceptedDependencies: true
      requiresApprovedDecisionGates: true
      requiresFirstByExecutionOrder: true
  TASK-0039:
    title: Harness 阶段计时与跨文件系统性能引擎
    taskCard: docs/tasks/TASK-0039-harness-timing-cross-filesystem-performance.md
    dependencies:
      - TASK-0038
    decisionGates: []
    objective: 在语义等价和失败关闭不变的前提下，建立可审计慢项指标并缩短 Harness 在 Windows NTFS 与 WSL 跨盘场景的执行关键路径。
    scope:
      in:
        - 阶段计时、慢项报告以及 Git 命令和缓存命中指标
        - Context Lock 历史读取接入统一 snapshot，commit graph 与 ancestry 使用单次运行级缓存
        - Ledger 按 blob 内容寻址解析，并批量优化 Git/history/fixture 访问
        - Windows NTFS 与 WSL 临时本地文件系统的同环境前后性能对比
      out:
        - 路径感知 CI、包装器参考平台矩阵和 workflow 触发策略
        - 跨检查或跨提交的快照结果复用与 Evidence 复用门禁
        - Technical Alpha 产品功能或业务实现
    forbidden:
      - 通过增大 timeout、删除测试、增加 skip 或放宽失败关闭制造性能提升
      - 将易失的热点计数、精确命令、工具版本或最终性能阈值冻结在 PLANNED 卡
      - 用缓存掩盖 Git、历史、fixture 或 Ledger 输入变化
    acceptanceCriteria:
      - 阶段、Git 命令与缓存慢项可审计，优化前后在同一环境可复验
      - 统一 snapshot、运行级 ancestry 缓存和内容寻址 Ledger 解析保持历史不可变与失败关闭语义
      - Windows NTFS 与 WSL 本地临时文件系统均有代表性验证，测试删除数为零且 skip 不增加
      - 具体工具版本、动态命令和性能阈值只在本卡晋级唯一 DRAFT 后按实测冻结
    promotionConditions:
      requiresRepositoryIdle: true
      requiresAcceptedDependencies: true
      requiresApprovedDecisionGates: true
      requiresFirstByExecutionOrder: true
  TASK-0040:
    title: Harness 路径感知 CI 与包装器平台策略
    taskCard: docs/tasks/TASK-0040-harness-path-aware-ci-wrapper-strategy.md
    dependencies:
      - TASK-0039
    decisionGates: []
    objective: 让 CI 始终产生确定终态，并在 job 内按失败关闭的路径分类选择普通卡 smoke 与参考平台全量验证。
    scope:
      in:
        - workflow 始终触发并在 job 内执行失败关闭的路径分类
        - 未知或无法分类路径回退全量验证
        - Ubuntu 参考平台对精确 SHA 必跑全量 Harness
        - 普通业务卡在 Windows 与 macOS 只运行包装器 smoke，Harness 或可移植性变更升级完整矩阵
      out:
        - Harness 本地阶段计时、Git/history/fixture 与跨文件系统性能引擎
        - 内容寻址 snapshot receipt、结果复用和 Evidence 门禁
        - 产品构建、部署或发布策略
    forbidden:
      - 使用 workflow trigger paths 让 required check 长期 pending
      - 让未知路径静默跳过全量验证
      - 跳过 Ubuntu 参考平台精确 SHA 全量验证或把 smoke 冒充全量 PASS
    acceptanceCriteria:
      - 所有受治理提交都会触发 workflow 并得到可判定的 required check 终态
      - job 内分类失败时全量验证，未知路径有失败关闭测试
      - Ubuntu 精确 SHA 全量与 Windows、macOS 普通卡 wrapper smoke 的职责边界被机器测试约束
      - Harness 或可移植性变更能够确定性升级参考平台矩阵
    promotionConditions:
      requiresRepositoryIdle: true
      requiresAcceptedDependencies: true
      requiresApprovedDecisionGates: true
      requiresFirstByExecutionOrder: true
  TASK-0041:
    title: Harness 内容寻址快照复用与 Evidence 门禁
    taskCard: docs/tasks/TASK-0041-harness-snapshot-receipt-evidence-gate.md
    dependencies:
      - TASK-0040
    decisionGates: []
    objective: 以完整输入身份和可审计 receipt 约束同一调度上下文内的结果复用，同时保持终态 exact-SHA CI 不可跨 SHA 复用。
    scope:
      in:
        - 定义覆盖代码、任务合同、工具链、环境、外部状态和命令身份的完整 manifest
        - 仅允许在同一 job 或会话调度决定中对完整 manifest 相同的 PASS 结果生成内容寻址 snapshot receipt
        - 将复用命中原因、来源、输入身份和验证状态接入 Evidence 门禁
        - 明确 pre-closure 与真实提交 HEAD 是不同身份，终态 exact-SHA CI 始终绑定当前实现 SHA
      out:
        - Harness 阶段计时、Git/history/fixture 与 NTFS/WSL 性能引擎

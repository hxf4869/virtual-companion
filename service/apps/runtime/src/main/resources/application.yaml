spring:
  application:
    name: virtual-companion-runtime
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # The runtime enables its own DataSource only when the auth subsystem is
      # on (virtual-companion.auth.datasource-enabled=true) and injects
      # credentials through an approved channel (VC_DB_* env / secrets). Keeping
      # the auto DataSource excluded means the default context never demands a
      # live database, and a misconfigured deploy fails fast instead of probing.
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  flyway:
    # In-app Flyway runs with an explicit migrator datasource (VC_MIGRATOR_DB_*),
    # fully separate from the runtime datasource (VC_DB_*): a migration
    # principal applies db/migration while runtime code connects as the vc_*
    # minimal-privilege roles. Off by default so a plain runtime/test context
    # never requires a migration principal; the production profile forces an
    # explicit choice (see below). The readiness gate (SchemaReadinessHealth
    # Indicator) verifies the applied schema version against the classpath
    # migrations when in-app Flyway is enabled.
    enabled: ${VC_FLYWAY_ENABLED:false}
    url: ${VC_MIGRATOR_DB_URL:}
    user: ${VC_MIGRATOR_DB_USERNAME:}
    password: ${VC_MIGRATOR_DB_PASSWORD:}
    locations: classpath:db/migration
    fail-on-missing-locations: true

# REQUEST-ID (FR-CHAT-001): every log line carries the request_id correlation
# value populated by RequestIdFilter (MDC key requestId); empty outside a
# request (async worker logs fall back to their own generation/owner context).
logging:
  pattern:
    level: "%5p [req=%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

virtual-companion:
  baseline:
    phase: "@virtual-companion.phase@"
    transport: "@virtual-companion.transport@"
    java-version: "@virtual-companion.java-baseline@"
    spring-boot-version: "@spring-boot.version@"
    spring-ai-version: "@spring-ai.version@"
    spring-modulith-version: "@spring-modulith.version@"
  version:
    # GET /api/v1/version (OpenAPI getVersion). The version is the filtered
    # Maven project version; the commit is an optional deploy-time identity
    # (VC_COMMIT), never required so a local build serves the endpoint too.
    version: "@project.version@"
    commit: ${VC_COMMIT:}
  # S0-33 / §12.7 single-replica hard gate: the deployment must declare exactly
  # one runtime instance (default). Any explicit value other than 1 is refused
  # by SingleReplicaPreflightEnvironmentPostProcessor in EVERY profile, before
  # any bean exists; the runtime additionally enforces membership exclusivity
  # with a PostgreSQL advisory-lock lease (see RuntimeSingletonLease).
  runtime:
    replicas: ${VC_RUNTIME_REPLICAS:1}
  # S0-04/S0-24: generation admission. Beta generation stays off; required
  # consents are empty until product/legal freeze the set. enforce=false skips
  # only adult/consent/Beta-switch checks; the durable release gate always
  # applies. Turning the Beta window on also enforces adult/consent.
  beta:
    generation-enabled: ${VC_BETA_GENERATION_ENABLED:false}
  admission:
    enforce: ${VC_ADMISSION_ENFORCE:false}
    required-consent-types: ${VC_ADMISSION_REQUIRED_CONSENTS:}
  # S0-07: real moderation default-off. Hard rules always run.
  # DOGFOOD-04 (ADR-0006 §5): mode picks the remote family; both share the
  # same base-url semantics (OpenAI-compatible root, e.g. .../v1):
  # - chat-completions: POST {base-url}/chat/completions with a strict JSON
  #   classification prompt, minimal output budget and no persona/memory
  #   context (for channels without /moderations, e.g. WeChat ChatAPI —
  #   endpoint/credential only via env injection, never defaulted here).
  #   Dogfood 用这一模式（ops/deploy/.env.example 注入 chat-completions）。
  # - openai-moderations: REFUSED at wiring this round (DOGFOOD-STABILIZATION
  #   -02) — its client lacks the egress allowlist / DNS-rebinding guard /
  #   bounded response body that chat-completions enforces, so the reachable
  #   configuration is rejected instead of shipping an unprotected default
  #   path. Re-enable only together with equal protections.
  # chat-completions fails closed below the fixed 0.80 adequate-confidence
  # threshold. Streaming incremental review is always local deterministic,
  # regardless of mode. At most one INPUT and one FINAL remote call per turn.
  moderation:
    enabled: ${VC_MODERATION_ENABLED:false}
    mode: ${VC_MODERATION_MODE:chat-completions}
    base-url: ${VC_MODERATION_BASE_URL:}
    model: ${VC_MODERATION_MODEL:omni-moderation-latest}
    provider-ref: ${VC_MODERATION_PROVIDER_REF:}
    model-version: ${VC_MODERATION_MODEL_VERSION:}
    api-key: ${VC_MODERATION_API_KEY:}
    # ADR-0006 §4.3: stays false until the Owner provides verifiable provider
    # terms; while false the remote safety leg only sees locally clean text.
    provider-terms-verified: ${VC_MODERATION_PROVIDER_TERMS_VERIFIED:false}
    # Exact host allowlist for the moderation endpoint (beyond the built-in
    # approved set); empty means only the built-in set + loopback.
    allowed-hosts: ${VC_MODERATION_ALLOWED_HOSTS:}
  # S0-09: real embeddings default-off. External calls additionally require
  # current THIRD_PARTY_MODEL_PROCESSING + SENSITIVE_DATA_PROCESSING consents.
  embedding:
    enabled: ${VC_EMBEDDING_ENABLED:false}
    base-url: ${VC_EMBEDDING_BASE_URL:}
    model: ${VC_EMBEDDING_MODEL:}
    model-version: ${VC_EMBEDDING_MODEL_VERSION:}
    dimension: ${VC_EMBEDDING_DIMENSION:64}
    space-id: ${VC_EMBEDDING_SPACE_ID:}
    api-key: ${VC_EMBEDDING_API_KEY:}
    reembed-enabled: ${VC_EMBEDDING_REEMBED_ENABLED:false}
    source-space-id: ${VC_EMBEDDING_SOURCE_SPACE_ID:alpha-hash-64}
    reembed-batch-size: ${VC_EMBEDDING_REEMBED_BATCH_SIZE:16}
    reembed-drain-ms: ${VC_EMBEDDING_REEMBED_DRAIN_MS:30000}
  # S0-12: real age verification default-off. No document or biometric payload
  # is accepted by this runtime; only an HMAC-pseudonymous subject is sent.
  age-provider:
    enabled: ${VC_AGE_PROVIDER_ENABLED:false}
    endpoint: ${VC_AGE_PROVIDER_ENDPOINT:}
    api-key: ${VC_AGE_PROVIDER_API_KEY:}
    provider-ref: ${VC_AGE_PROVIDER_REF:}
    provider-version: ${VC_AGE_PROVIDER_VERSION:}
    subject-secret: ${VC_AGE_PROVIDER_SUBJECT_SECRET:}
    allowed-hosts: ${VC_AGE_PROVIDER_ALLOWED_HOSTS:}
  # METRICS-ALERT / S0-31-A: outbox plus provider-specific authentication.
  # Generic/custom-bot URL and all credentials are deployment-injected.
  # A blank provider target disables posting; metrics stay exposed.
  alerts:
    webhook-url: ${VC_ALERT_WEBHOOK_URL:}
    webhook-provider: ${VC_ALERT_WEBHOOK_PROVIDER:generic}
    webhook-secret: ${VC_ALERT_WEBHOOK_SECRET:}
    feishu-app-id: ${VC_ALERT_FEISHU_APP_ID:}
    feishu-app-secret: ${VC_ALERT_FEISHU_APP_SECRET:}
    feishu-chat-id: ${VC_ALERT_FEISHU_CHAT_ID:}
    webhook-allowed-hosts: ${VC_ALERT_WEBHOOK_ALLOWED_HOSTS:}
    # Independent generic signed webhook. Blank keeps the fallback disabled;
    # it never reuses the primary URL, secret or Feishu target.
    fallback:
      webhook-url: ${VC_ALERT_FALLBACK_WEBHOOK_URL:}
      webhook-secret: ${VC_ALERT_FALLBACK_WEBHOOK_SECRET:}
      webhook-allowed-hosts: ${VC_ALERT_FALLBACK_WEBHOOK_ALLOWED_HOSTS:}
      connect-timeout: ${VC_ALERT_FALLBACK_CONNECT_TIMEOUT:2s}
    webhook-max-attempts: 5
    webhook-backoff-seconds: 5
    webhook-drain-ms: 5000
    connect-timeout: 2s
    throttle-millis: 60000
    r3-sla-hours: 24
    r4-sla-hours: 1
  # RETENTION (§16.7 / R48): categorized purge over the versioned
  # data_retention_policy (V70). Opt-in — the seeded v1 periods are a DRAFT
  # pending Owner/legal review; flip to true only after that review.
  retention:
    enabled: ${VC_RETENTION_PURGE_ENABLED:false}
    dry-run: ${VC_RETENTION_DRY_RUN:true}
    purge-cron: "0 47 3 * * *"
  # S0-31: durable job-run freshness. Fixed metadata only; stale/hung jobs
  # emit fixed operational codes through the durable alert outbox.
  jobs:
    health-poll-ms: ${VC_JOB_HEALTH_POLL_MS:60000}
    health-initial-delay-ms: ${VC_JOB_HEALTH_INITIAL_DELAY_MS:60000}
    dau-stale-seconds: ${VC_JOB_DAU_STALE_SECONDS:300}
    export-stale-seconds: ${VC_JOB_EXPORT_STALE_SECONDS:300}
    auth-purge-stale-seconds: ${VC_JOB_AUTH_PURGE_STALE_SECONDS:93600}
    retention-stale-seconds: ${VC_JOB_RETENTION_STALE_SECONDS:93600}
  # DATA-EXPORT (V42/V109): one-time download TTL and the expiry sweep
  # cadence. object-storage (DOGFOOD-02, ADR-0006 §7.3) is opt-in — when
  # enabled the export document lives in the local MinIO private bucket
  # instead of the inline payload column. Enabled requires every key below
  # (fail-closed at wiring); credentials only come from deployment env.
  data-export:
    ttl-seconds: ${VC_EXPORT_TTL_SECONDS:86400}
    expiry-poll-delay-ms: ${VC_EXPORT_EXPIRY_POLL_MS:60000}
    object-storage:
      enabled: ${VC_EXPORT_S3_ENABLED:false}
      endpoint: ${VC_EXPORT_S3_ENDPOINT:}
      access-key: ${VC_EXPORT_S3_ACCESS_KEY:}
      secret-key: ${VC_EXPORT_S3_SECRET_KEY:}
      bucket: ${VC_EXPORT_S3_BUCKET:}
  # CRYPTO-REST (§17.4): at-rest key injected by deployment; the shipped
  # default is development-only and rejected in the production profile.
  crypto:
    rest-key: ${VC_CRYPTO_REST_KEY:ZGV2LW9ubHktYWxwaGEta2V5LWRvLW5vdC11c2UtaW4=}
    # One-shot, idempotent upgrade bridge for pre-encryption data.  Keep false
    # during normal operation; the readiness gate refuses stale summaries.
    backfill-enabled: ${VC_CRYPTO_BACKFILL_ENABLED:false}
    # S0-17-B: generic key id/version. Single-write always uses this slot;
    # dual-read also accepts enc1: and the optional previous slot.
    rest-key-id: ${VC_CRYPTO_REST_KEY_ID:default}
    rest-key-version: ${VC_CRYPTO_REST_KEY_VERSION:1}
    previous-rest-key: ${VC_CRYPTO_PREVIOUS_REST_KEY:}
    previous-rest-key-id: ${VC_CRYPTO_PREVIOUS_REST_KEY_ID:}
    previous-rest-key-version: ${VC_CRYPTO_PREVIOUS_REST_KEY_VERSION:0}
  auth:
    # Master switch for the self-hosted identity component. Off by default so a
    # plain runtime context (tests, baseline) needs no secret and no database.
    enabled: ${VC_AUTH_ENABLED:false}
    # When true (and auth.enabled=true) the runtime wires a DataSource and the
    # V14 SECURITY DEFINER identity repositories. Credentials come from env.
    datasource-enabled: ${VC_AUTH_DATASOURCE_ENABLED:false}
    enforce-db-least-privilege: ${VC_ENFORCE_DB_LEAST_PRIVILEGE:false}
    shared-rate-enabled: ${VC_SHARED_RATE_LIMIT_ENABLED:false}
    shared-rate-secret: ${VC_SHARED_RATE_LIMIT_SECRET:}
    # HMAC-SHA256 signing secret (>= 256 bits). Injected via env/secrets; never
    # committed. An empty value fails closed at bean creation.
    jwt-secret: ${VC_JWT_SECRET:}
    # TASK-0191: key material (>= 32 bytes, independent random value, never
    # derived from the DB password) for the V27 owner-context HMAC binding the
    # runtime proves to vc.set_owner_context. The same value seeds/verifies the
    # restricted vc._owner_binding_secret table via bound parameters during the
    # migrator startup phase. Never logged, never committed.
    owner-binding-secret: ${VC_OWNER_BINDING_SECRET:}
    access-token-ttl: ${VC_ACCESS_TOKEN_TTL:2h}
    refresh-token-ttl: ${VC_REFRESH_TOKEN_TTL:7d}
    issuer: ${VC_AUTH_ISSUER:virtual-companion}
    # Secure flag on the vc_refresh/vc_csrf session cookies. True in production;
    # local HTTP development may set VC_AUTH_COOKIE_SECURE=false, but the
    # production profile rejects an explicit false at startup (fail-closed).
    cookie-secure: ${VC_AUTH_COOKIE_SECURE:true}
    # S0-06 exact Origin allow-list (http(s) origin strings). Same-origin Caddy
    # is the frozen H5/API deploy; compose injects https://$VC_DOMAIN. Wildcard
    # and path origins fail closed at parse. Unknown Origin is rejected; a
    # curl/server client without an Origin is unaffected.
    cors-allowed-origins: ${VC_CORS_ALLOWED_ORIGINS:}
    admin-seed:
      # Platform-init ADMIN account. All three must be injected together; when
      # blank the bootstrap seed is skipped. Never committed to the repository.
      username: ${VC_ADMIN_USERNAME:}
      password: ${VC_ADMIN_PASSWORD:}
      display-name: ${VC_ADMIN_DISPLAY_NAME:Platform Administrator}
    datasource:
      url: ${VC_DB_URL:}
      username: ${VC_DB_USERNAME:}
      password: ${VC_DB_PASSWORD:}
  model-providers:
    # Master switch for the approved live model providers {OpenAI Chat
    # Completions, Anthropic Messages} (TASK-0035). Off by default: a plain
    # runtime wires no live provider, so every external attempt fails closed at
    # routing with no eligible deployment and no credential is ever read.
    enabled: ${VC_MODEL_PROVIDERS_ENABLED:false}
    # DOGFOOD-STABILIZATION-03 (audit defect B): while the GENERATION
    # provider's terms are unverified (Owner has not confirmed the channel's
    # data-processing terms, default false), every outbound MESSAGE_TEXT —
    # current turn and history — must pass the local sensitive-data detector
    # before any provider HTTP (fail closed, zero calls on a hit, independent
    # of VC_MODERATION_ENABLED). Flip to true only after the Owner verifies
    # the terms and records the immutable model revision.
    generation-provider-terms-verified: ${VC_GENERATION_PROVIDER_TERMS_VERIFIED:false}
    budget-monthly-usd: ${VC_MODEL_BUDGET_MONTHLY_USD:0}
    budget-reservation-output-tokens: ${VC_MODEL_BUDGET_RESERVATION_OUTPUT_TOKENS:8192}
    # Directory holding Docker-style secret files (default /run/secrets on
    # Linux deployments). Local/Windows development may instead set
    # VC_MODEL_SECRET_<NAME> environment variables, where <NAME> is the
    # upper-cased credential-secret reference with '-' replaced by '_'.
    # The concrete approved deployments (provider-id / protocol /
    # supplier-name / model / endpoint / credential-secret / ...) are supplied
    # by the operator at deploy time, never committed here.
  zero-llm:
    # TASK-0176: deterministic ZERO_LLM completion path. When true (and
    # model-providers.enabled != true) the runtime wires a LiveModelInvoker whose
    # only reachable branch is the deterministic source, so a claimed generation
    # finalizes to COMPLETED with the fixed safety fallback response and no real
    # provider call. Off by default so a plain runtime context stays free of any
    # model runtime beans; mutually exclusive with model-providers.enabled=true
    # (real providers take precedence when enabled).
    enabled: ${VC_ZERO_LLM_ENABLED:false}
    # Stable identifier recorded as the deterministic source id / decision
    # identity (audit only; never a credential or model name).
    source-id: ${VC_ZERO_LLM_SOURCE_ID:ZERO_LLM_FALLBACK}
  # DOGFOOD-05 (ADR-0006 §3.3): dynamic provider plan — private, applicability-
  # windowed quota facts only. The plan never gates an outbound (the Owner
  # canary continues while UNKNOWN); missing caps stay null and are never
  # read as zero. All values live in machine-local private configuration.
  provider-plan:
    enabled: ${VC_PROVIDER_PLAN_ENABLED:false}
    plan-name: ${VC_PROVIDER_PLAN_NAME:}
    valid-from: ${VC_PROVIDER_PLAN_VALID_FROM:}
    valid-until: ${VC_PROVIDER_PLAN_VALID_UNTIL:}
    token-cap: ${VC_PROVIDER_PLAN_TOKEN_CAP:}
    request-cap: ${VC_PROVIDER_PLAN_REQUEST_CAP:}
  external-attempt:
    # TASK-0177: tunes the external-attempt RoutingRequest so the router selects
    # an admitted deployment of this protocol when the external persistence path
    # is exercised. TASK-0181 completes the runtime path: the dual authorization
    # snapshot creation now runs through the V26 create_authorization_snapshots
    # SECURITY DEFINER function (V16 revoked direct INSERT on authorization_snapshot
    # from every runtime role), so the external branch is runtime-active when
    # model-providers.enabled=true.
    protocol: ${VC_EXTERNAL_PROTOCOL:OPENAI_CHAT_COMPLETIONS}
    # TASK-0181: the authorization intent minted into both snapshots. The
    # provider id is derived at runtime from the registry with the router's
    # candidate rule (admitted deployments of the configured protocol); these
    # four values describe the attempt's region / contract / purpose / data
    # categories. Defaults align with the infra/db test 67/68 fixtures.
    region: ${VC_EXTERNAL_REGION:us}
    contract-ref: ${VC_EXTERNAL_CONTRACT:alpha-standard}
    purpose: ${VC_EXTERNAL_PURPOSE:COMPANION_CHAT}
    data-categories: ${VC_EXTERNAL_CATEGORIES:MESSAGE_TEXT}
    # EXTERNAL-TIMEOUT: real-provider budget for the external attempt path
    # (reasoning-model scaffolds consume time before the first content delta).
    # The defaults are generous so a local real-model deployment works out of
    # the box; tighten per deployment as latency is measured. COUPLING:
    # timeout-total plus the finalize segments must stay under
    # worker.external-claim-lease-seconds or the claim lease expires mid-flight
    # again (the bug EXTERNAL-LEASE fixed).
    timeout-connect: ${VC_EXTERNAL_TIMEOUT_CONNECT:10s}
    timeout-first-token: ${VC_EXTERNAL_TIMEOUT_FIRST_TOKEN:60s}
    timeout-total: ${VC_EXTERNAL_TIMEOUT_TOTAL:240s}
  worker:
    # EXTERNAL-LEASE: per-item claim lease applied when a GENERATION work
    # item crosses into the external provider phase (prepared external attempt
    # intent persisted). Real providers — reasoning models especially — can
    # exceed the 30s default claim lease; an expiry mid-flight would reject the
    # finalize segments and let the coordinator re-claim the item (duplicate
    # provider calls). Renewed once per external attempt, inside the prepare
    # transaction; the 30s default still covers every other work-item kind.
    # COUPLING: this lease is renewed once before the outbound, so it must
    # cover external-attempt.timeout-total plus the finalize segments — raise
    # it in lockstep whenever timeout-total grows past it.
    external-claim-lease-seconds: ${VC_WORKER_EXTERNAL_LEASE_SECONDS:300}
    # GEN-RECONC: cadence of the stale-IN_PROGRESS reconcile poll.
    reconcile-poll-delay-ms: ${VC_WORKER_RECONCILE_POLL_DELAY_MS:30000}
  context-budget:
    # CTX-BUDGET: deterministic input-token budget for one generation turn
    # (ContextBudget wired into the live invocation assembler). History is
    # filled most-recent-first and cut at the budget; the recall block gets a
    # third of the input budget. The estimate is UTF-8 bytes / 4 — provider
    # neutral and conservative, tuned per deployment as providers are admitted.
    max-input-tokens: ${VC_CONTEXT_MAX_INPUT_TOKENS:8000}
    max-output-tokens: ${VC_CONTEXT_MAX_OUTPUT_TOKENS:2048}
    max-turns: ${VC_CONTEXT_MAX_TURNS:64}

---
# 条件风险 3（TASK-0102）：production profile 强制认证与数据源开启。两个开关
# 在该 profile 下没有默认值——缺少 VC_AUTH_ENABLED / VC_AUTH_DATASOURCE_ENABLED
# 环境变量时占位符解析失败，应用启动即失败（fail-closed，绝不静默降级为关闭）。
# 显式 false 同样被 ProductionFailClosedConfig 拒绝：部署政策要求两者为 true。
# P1-11（TASK-0155）：同一 profile 强制显式声明迁移开关与 migrator 凭据——
# VC_FLYWAY_ENABLED 与 VC_MIGRATOR_DB_URL/USERNAME/PASSWORD 缺失同样启动失败，
# 不允许「未迁移/无法迁移」的静默部署状态。
spring:
  config:
    activate:
      on-profile: production
  flyway:
    enabled: ${VC_FLYWAY_ENABLED}
    url: ${VC_MIGRATOR_DB_URL}
    user: ${VC_MIGRATOR_DB_USERNAME}
    password: ${VC_MIGRATOR_DB_PASSWORD}
virtual-companion:
  auth:
    enabled: ${VC_AUTH_ENABLED}
    datasource-enabled: ${VC_AUTH_DATASOURCE_ENABLED}
    enforce-db-least-privilege: ${VC_ENFORCE_DB_LEAST_PRIVILEGE}
    shared-rate-enabled: ${VC_SHARED_RATE_LIMIT_ENABLED}
    shared-rate-secret: ${VC_SHARED_RATE_LIMIT_SECRET}
    # TASK-0191: production has no default -- a missing VC_OWNER_BINDING_SECRET
    # fails startup (fail-closed), matching the jwt/migrator pattern above.
    owner-binding-secret: ${VC_OWNER_BINDING_SECRET}

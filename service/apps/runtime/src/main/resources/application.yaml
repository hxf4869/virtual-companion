spring:
  application:
    name: virtual-companion-runtime
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # The runtime enables its own DataSource only when the auth subsystem is
      # on (virtual-companion.auth.datasource-enabled=true) and injects
      # credentials through an approved channel (VC_DB_* env / secrets). Keeping
      # the auto DataSource excluded means the default context never demands a
      # live database, and a misconfigured deploy fails fast instead of probing.
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  flyway:
    # In-app Flyway runs with an explicit migrator datasource (VC_MIGRATOR_DB_*),
    # fully separate from the runtime datasource (VC_DB_*): a migration
    # principal applies db/migration while runtime code connects as the vc_*
    # minimal-privilege roles. Off by default so a plain runtime/test context
    # never requires a migration principal; the production profile forces an
    # explicit choice (see below). The readiness gate (SchemaReadinessHealth
    # Indicator) verifies the applied schema version against the classpath
    # migrations when in-app Flyway is enabled.
    enabled: ${VC_FLYWAY_ENABLED:false}
    url: ${VC_MIGRATOR_DB_URL:}
    user: ${VC_MIGRATOR_DB_USERNAME:}
    password: ${VC_MIGRATOR_DB_PASSWORD:}
    locations: classpath:db/migration
    fail-on-missing-locations: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

virtual-companion:
  baseline:
    phase: "@virtual-companion.phase@"
    transport: "@virtual-companion.transport@"
    java-version: "@virtual-companion.java-baseline@"
    spring-boot-version: "@spring-boot.version@"
    spring-ai-version: "@spring-ai.version@"
    spring-modulith-version: "@spring-modulith.version@"
  auth:
    # Master switch for the self-hosted identity component. Off by default so a
    # plain runtime context (tests, baseline) needs no secret and no database.
    enabled: ${VC_AUTH_ENABLED:false}
    # When true (and auth.enabled=true) the runtime wires a DataSource and the
    # V14 SECURITY DEFINER identity repositories. Credentials come from env.
    datasource-enabled: ${VC_AUTH_DATASOURCE_ENABLED:false}
    # HMAC-SHA256 signing secret (>= 256 bits). Injected via env/secrets; never
    # committed. An empty value fails closed at bean creation.
    jwt-secret: ${VC_JWT_SECRET:}
    access-token-ttl: ${VC_ACCESS_TOKEN_TTL:2h}
    refresh-token-ttl: ${VC_REFRESH_TOKEN_TTL:7d}
    issuer: ${VC_AUTH_ISSUER:virtual-companion}
    # Secure flag on the vc_refresh/vc_csrf session cookies. True in production;
    # local HTTP development may set VC_AUTH_COOKIE_SECURE=false (never in prod).
    cookie-secure: ${VC_AUTH_COOKIE_SECURE:true}
    # Alpha Origin allow-list (host-origin strings). Requests with an unknown
    # Origin are rejected; a curl/server client without an Origin is unaffected.
    cors-allowed-origins: ${VC_CORS_ALLOWED_ORIGINS:}
    admin-seed:
      # Platform-init ADMIN account. All three must be injected together; when
      # blank the bootstrap seed is skipped. Never committed to the repository.
      username: ${VC_ADMIN_USERNAME:}
      password: ${VC_ADMIN_PASSWORD:}
      display-name: ${VC_ADMIN_DISPLAY_NAME:Platform Administrator}
    datasource:
      url: ${VC_DB_URL:}
      username: ${VC_DB_USERNAME:}
      password: ${VC_DB_PASSWORD:}
  model-providers:
    # Master switch for the approved live model providers {OpenAI Chat
    # Completions, Anthropic Messages} (TASK-0035). Off by default: a plain
    # runtime wires no live provider, so every external attempt fails closed at
    # routing with no eligible deployment and no credential is ever read.
    enabled: ${VC_MODEL_PROVIDERS_ENABLED:false}
    # Directory holding Docker-style secret files (default /run/secrets on
    # Linux deployments). Local/Windows development may instead set
    # VC_MODEL_SECRET_<NAME> environment variables, where <NAME> is the
    # upper-cased credential-secret reference with '-' replaced by '_'.
    # The concrete approved deployments (provider-id / protocol /
    # supplier-name / model / endpoint / credential-secret / ...) are supplied
    # by the operator at deploy time, never committed here.
  zero-llm:
    # TASK-0176: deterministic ZERO_LLM completion path. When true (and
    # model-providers.enabled != true) the runtime wires a LiveModelInvoker whose
    # only reachable branch is the deterministic source, so a claimed generation
    # finalizes to COMPLETED with the fixed safety fallback response and no real
    # provider call. Off by default so a plain runtime context stays free of any
    # model runtime beans; mutually exclusive with model-providers.enabled=true
    # (real providers take precedence when enabled).
    enabled: ${VC_ZERO_LLM_ENABLED:false}
    # Stable identifier recorded as the deterministic source id / decision
    # identity (audit only; never a credential or model name).
    source-id: ${VC_ZERO_LLM_SOURCE_ID:ZERO_LLM_FALLBACK}

---
# 条件风险 3（TASK-0102）：production profile 强制认证与数据源开启。两个开关
# 在该 profile 下没有默认值——缺少 VC_AUTH_ENABLED / VC_AUTH_DATASOURCE_ENABLED
# 环境变量时占位符解析失败，应用启动即失败（fail-closed，绝不静默降级为关闭）。
# P1-11（TASK-0155）：同一 profile 强制显式声明迁移开关与 migrator 凭据——
# VC_FLYWAY_ENABLED 与 VC_MIGRATOR_DB_URL/USERNAME/PASSWORD 缺失同样启动失败，
# 不允许「未迁移/无法迁移」的静默部署状态。
spring:
  config:
    activate:
      on-profile: production
  flyway:
    enabled: ${VC_FLYWAY_ENABLED}
    url: ${VC_MIGRATOR_DB_URL}
    user: ${VC_MIGRATOR_DB_USERNAME}
    password: ${VC_MIGRATOR_DB_PASSWORD}
virtual-companion:
  auth:
    enabled: ${VC_AUTH_ENABLED}
    datasource-enabled: ${VC_AUTH_DATASOURCE_ENABLED}

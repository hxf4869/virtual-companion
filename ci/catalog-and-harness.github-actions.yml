name: catalog-and-harness
on:
  pull_request:
  push:
    branches: [main]
jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-harness.txt
      - run: bash scripts/harness/precheck.sh

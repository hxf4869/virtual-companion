<!DOCTYPE html>
<!-- DOGFOOD-09（ADR-0006 §1.4）：lang 声明简体中文；不禁用用户缩放，
     系统字体放大与手动捏合缩放必须可用（可访问性验收项）。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, initial-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title>AI 陪伴 · 内部测试版</title>
    <!-- H5-HARDEN (§21.7)：Technical Alpha 不对公众开放——禁止搜索收录；
         Referer 不随外链外泄；分享卡片只用静态文案，绝不含聊天内容。 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:title" content="AI 陪伴 · 内部测试版" />
    <meta property="og:description" content="受控测试中的 AI 陪伴服务，不对公众开放注册。" />
    <meta property="og:type" content="website" />
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

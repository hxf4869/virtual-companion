OWN-WORLD: 灰绿织面承托近白内容面，紫罗兰只连接当前选择与唯一主动作；鼠尾草绿表达关系延续，珊瑚色只标示待处理事实。布局以细缝、结点和开放列表形成连续感，不复制通用卡片墙。

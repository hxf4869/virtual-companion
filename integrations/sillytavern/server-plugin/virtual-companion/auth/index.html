<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>登录</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="index.js"></script>
</head>
<body>
  <main class="auth-panel">
    <div class="auth-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div>
    <h1 id="auth-title">登录</h1>

    <form id="login-form" class="step">
      <div class="step-body">
        <div class="group-card">
          <div class="field">
            <input id="account" name="account" type="text" autocomplete="username" aria-label="用户名" placeholder="用户名">
          </div>
          <div class="field">
            <input id="password" name="password" type="password" autocomplete="current-password" aria-label="密码" placeholder="密码">
          </div>
        </div>
        <p class="field-error" role="alert" hidden></p>
      </div>
      <div class="thumb"><button type="submit" class="primary">继续</button></div>
    </form>

    <section id="verify-step" class="step" hidden>
      <div class="step-body">
      <div id="setup-block" hidden>
        <a id="add-authenticator">添加到验证器</a>
        <button type="button" id="show-qr" class="text" aria-expanded="false">二维码</button>
        <div id="setup-qr-frame" class="qr-frame">
          <img id="setup-qr" alt="" width="200" height="200">
        </div>
        <div class="secret-line">
          <code id="setup-secret"></code>
          <button type="button" id="copy-secret" class="secret-copy" aria-label="复制"><svg class="icon icon-copy" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg><svg class="icon icon-check" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span class="copy-label sr-only">复制</span></button>
        </div>
      </div>
      <form id="verify-form">
        <div class="field">
          <label id="code-label" class="sr-only" for="code">验证码</label>
          <div class="otp">
            <div class="otp-cells" aria-hidden="true"><span class="otp-cell"></span><span class="otp-cell"></span><span class="otp-cell"></span><span class="otp-cell"></span><span class="otp-cell"></span><span class="otp-cell"></span></div>
            <input id="code" class="otp-input" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" aria-label="验证码" placeholder="验证码">
          </div>
          <p id="auth-error" class="field-error" role="alert" hidden></p>
        </div>
        <div class="group-card">
          <label class="switch">
            <span>信任此设备 90 天</span>
            <input id="trust-device" type="checkbox">
            <span class="track" aria-hidden="true"></span>
          </label>
        </div>
      </form>
      <div class="text-row">
        <button type="button" id="use-recovery" class="text">使用恢复码</button>
        <button type="button" id="back-login" class="text">返回登录</button>
      </div>
      </div>
      <div class="thumb">
        <button type="submit" id="verify-submit" class="primary" form="verify-form" disabled>验证</button>
      </div>
    </section>

    <section id="password-step" class="step" hidden>
      <form id="password-form">
        <div class="step-body">
        <div class="group-card">
          <div class="field">
            <input id="current-password" name="current-password" type="password" autocomplete="current-password" aria-label="当前密码" placeholder="当前密码">
          </div>
          <div class="field">
            <input id="new-password" name="new-password" type="password" autocomplete="new-password" aria-label="新密码" placeholder="新密码">
          </div>
          <div class="field">
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" aria-label="确认新密码" placeholder="确认新密码">
          </div>
        </div>
        <p class="field-error" role="alert" hidden></p>
        </div>
        <div class="thumb"><button type="submit" class="primary">修改密码</button></div>
      </form>
    </section>

    <section id="recovery-step" class="step" hidden>
      <div class="step-body">
      <div class="group-card">
        <ul id="recovery-codes" class="recovery-grid"></ul>
      </div>
      <div class="secondary-row">
        <button type="button" id="copy-recovery" class="secondary"><svg class="icon icon-copy" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg><svg class="icon icon-check" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span class="copy-label">复制全部</span></button>
        <button type="button" id="download-recovery" class="secondary"><svg class="icon icon-download" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg><span>下载</span></button>
      </div>
      <p class="field-error" role="alert" hidden></p>
      </div>
      <div class="thumb"><button type="button" id="finish-login" class="primary" disabled>已保存，进入</button></div>
    </section>
  </main>
</body>
</html>

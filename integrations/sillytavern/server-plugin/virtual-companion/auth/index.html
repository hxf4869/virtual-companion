<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>登录</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="index.js"></script>
</head>
<body>
  <main class="auth-panel">
    <h1 id="auth-title">登录</h1>

    <form id="login-form" class="step">
      <div class="field">
        <label for="account">用户名</label>
        <input id="account" name="account" type="text" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <p class="field-error" role="alert" hidden></p>
      <div class="thumb"><button type="submit" class="primary">继续</button></div>
    </form>

    <section id="verify-step" class="step" hidden>
      <div id="setup-block" hidden>
        <div id="setup-qr-frame" class="qr-frame">
          <img id="setup-qr" alt="" width="200" height="200">
        </div>
        <button type="button" id="show-qr" class="text" aria-expanded="false">二维码</button>
        <div class="secret-line">
          <code id="setup-secret"></code>
          <button type="button" id="copy-secret" class="text">复制</button>
        </div>
      </div>
      <form id="verify-form">
        <div class="field">
          <label id="code-label" for="code">验证码</label>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false">
          <p id="auth-error" class="field-error" role="alert" hidden></p>
        </div>
        <label class="switch">
          <input id="trust-device" type="checkbox">
          <span class="track" aria-hidden="true"></span>
          <span>信任此设备 90 天</span>
        </label>
      </form>
      <div class="text-row">
        <button type="button" id="use-recovery" class="text">使用恢复码</button>
        <button type="button" id="back-login" class="text">返回登录</button>
      </div>
      <div class="thumb">
        <a id="add-authenticator" class="primary">添加到验证器</a>
        <button type="submit" id="verify-submit" class="primary" form="verify-form">验证</button>
      </div>
    </section>

    <section id="password-step" class="step" hidden>
      <form id="password-form">
        <div class="field">
          <label for="current-password">当前密码</label>
          <input id="current-password" name="current-password" type="password" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="new-password">新密码</label>
          <input id="new-password" name="new-password" type="password" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm-password">确认新密码</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password">
        </div>
        <p class="field-error" role="alert" hidden></p>
        <div class="thumb"><button type="submit" class="primary">修改密码</button></div>
      </form>
    </section>

    <section id="recovery-step" class="step" hidden>
      <ul id="recovery-codes" class="recovery-grid"></ul>
      <div class="text-row">
        <button type="button" id="copy-recovery" class="text">复制全部</button>
        <button type="button" id="download-recovery" class="text">下载 .txt</button>
      </div>
      <p class="field-error" role="alert" hidden></p>
      <div class="thumb"><button type="button" id="finish-login" class="primary" disabled>已保存，进入</button></div>
    </section>
  </main>
</body>
</html>

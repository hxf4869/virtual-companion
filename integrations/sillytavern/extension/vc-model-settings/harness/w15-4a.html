<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>W15-4a 汇合、模型与账户</title>
<link rel="stylesheet" href="/vc-model-settings/style.css">
<style>
    :root { --topBarBlockSize: 0px; --mainFontSize: 16px; }
    html, body { margin: 0; background: #14181f; color: #eff3fa; }
    #sheld { box-sizing: border-box; min-width: 0; }
    #chat { min-height: 120px; padding: 12px 16px 24px; }
    #send_form { display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
    #send_textarea { flex: 1; min-width: 0; }
    #send_but { min-width: 44px; min-height: 44px; }
</style>
</head>
<body>
    <div id="sheld">
        <div id="chat"></div>
        <form id="send_form">
            <textarea id="send_textarea" aria-label="消息"></textarea>
            <button type="button" id="send_but">发送</button>
        </form>
    </div>
    <script type="module" src="/vc-model-settings/harness/w15-4a-client.js"></script>
</body>
</html>

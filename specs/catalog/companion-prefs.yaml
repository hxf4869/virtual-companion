schemaVersion: 1
catalogId: companion-prefs
openTopic:
  consumer: CLOSE_FRIEND continue_topic trigger
  source: verified companion user-source observations; one source reference per relationship
  detection: explicit unfinished / resume-later wording; never infer from the latest ordinary line
  clear: explicit completion or change-topic wording
  persistence: companion_affect.open_topic_source_ref; no duplicated conversation text
  validation: reconcile the referenced ST chat before planning; require current settled eligible unsuppressed user source in a present non-incognito companion conversation
  prompt: bounded historical topic data; never instructions
enums:
- typeName: CompanionReplyLength
  entries:
  - code: SHORT
    order: 0
  - code: MEDIUM
    order: 1
  - code: LONG
    order: 2
- typeName: CompanionInitiative
  entries:
  - code: LOW
    order: 0
  - code: MEDIUM
    order: 1
  - code: HIGH
    order: 2
- typeName: CompanionHumor
  entries:
  - code: NONE
    order: 0
  - code: LIGHT
    order: 1
  - code: WARM
    order: 2
- typeName: CompanionAdvicePref
  entries:
  - code: ASK_FIRST
    order: 0
  - code: DIRECT
    order: 1
  - code: RARE
    order: 2
- typeName: CompanionAvoidTopic
  entries:
  - code: WORK
    order: 0
  - code: FAMILY
    order: 1
  - code: HEALTH
    order: 2
  - code: ROMANCE
    order: 3
  - code: MONEY
    order: 4
  - code: POLITICS
    order: 5
  - code: SUBSTANCE
    order: 6
  - code: RELIGION
    order: 7

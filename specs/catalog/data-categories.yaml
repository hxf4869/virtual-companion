schemaVersion: 1
catalogId: data-categories
memoryDomainStorage:
  fieldEncryption: false
  representation: PLAINTEXT_OR_JSON
  boundaryContract: specs/contracts/memory-recall-contract.yaml
  engine:
    authority: MEMORYCORE
    onlineExportDomain: EXTERNAL_MEMORY_ENGINE
    ownerIsolation: PRIVATE_OWNER_DIRECTORY_AND_TRUSTED_ALLOWLIST
    deletion: DURABLE_ENGINE_RECEIPT_BEFORE_GO_ACCOUNT_CASCADE
    backup: OFFLINE_SQLITE_SNAPSHOT_WITH_PROFILES_METADATA_ADAPTER_AND_GO_SUPPRESSION
    restore: CURRENT_GO_DELETION_AND_SOURCE_ALLOWLIST_BEFORE_ENGINE_READS
  protection:
    - OWNER_BINDING_AND_FORCE_RLS
    - DIRECTORY_PERMISSIONS
    - DISK_OR_VOLUME_PROTECTION
    - ENCRYPTED_BACKUPS
  note: >-
    ADR-0009 permits plaintext only for the memory-domain fields listed in the
    memory contract, including source-index text. Data categories and access
    restrictions remain unchanged. Account data, provider credentials, legacy
    Go message bodies and encrypted export-object envelopes retain their
    existing field or object encryption.
entries:
- code: MESSAGE_TEXT
  order: 0
- code: MEMORY_SNIPPET
  order: 1
- code: SAFETY_SIGNAL
  order: 2
- code: ACCOUNT_METADATA
  order: 3
- code: AGE_VERIFICATION_RESULT
  order: 4
- code: USAGE_METADATA
  order: 5

schemaVersion: 1
catalogId: realtime-events
envelopeRequired:
- schemaVersion
- event
- generationId
- streamEpoch
- eventSeq
- committedAt
- payload
entries:
- code: chat.accepted
  order: 0
  durable: true
- code: chat.delta
  order: 1
  durable: false
- code: chat.snapshot
  order: 2
  durable: false
- code: chat.replace
  order: 3
  durable: false
- code: chat.completed
  order: 4
  durable: true
- code: chat.cancelled
  order: 5
  durable: true
- code: chat.blocked
  order: 6
  durable: true
- code: chat.failed
  order: 7
  durable: true
- code: safety.notice
  order: 8
  durable: true
- code: service.mode.changed
  order: 9
  durable: true
- code: memory.candidate.created
  order: 10
  durable: true
- code: memory.candidate.confirmation_required
  order: 11
  durable: true
- code: stream.resume.accepted
  order: 12
  durable: false
- code: stream.gap
  order: 13
  durable: false
- code: stream.reset
  order: 14
  durable: false
- code: stream.denied
  order: 15
  durable: false
resumeDispositions:
- RESUMED
- TERMINAL_SNAPSHOT
- GAP_EXPIRED
- RESET_REQUIRED
- NOT_FOUND_OR_FORBIDDEN
# Go v1 (ADR-0007) scope annotations. The 7-field envelopeRequired above and
# the legacy-only codes describe the pre-Go-v1 (retired backend) protocol that
# legacy consumers still reference; the Go runtime emits none of it on the wire.
# Frontend-internal normalization (stream reducer state) must not be projected
# back onto the wire protocol.
goV1:
  publicEvents:
  - chat.accepted
  - chat.snapshot
  - chat.delta
  - chat.completed
  - chat.blocked
  - chat.failed
  - chat.cancelled
  wireFrame:
    deltaAndSnapshot: '{"event":NAME,"text":"..."}'
    others: '{"event":NAME}'
    sseId: none (no SSE id/epoch/seq; no Last-Event-ID replay — reconnect
      re-attaches via the snapshot)
  legacyOnlyCodes:
  - chat.replace
  - safety.notice
  - service.mode.changed
  - memory.candidate.created
  - memory.candidate.confirmation_required
  - stream.resume.accepted
  - stream.gap
  - stream.reset
  - stream.denied
  legacyEnvelope: The envelopeRequired fields (schemaVersion, event,
    generationId, streamEpoch, eventSeq, committedAt, payload) describe the
    retired backend protocol only; Go v1 emits bare SSE data frames per
    wireFrame and never wraps them in that envelope.

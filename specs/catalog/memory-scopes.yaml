schemaVersion: 1
catalogId: memory-scopes
note: >-
  V2 recall resolves owner, character instance and mode from the authenticated
  ST conversation binding before searching. A shared card template is never a
  shared memory scope. STORY bindings do not consume ordinary companion memory.
retrievalPolicy:
  operationId: recallSTMemory
  querySource: last_persisted_user_message
  gate: >-
    Pure greetings, acknowledgements and emotional reactions up to 24 letters /
    digits, or symbol-only emoji, skip long-term retrieval. Mixed factual queries
    and short genuine questions still recall. Apply after authoritative source
    reconciliation and affect observation, at both initial and final recall.
  uncertainty: >-
    Preserve explicit uncertainty wording. Sources older than 90 days relative
    to the persisted query clock are marked as uncertain in injected facts and
    their summaries. The mark affects prompt tone only, never stored records,
    eligibility, ordering or deletion. Do not invent numeric confidence scores.
  selection: >-
    Filter by owner, instance, mode and allowed SESSION/RELATIONSHIP scope first;
    Build a trusted allowlist from published current Go projections. MemoryCore
    ranks candidates within that set before KNN/FTS top-K, using only the current
    embedding space and rejecting low relevance before fusion. Reconcile each
    candidate and L2/L3 summary's complete persisted source dependencies before
    selecting and applying the token budget.
  finalRequest: >-
    The ST native extension uses a separately named history-data block. Each of
    the three protocol exits recalls again before sending and replaces or removes
    the earlier block. Source changes, unavailable sources and disabled recall
    cannot retain an old block or use an unverified summary as fallback.
  failure: >-
    Ordinary companion chat may continue with verified current card/history and
    an explicit skipped-memory state. No ordinary-memory fallback is allowed for
    STORY. Rebuilding embedding spaces permit current lexical retrieval only;
    legacy vc.memory_embedding is not a production fallback.
  budgetTokens:
    minimum: 128
    maximum: 2048
    default: 1024
  time: >-
    Keep source timestamp/timezone, recording time, normalized local event date/time
    and reminder instant distinct. Relative source expressions use their saved
    source timezone and calendar; queries use their own snapshot. Unknown or
    ambiguous time stays needs_clarification. A date never creates a midnight reminder.
extractionPolicy:
  transientStates: Do not retain pure same-day tiredness, sleepiness or hunger as long-term facts.
  sourceTime: >-
    The private Go-to-engine propose payload may carry sourceTime, the existing
    memorytime normalization result derived from the frozen source timestamp and
    timezone. The engine may replace that exact sourceExpression with eventDate
    only for normalized or explicit_date results. Missing or ambiguous time is
    never inferred from the worker clock. This is derived data, not a separate
    mutable operation input or a new persistent clock.
  replacements: >-
    Conflicting new facts use existing update targets and SUPERSEDED projection
    links; previous encrypted Go summaries remain visible in revision history
    and are excluded from recall. Do not turn factual corrections into deletion.
entries:
- code: SESSION
  order: 0
  enabledInAlpha: true
  longTerm: false
  relationshipIdRequired: true
  conversationIdRequired: true
- code: RELATIONSHIP
  order: 1
  enabledInAlpha: true
  longTerm: true
  relationshipIdRequired: true
  conversationIdRequired: false
- code: ACCOUNT_PRIVATE
  order: 2
  enabledInAlpha: false
  longTerm: true
  relationshipIdRequired: false
  automaticWriteAllowed: false
- code: ACCOUNT_SHARED
  order: 3
  enabledInAlpha: false
  longTerm: true
  relationshipIdRequired: false
  explicitSharingConsentRequired: true
forbiddenAliases:
- COMPANION
- SAFETY_INTERNAL

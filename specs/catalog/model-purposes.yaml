schemaVersion: 1
catalogId: model-purposes
note: >-
  V2 G2 purposes (ADR-0009, snapshot ARCH §17.4 / fixtures/model_profiles.json). Each purpose
  pins one model profile independently; changing one binding never touches another.
  EMBEDDING uses the dedicated Go embedding configuration (W08), never a chat profile.
  Its snapshot pins the Ollama artifact digest, dimensions, preprocessing and normalization;
  any vector-space-defining change allocates a new spaceId. Rebuilding uses lexical recall only.
entries:
- code: FOREGROUND_CHAT
  order: 0
  executor: SILLYTAVERN_NATIVE
  runSnapshot: IMMUTABLE_AT_START
  unauthorizedBudget: NO_REAL_CALL
  note: >-
    Foreground SillyTavern turns pin this binding. Tool follow-up turns share
    the same binding and are reserved as TOOL_TURN. Missing price, missing
    budget, or a monthly cap performs no real call. The hold is the priced
    token cap, at most the per-call ceiling. The output count is the request
    max output, not an expected length. A timeout keeps that estimate and is
    not released as zero.
- code: MEMORY_EXTRACTION_DEDUP_SUMMARY
  order: 1
  executor: GO_BACKGROUND
  nonNullSamplingCapabilities: [temperature, topP]
  acceptedSamplingCapabilityStatuses: [DECLARED, VERIFIED]
- code: BACKGROUND_GREETINGS
  order: 2
  executor: GO_BACKGROUND
  nonNullSamplingCapabilities: [temperature, topP]
  acceptedSamplingCapabilityStatuses: [DECLARED, VERIFIED]
  resolution: PINNED_BINDING_AND_REVISION_ONLY
  globalRouteFallback: false
  runSnapshot: IMMUTABLE_AT_START
  unauthorizedBudget: NO_REAL_CALL
- code: STORY_DIRECTOR
  order: 3
  executor: GO_BACKGROUND
- code: NPC_DIALOGUE
  order: 4
  executor: SILLYTAVERN_NATIVE
- code: EMBEDDING
  order: 5
  executor: GO_BACKGROUND
  note: >-
    Local embedding calls are a non-billed count. They are not reported as a
    zero-dollar online cost and do not enter the monthly cost budget.
  chatProtocolBindable: false
  configurationPath: /api/v1/admin/embedding-config
  provider: OLLAMA
  endpoint: http://127.0.0.1:11438
  queryPreprocessingVersions: [qwen3-retrieval-v1, identity-v1]
  documentPreprocessingVersions: [identity-v1]
  normalizationValues: [l2, none]
  qwen3QueryTemplate: "Instruct: Given a question, retrieve relevant personal memories that answer the question.\nQuery: ${text}"

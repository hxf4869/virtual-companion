schemaVersion: 1
catalogId: companion-presentation
longReplies:
  consumer: companion prose renderer; native rich cards and iframes remain native
  collapseAboveCharacters: 360
  previewCharacters: 180
  persistence: original message remains complete; collapse state is display-only
  lengthTier: >-
    Record the final request's actual length tier in assistant extra.vc_reply_length_tier.
    Statistics exclude missing tiers instead of guessing historic settings.
replyPlanner:
  setting: vc_reply_planner
  default: false
  consumer: companion foreground generation interceptor
  call: >-
    One bounded native generateRaw quiet request using the existing foreground
    provider binding, authentication, cancellation, context guard and usage ledger.
    No tools or memory snapshot are borrowed. Only a normal companion turn may
    plan; STORY, groups and auxiliary generations retain their existing path.
  output: reply_or_stay_silent_with_direction_up_to_80_characters
  failure: one direct reply without planning; no planner retry
  persistence: existing owner ST extension settings; no stored plans
enums:
- typeName: CompanionGender
  entries:
  - code: FEMALE
    order: 0
  - code: MALE
    order: 1
  - code: NEUTRAL
    order: 2
- typeName: CompanionAvatar
  entries:
  - code: AVATAR_FEMALE_01
    order: 0
  - code: AVATAR_MALE_01
    order: 1
  - code: AVATAR_NEUTRAL_01
    order: 2

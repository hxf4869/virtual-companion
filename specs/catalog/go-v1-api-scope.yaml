schemaVersion: 1
catalogId: go-v1-api-scope
adr: docs/decisions/0007-go-companion-runtime.md
sourceOpenApi: specs/openapi/virtual-companion.yaml
runtimeAfterCutover: Go companiond serves the KEEP/SIMPLIFY surface after the 2026-08-30 cutover;
  DEFER/RETIRE operations are not runtime fallbacks.
note: 'The API consumer matrix remains the deletion/scope source. KEEP requires core-outcome, current H5 production caller, safety/data-rights,
  or Owner instruction. DEFER/RETIRE with H5 callers must hide or delete that entry in the same later
  slice that removes the OpenAPI operation. This file is the OpenAPI deletion list: RETIRE operations
  are removed with H5 in a later slice, not in G0.'
counts:
  KEEP: 50
  SIMPLIFY: 6
  DEFER: 15
  RETIRE: 39

      - MINOR_SUSPECTED
      - MINOR_VERIFIED
      - AGE_APPEAL_PENDING
      - AGE_REVERIFY_REQUIRED
      - AGE_ACCESS_SUSPENDED
    GenerationState:
      type: string
      enum:
      - CREATED
      - INPUT_REVIEW
      - INPUT_BLOCKED

      - NONE
      - LIGHT
      - WARM
    CompanionAdvicePref:
      type: string
      enum:
      - ASK_FIRST
      - DIRECT
      - RARE
    CompanionAvoidTopic:
      type: string
      enum:
      - WORK
      - FAMILY
      - HEALTH
      - ROMANCE
      - MONEY
      - POLITICS
      - SUBSTANCE
      - RELIGION

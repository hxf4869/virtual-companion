  /api/v1/relationships/{relationshipId}/reminders:
    post:
      operationId: createReminder
      summary: Create a structured user reminder (FR-NOTIFY-001)
      description: >-
        Creates a structured reminder record under the caller's relationship
        (vc.create_reminder). Reminders are canonical records, never a prompt
        instruction; Technical Alpha stores and lists them without any push
        transport (主动消息不在 Alpha 范围). remindAt is a UTC instant;
        recurrence is NONE, DAILY or WEEKLY. Requires a server-verified
        authentication context.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCreateRequest'
      responses:
        '200':
          description: The newly created reminder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Relationship absent or not owned; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listReminders
      summary: Keyset-paginated reminders of a relationship, soonest first
      description: >-
        Keyset page of the relationship's reminder records ordered by
        (remind_at, id) via vc.list_reminders. after is the last reminder id
        seen; limit is clamped to a safe band by the server. Requires a
        server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
        - name: after
          in: query

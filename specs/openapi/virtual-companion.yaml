openapi: 3.1.0
info:
  title: Virtual Companion API
  version: 0.1.0
  description: >-
    Contract-first HTTP API (ADR-0002). This document is the single source of
    truth; Java interfaces and TypeScript clients are generated from it and must
    not be hand-edited or used to back-drive the contract. The ErrorEnvelope
    shape is uniform across every error response; NOT_FOUND_OR_FORBIDDEN hides
    resource existence so a missing resource and a forbidden one are
    indistinguishable to the caller.
security:
  - bearerAuth: []
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Service version and build identity
      description: >-
        Baseline contract endpoint proving the OpenAPI -> Java interface and
        TypeScript client generation pipeline. Public, unauthenticated.
      security: []
      responses:
        '200':
          description: Service version and build identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships:
    post:
      operationId: createRelationship
      summary: Create a Companion relationship (becomes the active Companion)
      description: >-
        Creates a new relationship owned by the caller. The new relationship
        becomes the caller's single active Companion; any previously active
        relationship is atomically deactivated so activeCompanionLimit=1 always
        holds. Requires a server-verified authentication context; the caller's
        identity is the owner, never a request field. Concurrent creates for the
        same owner can never produce two active Companions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '200':
          description: The created relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listRelationships
      summary: List the caller's relationships
      description: >-
        Returns every relationship owned by the caller (the active Companion and
        any dormant ones). Requires a server-verified authentication context;
        other owners' relationships are never disclosed.
      responses:
        '200':
          description: Relationships owned by the caller (active and dormant)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}:
    get:
      operationId: getRelationship
      summary: Fetch a relationship owned by the caller
      description: >-
        Returns the relationship if it belongs to the caller. A foreign or
        absent id is indistinguishable and maps to NOT_FOUND_OR_FORBIDDEN so
        existence is never disclosed across owners.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The caller's relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: activateRelationship
      summary: Make a relationship the active Companion
      description: >-
        Promotes the target relationship to the caller's single active Companion,
        atomically deactivating any other active relationship. A foreign or
        absent id maps to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/deactivate:
    post:
      operationId: deactivateRelationship
      summary: Deactivate a relationship (zero active Companions permitted)
      description: >-
        Sets the caller's relationship inactive. Alpha permits zero active
        Companions. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN;
        existence is never disclosed.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}/generations:
    post:
      operationId: sendGeneration
      summary: Idempotently send a Chat turn (create or rejoin a generation)
      description: >-
        Creates a new generation for the conversation or rejoins the existing
        one for the supplied idempotency key (vc.receive_generation). The caller
        identity is the owner; owner_user_id is never a request field. Requires a
        server-verified authentication context. Cross-conversation or cross-owner
        references never disclose existence.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendGenerationRequest'
      responses:
        '200':
          description: The generation (newly created or rejoined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Paginated message history for a conversation
      description: >-
        Keyset-paginated history of messages in a conversation (vc.list_messages).
        The after cursor is the last message id seen; ordering is stable by
        (owner, id). A foreign or absent conversation yields no rows and never
        discloses existence. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor (the last message id seen); omit to start from the beginning.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of messages, ordered oldest-first within the page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel a non-terminal generation
      description: >-
        Transitions a cancellable non-terminal generation to CANCELLED
        (vc.cancel_generation via the catalog double-hop CANCEL_REQUESTED then
        CANCELLED). Terminal states and COMMITTING are not cancellable. A foreign
        or absent id maps to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: The generation, now in CANCELLED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/snapshot:
    get:
      operationId: getGenerationSnapshot
      summary: Read a consistent generation snapshot
      description: >-
        Returns the generation status, the final assistant message id (if any),
        and the ordered realtime event stream up to a consistent point
        (vc.read_generation_snapshot). A foreign or absent id never discloses
        existence. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: A consistent generation snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/memories/candidates:
    post:
      operationId: createMemoryCandidate
      summary: Create a memory candidate from model extraction (PENDING_CONFIRMATION)
      description: >-
        The model-extraction entry point that persists a memory candidate
        (vc.create_memory_candidate). The candidate is always created in
        PENDING_CONFIRMATION and never ACCEPTED; canonical memory is reached only
        by the user confirming it later (INV-MEM-001/002). Alpha scope is SESSION
        or RELATIONSHIP; SESSION additionally requires a conversation binding. The
        caller identity is the owner. Requires a server-verified authentication
        context; a foreign relationship maps to NOT_FOUND_OR_FORBIDDEN.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCandidateCreateRequest'
      responses:
        '200':
          description: The created candidate, in PENDING_CONFIRMATION status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/memories:
    get:
      operationId: listMemories
      summary: List the caller's memory for a relationship
      description: >-
        Returns the memory candidates and canonical records scoped to a
        relationship (vc.list_memory). Soft-deleted records are excluded unless
        includeDeleted is set. Another relationship's memory is never disclosed;
        a foreign relationship yields no rows and never discloses existence.
        Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
          description: Include soft-deleted memory in the result (default false).
      responses:
        '200':
          description: Memory scoped to the relationship (excluding deleted by default)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}:
    get:
      operationId: getMemory
      summary: Fetch a memory owned by the caller
      description: >-
        Returns a non-deleted memory owned by the caller (vc.get_memory). A
        foreign, absent or deleted id maps to NOT_FOUND_OR_FORBIDDEN; existence is
        never disclosed. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The caller's memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateMemory
      summary: Edit a memory's content (status-preserving, idempotent)
      description: >-
        Edits the summary of an owned, non-deleted, editable memory
        (vc.update_memory). Only PENDING_CONFIRMATION and ACCEPTED memories are
        editable; status is never changed, so this cannot create or revive a
        canonical record. Idempotent: applying the same summary twice succeeds
        both times. A foreign, absent, deleted or dead-end id maps to
        NOT_FOUND_OR_FORBIDDEN. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdateRequest'
      responses:
        '200':
          description: The updated memory, status unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteMemory
      summary: Soft-delete a memory (idempotent)
      description: >-
        Soft-deletes an owned memory (vc.delete_memory). Idempotent on already-
        deleted rows: a duplicate delete of the caller's own memory returns
        success. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN; existence
        is never disclosed. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The memory was soft-deleted (or was already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}/confirm:
    post:
      operationId: confirmMemoryCandidate
      summary: Confirm a pending candidate into canonical memory
      description: >-
        The sole path to a canonical (ACCEPTED) record (vc.confirm_memory_candidate).
        Only a PENDING_CONFIRMATION candidate can be confirmed; confirming an
        already-confirmed or otherwise transitioned memory is rejected and maps to
        NOT_FOUND_OR_FORBIDDEN (confirm is intentionally not idempotent into
        canonical). Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The memory, now in ACCEPTED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}/reject:
    post:
      operationId: rejectMemoryCandidate
      summary: Reject a pending candidate
      description: >-
        Rejects a PENDING_CONFIRMATION candidate (vc.reject_memory_candidate). Only
        a pending candidate can be rejected; rejecting an already-transitioned
        memory is rejected and maps to NOT_FOUND_OR_FORBIDDEN. Requires a
        server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The memory, now in REJECTED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}/evidence:
    get:
      operationId: listMemoryEvidence
      summary: List the source Evidence of a memory
      description: >-
        Returns the source Evidence chain of an owned, non-deleted memory
        (vc.list_memory_evidence). A foreign, absent or deleted id yields no rows,
        indistinguishable from a real memory that carries no evidence, so
        existence is never disclosed. Requires a server-verified authentication
        context.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The ordered source Evidence for the memory (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryEvidence'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with internal-account credentials
      description: >-
        Exchanges a username and password for an access token and a refresh
        session. Public. An unknown user and a wrong password are
        indistinguishable and both map to NOT_FOUND_OR_FORBIDDEN (existence is
        never disclosed); a DISABLED account maps to AUTHENTICATION_REQUIRED.
        Credentials are never logged, placed in a URL or stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: New access token and refresh session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: DISABLED account (cause is not disclosed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown username or wrong password; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Renew a session from a refresh token
      description: >-
        Validates the presented refresh token server-side (unrevoked, unexpired,
        ACTIVE account), revokes it and issues a new access token and refresh
        session. Public. An unknown, revoked, expired or DISABLED-account token
        all map to AUTHENTICATION_REQUIRED; the cause is never disclosed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token and rotated refresh session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid, revoked, expired or disabled refresh session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh session
      description: >-
        Revokes the caller's presented refresh session. Idempotent: a second
        logout or a foreign/unknown token is still reported as success so
        existence is never disclosed. Requires a valid Bearer access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: The refresh session was revoked (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/accounts:
    post:
      operationId: createInternalAccount
      summary: Create an internal account (ADMIN only)
      description: >-
        Creates an internal account for an ACTIVE ADMIN caller. No public
        registration: a non-ADMIN caller maps to ACCESS_DENIED. The new account
        starts ACTIVE; a duplicate username maps to NOT_FOUND_OR_FORBIDDEN so
        existence is never disclosed. Requires a valid Bearer access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateAccountRequest'
      responses:
        '200':
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Invalid request or duplicate username; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        Unified error shape. NOT_FOUND_OR_FORBIDDEN never discloses whether a
        resource exists; every error response uses this envelope.
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Stable, non-sensitive human-readable explanation
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (never sensitive data)
    ErrorCode:
      type: string
      description: Stable error code catalog (specs/catalog/error-codes.yaml)
      enum:
        - AUTHENTICATION_REQUIRED
        - ACCESS_DENIED
        - NOT_FOUND_OR_FORBIDDEN
        - AGE_VERIFICATION_REQUIRED
        - MODEL_NO_ELIGIBLE_DEPLOYMENT
        - MODEL_ATTEMPT_TIMEOUT
        - MODEL_ALL_UNAVAILABLE
        - GENERATION_CANCELLED
        - GENERATION_OUTPUT_BLOCKED
        - STREAM_GAP_EXPIRED
        - STREAM_RESET_REQUIRED
        - MEMORY_CONFIRMATION_REQUIRED
        - MEMORY_FORBIDDEN_CONTENT
        - CATALOG_DRIFT_DETECTED
        - BETA_OPERATIONS_NOT_READY
    VersionResponse:
      type: object
      description: Service version and build identity
      required:
        - version
      properties:
        version:
          type: string
        commit:
          type: string
    Relationship:
      type: object
      description: >-
        A Companion relationship owned by exactly one user. At most one
        relationship per owner is active at any time (activeCompanionLimit=1).
      required:
        - relationshipId
        - personaRef
      properties:
        relationshipId:
          type: string
          description: Stable owner-scoped relationship identifier
        personaRef:
          type: string
          description: Reference to the Persona bound to this Companion
        active:
          type: boolean
          description: Whether this is the owner's current active Companion
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    RelationshipCreateRequest:
      type: object
      description: Body for creating a new Companion relationship.
      required:
        - personaRef
      properties:
        personaRef:
          type: string
          description: Reference to the Persona to bind as the Companion
    Generation:
      type: object
      description: >-
        A generation owned by exactly one user within a conversation. One logical
        request has one stable logicalGenerationId (INV-GEN-001); status follows
        the generation-states catalog.
      required:
        - generationId
        - conversationId
        - logicalGenerationId
        - status
      properties:
        generationId:
          type: string
          description: Stable owner-scoped generation identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        logicalGenerationId:
          type: string
          description: Idempotent logical label shared by create and rejoin
        status:
          type: string
          description: Current generation-states catalog code
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    GenerationSnapshot:
      type: object
      description: >-
        A consistent point-in-time read of a generation: status, final assistant
        message id and the ordered realtime event stream (INV-RT-001).
      required:
        - status
        - events
      properties:
        status:
          type: string
          description: Current generation-states catalog code
        assistantMessageId:
          type: string
          description: Final assistant message id once committed, absent otherwise
        events:
          type: array
          description: Ordered realtime events up to a consistent point
          items:
            type: object
            additionalProperties: true
    Message:
      type: object
      description: A chat message owned by exactly one user within a conversation.
      required:
        - messageId
        - conversationId
        - role
        - content
      properties:
        messageId:
          type: string
          description: Stable owner-scoped message identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        role:
          type: string
          description: Message role (e.g. user, assistant)
        content:
          type: string
          description: Message content
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    SendGenerationRequest:
      type: object
      description: Body for idempotently sending a Chat turn.
      required:
        - idempotencyKey
      properties:
        idempotencyKey:
          type: string
          description: Caller-supplied idempotency label; reuse to rejoin the same generation
        userContent:
          type: string
          description: The user's chat content for this turn
    Memory:
      type: object
      description: >-
        A memory candidate or canonical record owned by exactly one user within a
        relationship. Model extraction only creates PENDING_CONFIRMATION
        candidates; ACCEPTED (canonical) is reached solely by user confirmation
        (INV-MEM-001/002). status follows the memory-candidate-statuses catalog.
      required:
        - memoryId
        - scope
        - summary
        - status
      properties:
        memoryId:
          type: string
          description: Stable owner-scoped memory identifier
        scope:
          type: string
          description: memory-scopes catalog code (SESSION or RELATIONSHIP in Alpha)
        summary:
          type: string
          description: Memory content summary
        status:
          type: string
          description: Current memory-candidate-statuses catalog code
        conversationId:
          type: string
          description: Owning conversation identifier, present for SESSION-scoped memory
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    MemoryCandidateCreateRequest:
      type: object
      description: Body for creating a memory candidate from model extraction.
      required:
        - scope
        - summary
      properties:
        scope:
          type: string
          description: memory-scopes catalog code; SESSION or RELATIONSHIP in Alpha
        summary:
          type: string
          description: Memory content summary proposed by the model
        conversationId:
          type: string
          description: Required when scope is SESSION (the binding conversation)
        evidence:
          type: array
          description: Cited source references supporting the candidate
          items:
            type: string
    MemoryUpdateRequest:
      type: object
      description: Body for editing a memory's content (status-preserving).
      required:
        - summary
      properties:
        summary:
          type: string
          description: The new memory content summary
    MemoryEvidence:
      type: object
      description: A cited source reference supporting a memory candidate.
      required:
        - evidenceId
        - sourceRef
      properties:
        evidenceId:
          type: string
          description: Stable owner-scoped evidence identifier
        sourceRef:
          type: string
          description: Cited source reference
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    LoginRequest:
      type: object
      description: Internal-account login credentials.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Internal account username
        password:
          type: string
          description: Plaintext password (compared in the JVM, never stored or logged)
    RefreshTokenRequest:
      type: object
      description: A refresh token to renew.
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: The raw refresh token; only its sha256 hash is stored server-side
    LogoutRequest:
      type: object
      description: The refresh token to revoke.
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: The raw refresh token to revoke
    AdminCreateAccountRequest:
      type: object
      description: >-
        Internal-account creation (ADMIN only). Role defaults to USER when
        omitted; only ADMIN or USER is accepted.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Internal account username (normalized to lowercase)
        password:
          type: string
          description: Plaintext password; only its BCrypt hash is stored
        role:
          type: string
          description: ADMIN or USER (default USER)
        displayName:
          type: string
          description: Human-readable display name
    AuthTokenResponse:
      type: object
      description: >-
        A new access token plus its refresh session. The raw refresh token is
        returned exactly once here; the server stores only its sha256 hash and
        never echoes it again.
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresInSeconds
        - accountId
        - role
      properties:
        accessToken:
          type: string
          description: JWT Bearer access token (expires after expiresInSeconds)
        refreshToken:
          type: string
          description: Raw refresh token for session renewal
        tokenType:
          type: string
          description: Always Bearer
        expiresInSeconds:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        accountId:
          type: string
          description: The authenticated account id (also the owner_user_id)
        role:
          type: string
          description: ADMIN or USER
    LogoutResponse:
      type: object
      description: Idempotent logout acknowledgment.
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Always true; existence is never disclosed
    AccountResponse:
      type: object
      description: An internal account (ADMIN creation result).
      required:
        - accountId
        - username
        - role
        - status
      properties:
        accountId:
          type: string
          description: The new account id (also the owner_user_id)
        username:
          type: string
          description: Normalized (lowercase) internal username
        role:
          type: string
          description: ADMIN or USER
        status:
          type: string
          description: ACTIVE at creation
  parameters:
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped relationship identifier
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped conversation identifier
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped generation identifier
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped memory identifier

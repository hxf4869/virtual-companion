  /api/v1/exports:
    post:
      operationId: createExport
      summary: Enqueue an asynchronous data export (FR-DATA-002)
      description: >-
        Creates an export request and enqueues a DATA_EXPORT work item
        (vc.create_export_request); the worker builds the JSON document
        asynchronously and the status endpoint reports PENDING until READY.
        Only one in-flight export per account is allowed. The download link is
        short-lived and one-time. Requires a server-verified authentication
        context.
      responses:
        '200':
          description: The created export request (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequest'
        '400':
          description: An export for this account is already in flight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/exports/{exportId}:
    get:
      operationId: getExportStatus
      summary: Read one owned export request status (FR-DATA-002)
      description: >-
        Status of the caller's export request via vc.get_export_request. While
        READY the response carries a short-lived one-time downloadUrl; a
        foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN (existence is
        never disclosed). Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The export request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequest'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Export request absent or not owned; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/exports/{exportId}/download:
    get:
      operationId: downloadExport
      summary: One-time authenticated download of a READY export (FR-DATA-002)
      description: >-
        Returns the export document exactly once (the token is consumed on
        success, vc.consume_export). The token is only handed out inside the
        authenticated status response; expired, consumed, foreign or absent
        exports map to NOT_FOUND_OR_FORBIDDEN (existence is never disclosed).
        Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ExportId'
        - $ref: '#/components/parameters/ExportToken'
      responses:
        '200':
          description: The export document (one-time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDownload'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not READY, expired, consumed, absent or not owned; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with internal-account credentials
      description: >-
        Exchanges a username and password for an access token and a refresh
        session. Public. An unknown user and a wrong password are
        indistinguishable and both map to NOT_FOUND_OR_FORBIDDEN (existence is
        never disclosed); a DISABLED account maps to AUTHENTICATION_REQUIRED.
        Credentials are never logged, placed in a URL or stored. Before account
        lookup or password verification, a Technical Alpha single-instance
        admission guard applies route-source and source-plus-canonical-username
        rolling windows and a non-blocking shared concurrency bulkhead. Servlet
        remoteAddr is authoritative; forwarded client-address headers are ignored.
      security: []
      requestBody:
        required: true
        x-raw-max-bytes: 16384
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: New access token; the refresh session is delivered only through the HttpOnly vc_refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Missing, unreadable or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: DISABLED account (cause is not disclosed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown username or wrong password; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'AUTH_RATE_LIMITED: Authentication is temporarily rate limited'
          headers:
            Retry-After:
              description: Positive integer seconds before another admission attempt
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Renew a session from a refresh token
      description: >-
        Validates the presented refresh token server-side (unrevoked, unexpired,
        ACTIVE account), revokes it and issues a new access token and refresh
        session. Public. An unknown, revoked, expired or DISABLED-account token
        all map to AUTHENTICATION_REQUIRED; the cause is never disclosed. Before
        token hashing or session JDBC, a Technical Alpha single-instance admission
        guard applies route-source and token rolling windows and the same
        non-blocking concurrency bulkhead. Servlet remoteAddr is authoritative;
        forwarded client-address headers are ignored.
      security: []
      parameters:
        - in: cookie
          name: vc_refresh
          required: true
          schema:
            type: string
            x-utf8-max-bytes: 512
          description: Required HttpOnly refresh cookie; the raw value is never accepted in a request body.
      responses:
        '200':
          description: New access token; the rotated refresh session is delivered only through the HttpOnly vc_refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid, revoked, expired or disabled refresh session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'AUTH_RATE_LIMITED: Authentication is temporarily rate limited'
          headers:
            Retry-After:
              description: Positive integer seconds before another admission attempt
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh session
      description: >-
        Revokes the caller's presented refresh session. Idempotent: a second
        logout or a foreign/unknown token is still reported as success so
        existence is never disclosed. Requires a valid Bearer access token.
      parameters:
        - in: cookie
          name: vc_refresh
          required: true
          schema:
            type: string
            x-utf8-max-bytes: 512
          description: Required HttpOnly refresh cookie; the raw value is never accepted in a request body.
      responses:
        '200':
          description: The refresh session was revoked (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/account:
    delete:
      operationId: deleteAccount
      summary: Delete the caller's own account (FR-AUTH-004)
      description: >-
        Self-service account deletion (注销受理). The caller's account and
        refresh sessions are deleted and all business data owned by the
        account is removed through the vc_user cascade (conversations,
        messages, memories, reminders, consents, exports, work items). The
        append-only compliance audit trail (identity_auth_event) is kept —
        the product explains the retention before confirming. Login with the
        deleted username and any refresh session stop working immediately
        (deletion tombstone: the account no longer exists, so recovery is
        impossible). An already-deleted or disabled account maps to
        NOT_FOUND_OR_FORBIDDEN (existence is never disclosed). Requires a
        valid Bearer access token.
      responses:
        '200':
          description: The account was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletedResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Account absent, already deleted or disabled; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/accounts:
    post:
      operationId: createInternalAccount
      summary: Create an internal account (ADMIN only)
      description: >-
        Creates an internal account for an ACTIVE ADMIN caller. No public
        registration: a non-ADMIN caller maps to ACCESS_DENIED. The new account
        starts ACTIVE; a duplicate username maps to NOT_FOUND_OR_FORBIDDEN so
        existence is never disclosed. Requires a valid Bearer access token.
      requestBody:
        required: true
        x-raw-max-bytes: 16384
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateAccountRequest'
      responses:
        '200':
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Missing, unreadable or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Duplicate username; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listInternalAccounts
      summary: List internal accounts (ADMIN only, ADMIN-ACCTS)
      description: >-
        The account registry for the management UI. ADMIN only: a non-ADMIN
        caller maps to ACCESS_DENIED. Never exposes password hashes. Requires
        a valid Bearer access token.
      responses:
        '200':
          description: The account registry ordered by account id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountListItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/accounts/{accountId}/disable:
    post:
      operationId: disableInternalAccount
      summary: Disable an internal account (ADMIN only, ADMIN-ACCTS)
      description: >-
        Flips one account to DISABLED (idempotent). Login/refresh for a
        DISABLED account is rejected by the existing identity flow. An admin
        cannot disable their own account; a non-ADMIN caller maps to
        ACCESS_DENIED; an unknown target fails closed (existence is never
        disclosed). Requires a valid Bearer access token.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account was disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisableAccountResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role or targets themselves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target account absent; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/audit:
    get:
      operationId: listAdminAuditEvents
      summary: Keyset-paginated audit event list (ADMIN only, ADMIN-OPS)
      description: >-
        Newest-first keyset page of the append-only identity_auth_event audit
        trail (login/logout/admin account events), via
        vc.identity_auth_event_list. after is the last event id seen
        (exclusive); limit is clamped to a safe band by the server. Requires a
        valid Bearer access token whose account is an ACTIVE ADMIN.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor (the last event id seen); omit to start from the newest.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of audit events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventListItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/usage:
    get:
      operationId: getAdminUsageSummary
      summary: Per-day usage and cost summary (ADMIN only, ADMIN-OPS)
      description: >-
        Per-day aggregates (generation count, settled input/output tokens,
        actual cost) over vc.generation_usage since the days floor, via
        vc.admin_usage_summary. days is clamped to 1..90 by the server
        (default 14). Requires a valid Bearer access token whose account is an
        ACTIVE ADMIN.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
          description: Days to cover, clamped to 1..90 (default 14).
      responses:
        '200':
          description: Per-day usage rows, newest day first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageSummaryItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        Unified error shape. NOT_FOUND_OR_FORBIDDEN never discloses whether a
        resource exists; every error response uses this envelope.
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Stable, non-sensitive human-readable explanation
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (never sensitive data)
    ErrorCode:
      type: string
      description: Stable error code catalog (specs/catalog/error-codes.yaml)
      enum:
        - AUTHENTICATION_REQUIRED
        - ACCESS_DENIED
        - NOT_FOUND_OR_FORBIDDEN
        - AGE_VERIFICATION_REQUIRED
        - MODEL_NO_ELIGIBLE_DEPLOYMENT
        - MODEL_ATTEMPT_TIMEOUT
        - MODEL_ALL_UNAVAILABLE
        - GENERATION_CANCELLED
        - GENERATION_OUTPUT_BLOCKED
        - STREAM_GAP_EXPIRED
        - STREAM_RESET_REQUIRED
        - MEMORY_CONFIRMATION_REQUIRED
        - MEMORY_FORBIDDEN_CONTENT
        - CATALOG_DRIFT_DETECTED
        - BETA_OPERATIONS_NOT_READY
        - INVALID_REQUEST
        - AUTH_RATE_LIMITED
    ServiceModeStatus:
      type: object
      description: Current generation-service mode (FR-RES-005).
      required:
        - mode
        - summary
      properties:
        mode:
          type: string
          description: >-
            service-modes catalog code: FULL_AI (live models wired) or ZERO_LLM
            (deterministic record mode only). DEGRADED_AI / SAFETY_RESTRICTED /
            MAINTENANCE are catalog codes but never reported in Technical Alpha.
          enum:
            - FULL_AI
            - ZERO_LLM
        summary:
          type: string
          description: Plain, non-role-played human-readable status line
    AgeStateResponse:
      type: object
      description: >-
        The caller's effective adult-verification state (FR-AUTH-002). Only
        the result, the age band, the verification time and the provider
        reference are stored — never an identity document.
      required:
        - ageState
      properties:
        ageState:
          type: string
          description: age-states catalog code (AGE_UNKNOWN when never verified)
          enum:
            - AGE_UNKNOWN
            - ADULT_SELF_DECLARED
            - ADULT_VERIFICATION_REQUIRED
            - ADULT_VERIFIED
            - MINOR_SUSPECTED
            - MINOR_VERIFIED
            - AGE_APPEAL_PENDING
            - AGE_REVERIFY_REQUIRED
            - AGE_ACCESS_SUSPENDED
        providerRef:
          type: string
          description: Verification provider reference (alpha-simulated in Technical Alpha)
        verifiedAt:
          type: string
          format: date-time
          description: Verification time (RFC 3339), present once verified
    VersionResponse:
      type: object
      description: Service version and build identity
      required:
        - version
      properties:
        version:
          type: string
        commit:
          type: string
    Relationship:
      type: object
      description: >-
        A Companion relationship owned by exactly one user. At most one
        relationship per owner is active at any time (activeCompanionLimit=1).
      required:
        - relationshipId
        - personaRef
      properties:
        relationshipId:
          type: string
          description: Stable owner-scoped relationship identifier
        personaRef:
          type: string
          description: Reference to the Persona bound to this Companion
        active:
          type: boolean
          description: Whether this is the owner's current active Companion
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    RelationshipCreateRequest:
      type: object
      description: Body for creating a new Companion relationship.
      required:
        - personaRef
      properties:
        personaRef:
          type: string
          description: Reference to the Persona to bind as the Companion
    Generation:
      type: object
      description: >-
        A generation owned by exactly one user within a conversation. One logical
        request has one stable logicalGenerationId (INV-GEN-001); status follows
        the generation-states catalog; mode is the interaction mode captured at
        reception (CHAT-MODE).
      required:
        - generationId
        - conversationId
        - logicalGenerationId
        - status
        - mode
      properties:
        generationId:
          type: string
          description: Stable owner-scoped generation identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        logicalGenerationId:
          type: string
          description: Idempotent logical label shared by create and rejoin
        status:
          type: string
          description: Current generation-states catalog code
        mode:
          $ref: '#/components/schemas/InteractionModeCode'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    GenerationSnapshot:
      type: object
      description: >-
        A consistent point-in-time read of a generation: status, final assistant
        message id and the ordered realtime event stream (INV-RT-001). usage is
        present only after finalize settles the provider usage (USAGE-VIZ).
      required:
        - status
        - events
      properties:
        status:
          type: string
          description: Current generation-states catalog code
        assistantMessageId:
          type: string
          description: Final assistant message id once committed, absent otherwise
        events:
          type: array
          description: Ordered realtime events up to a consistent point
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/GenerationUsage'
    GenerationUsage:
      type: object
      description: Settled provider token usage for one generation (USAGE-VIZ).
      required:
        - inputTokens
        - outputTokens
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Provider input (prompt) tokens settled at finalize
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Provider output (completion) tokens settled at finalize
    RealtimeTicketCreateRequest:
      type: object
      description: >-
        Resume cursor the caller binds a ticket to. Identifiers and counters are
        decimal strings (hashid encoding is deferred); the server parses them
        into 64-bit integers. Transport is not accepted here; the server fixes
        it to FETCH_SSE.
      required:
        - generationId
        - sessionId
        - origin
        - streamEpoch
        - afterSeq
      properties:
        generationId:
          type: string
          description: The generation the ticket will resume
        sessionId:
          type: string
          description: The caller's realtime session id
        origin:
          type: string
          description: The origin the SSE resume will be opened from
        streamEpoch:
          type: string
          description: The stream epoch the caller last observed
        afterSeq:
          type: string
          description: The last contiguous eventSeq the caller advanced to (0 resumes from the start)
    RealtimeTicket:
      type: object
      description: >-
        A freshly minted single-use resume ticket. The secret is returned exactly
        once; only its sha256 is persisted. Consume it within the 45s TTL when
        opening the SSE resume stream.
      required:
        - ticketId
        - secret
      properties:
        ticketId:
          type: string
          description: The server-assigned ticket identifier
        secret:
          type: string
          description: One-time plaintext secret (sha256-only persisted)
    RealtimeStreamEvent:
      type: object
      description: >-
        A single Server-Sent Event on the resume stream (text/event-stream).
        event is one of the durable realtime event types (chat.accepted,
        safety.notice, ...), snapshot for a terminal generation, or the control
        events stream.gap, stream.reset and stream.denied. id carries the
        eventSeq for a durable event so the client advances only the last
        contiguous sequence (INV-RT-001); the data payload is the envelope
        object produced by vc.resume_stream. stream.denied never discloses
        whether the cause was a ticket failure or a foreign/absent generation.
      required:
        - event
      properties:
        event:
          type: string
          description: The SSE event name (durable event type, snapshot, or stream.gap/reset/denied)
        id:
          type: string
          description: The eventSeq for a durable event (the Last-Event-ID cursor)
        data:
          type: object
          additionalProperties: true
          description: The event payload (envelope-encoded) or the snapshot object
    Message:
      type: object
      description: A chat message owned by exactly one user within a conversation.
      required:
        - messageId
        - conversationId
        - role
        - content
      properties:
        messageId:
          type: string
          description: Stable owner-scoped message identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        role:
          type: string
          description: Message role (e.g. user, assistant)
        content:
          type: string
          description: Message content
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        noMemory:
          type: boolean
          description: >-
            MEM-NEG (V44): true while memory extraction skips this message
            (不记住 marker); false by default
    MessageNoMemoryUpdate:
      type: object
      description: Body for flipping the 不记住 marker of one message (MEM-NEG).
      required:
        - noMemory
      properties:
        noMemory:
          type: boolean
          description: true marks the message so memory extraction skips it; false restores it
    SendGenerationRequest:
      type: object
      description: Body for idempotently sending a Chat turn; mode selects the
        interaction mode for the turn (CHAT-MODE).
      required:
        - idempotencyKey
      properties:
        idempotencyKey:
          type: string
          description: Caller-supplied idempotency label; reuse to rejoin the same generation
        userContent:
          type: string
          description: The user's chat content for this turn
        mode:
          $ref: '#/components/schemas/InteractionModeCode'
    InteractionModeCode:
      type: string
      description: >-
        Turn-level interaction mode captured at reception (CHAT-MODE). AUTO lets
        the persona's default mode rule (gentle-listener: LISTEN); LISTEN asks
        the companion to listen and reflect without unsolicited advice; DISCUSS
        opens an active exchange with questions and analysis. Rejoining the same
        generation via idempotencyKey keeps the first reception's mode.
      enum:
        - AUTO
        - LISTEN
        - DISCUSS
      default: AUTO
    GenerationFeedbackCreateRequest:
      type: object
      description: Body for recording user feedback on a generation (FR-CHAT-003).
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/MessageFeedbackKind'
        note:
          type: string
          maxLength: 500
          description: Optional free-text clarification (first submission wins)
    MessageFeedbackKind:
      type: string
      description: >-
        message-feedback-kinds catalog code (FR-CHAT-003): TOO_MECHANICAL
        (太机械), FORGOT_CONTEXT (忘记了), CROSSED_BOUNDARY (越界),
        FACTUAL_ERROR (事实错误), UNSAFE (不安全).
      enum:
        - TOO_MECHANICAL
        - FORGOT_CONTEXT
        - CROSSED_BOUNDARY
        - FACTUAL_ERROR
        - UNSAFE
    GenerationFeedbackResponse:
      type: object
      description: The recorded (or already present) generation feedback row.
      required:
        - generationId
        - kind
        - createdAt
      properties:
        generationId:
          type: string
          description: Owning generation identifier
        kind:
          $ref: '#/components/schemas/MessageFeedbackKind'
        note:
          type: string
          description: Free-text clarification, absent when none was given
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    CreateConversationRequest:
      type: object
      description: Body for creating a conversation under a relationship.
      required:
        - relationshipId
      properties:
        relationshipId:
          type: string
          description: The relationship under which to open the conversation
        incognito:
          type: boolean
          description: >-
            INC-MODE (FR-CHAT-005): true opens an incognito conversation —
            chosen knowingly at creation time. Incognito conversations never
            produce long-term memory candidates; necessary safety and
            statutory logs still apply. Defaults to false.
          default: false
    ConversationResponse:
      type: object
      description: The newly created conversation.
      required:
        - conversationId
      properties:
        conversationId:
          type: string
          description: Stable owner-scoped conversation identifier
    ConversationListItem:
      type: object
      description: >-
        One conversation row in the caller's list, carrying a clamped preview
        of the most recent message when the conversation has any messages.
      required:
        - conversationId
        - relationshipId
        - createdAt
      properties:
        conversationId:
          type: string
          description: Stable owner-scoped conversation identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        lastMessageRole:
          type: string
          description: Role of the most recent message (user or assistant), absent for an empty conversation
        lastMessagePreview:
          type: string
          description: Clamped preview of the most recent message, absent for an empty conversation
        incognito:
          type: boolean
          description: INC-MODE (FR-CHAT-005) — true when the conversation is incognito
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        title:
          type: string
          description: User-renamed conversation title (CONV-MGMT), absent until renamed
    ConversationDeletedResponse:
      type: object
      description: Result of deleting one conversation.
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    MessageDeletedResponse:
      type: object
      description: Result of deleting one message (FR-CHAT-004 / FR-DATA-003).
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    Reminder:
      type: object
      description: One structured user reminder (FR-NOTIFY-001).
      required:
        - reminderId
        - relationshipId
        - text
        - remindAt
        - recurrence
        - status
        - createdAt
      properties:
        reminderId:
          type: string
          description: Stable owner-scoped reminder identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        text:
          type: string
          description: The reminder text (1..500 characters)
        remindAt:
          type: string
          format: date-time
          description: UTC instant the reminder is due
        recurrence:
          type: string
          description: NONE, DAILY or WEEKLY
          enum:
            - NONE
            - DAILY
            - WEEKLY
        status:
          type: string
          description: ACTIVE or DISMISSED
          enum:
            - ACTIVE
            - DISMISSED
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (RFC 3339)
    ReminderCreateRequest:
      type: object
      description: Body for creating a structured reminder.
      required:
        - text
        - remindAt
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: The reminder text
        remindAt:
          type: string
          format: date-time
          description: UTC instant the reminder is due
        recurrence:
          type: string
          description: NONE (default), DAILY or WEEKLY
          enum:
            - NONE
            - DAILY
            - WEEKLY
          default: NONE
    ReminderUpdateRequest:
      type: object
      description: >-
        Body for updating a reminder. Every field is required — the update
        writes the whole record so no partial silent edit is possible.
      required:
        - text
        - remindAt
        - recurrence
        - status
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        remindAt:
          type: string
          format: date-time
        recurrence:
          type: string
          enum:
            - NONE
            - DAILY
            - WEEKLY
        status:
          type: string
          enum:
            - ACTIVE
            - DISMISSED
    ReminderDeletedResponse:
      type: object
      description: Result of deleting one reminder.
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    ServiceClassAssignRequest:
      type: object
      description: ADMIN-only simulated service-class assignment (ENT-SNAP).
      required:
        - accountId
        - serviceClass
      properties:
        accountId:
          type: string
          description: The target internal account id
        serviceClass:
          type: string
          description: ECONOMY or PREMIUM
          enum:
            - ECONOMY
            - PREMIUM
    ServiceClassAssignResponse:
      type: object
      description: The applied assignment.
      required:
        - accountId
        - serviceClass
      properties:
        accountId:
          type: string
          description: The target account id
        serviceClass:
          type: string
          description: The applied class (ECONOMY or PREMIUM)
    ServiceClassAssignmentItem:
      type: object
      description: One assignment registry row (ENT-SNAP).
      required:
        - accountId
        - username
        - serviceClass
      properties:
        accountId:
          type: string
          description: The account id
        username:
          type: string
          description: Normalized internal username
        serviceClass:
          type: string
          description: Assigned class (ECONOMY is the default for unassigned accounts)
        assignedAt:
          type: string
          format: date-time
          description: First assignment timestamp, absent when never assigned
        updatedAt:
          type: string
          format: date-time
          description: Last assignment timestamp, absent when never assigned
    ConsentUpsertRequest:
      type: object
      description: Body for appending a versioned consent record (FR-AUTH-003).
      required:
        - consentType
        - version
        - granted
      properties:
        consentType:
          type: string
          description: >-
            FR-AUTH-003 catalogue: SERVICE_TERMS, PRIVACY_POLICY,
            AI_CONTENT_NOTICE, THIRD_PARTY_MODEL_PROCESSING,
            SENSITIVE_DATA_PROCESSING, EMERGENCY_CONTACT, MODEL_TRAINING,
            PUSH_NOTIFICATION.
          enum:
            - SERVICE_TERMS
            - PRIVACY_POLICY
            - AI_CONTENT_NOTICE
            - THIRD_PARTY_MODEL_PROCESSING
            - SENSITIVE_DATA_PROCESSING
            - EMERGENCY_CONTACT
            - MODEL_TRAINING
            - PUSH_NOTIFICATION
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: The policy document version the user saw
        granted:
          type: boolean
          description: true grants (or re-grants), false revokes
    ConsentRecord:
      type: object
      description: One versioned consent record (FR-AUTH-003).
      required:
        - consentId
        - consentType
        - version
        - granted
        - grantedAt
      properties:
        consentId:
          type: string
          description: Stable owner-scoped record identifier
        consentType:
          type: string
          description: The FR-AUTH-003 consent type
        version:
          type: string
          description: The policy document version
        granted:
          type: boolean
          description: true while the consent is granted
        grantedAt:
          type: string
          format: date-time
          description: Grant/record timestamp (RFC 3339)
        revokedAt:
          type: string
          format: date-time
          description: Revocation timestamp, present only on a revoke record
    ExportRequest:
      type: object
      description: One asynchronous data-export request (FR-DATA-002).
      required:
        - exportId
        - status
        - requestedAt
      properties:
        exportId:
          type: string
          description: Stable owner-scoped export request identifier
        status:
          type: string
          description: PENDING, READY, FAILED or EXPIRED
          enum:
            - PENDING
            - READY
            - FAILED
            - EXPIRED
        requestedAt:
          type: string
          format: date-time
          description: Request timestamp (RFC 3339)
        completedAt:
          type: string
          format: date-time
          description: Completion timestamp, present once READY
        expiresAt:
          type: string
          format: date-time
          description: Download expiry, present once READY
        errorMessage:
          type: string
          description: Stable failure reason, present only on FAILED
        downloadUrl:
          type: string
          description: Short-lived one-time download link, present only while READY
    ExportDownload:
      type: object
      description: The exported user-data document (FR-DATA-002, one-time).
      required:
        - exportId
        - generatedAt
        - expiresAt
        - aiContentNotice
        - conversations
        - memories
        - reminders
        - consents
      properties:
        exportId:
          type: string
          description: The export request identifier
        generatedAt:
          type: string
          format: date-time
          description: Document generation timestamp (RFC 3339)
        expiresAt:
          type: string
          format: date-time
          description: Document expiry timestamp (RFC 3339)
        aiContentNotice:
          type: string
          description: Plain-language notice that assistant messages are AI-generated
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ExportConversation'
        memories:
          type: array
          items:
            $ref: '#/components/schemas/ExportMemory'
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/ExportReminder'
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ExportConsent'
    ExportConversation:
      type: object
      description: One conversation with its full message history (FR-DATA-002).
      required:
        - conversationId
        - relationshipId
        - incognito
        - messages
      properties:
        conversationId:
          type: string
          description: Owner-scoped conversation identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        title:
          type: string
          description: User-renamed title, absent until renamed
        incognito:
          type: boolean
          description: Frozen creation-time incognito flag
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ExportMessage'
    ExportMessage:
      type: object
      description: One message with its AI-generated marker (FR-DATA-002).
      required:
        - messageId
        - role
        - content
        - aiGenerated
      properties:
        messageId:
          type: string
          description: Owner-scoped message identifier
        role:
          type: string
          description: user or assistant
        content:
          type: string
          description: The message text
        aiGenerated:
          type: boolean
          description: true for assistant messages (AI 生成内容标识)
    ExportMemory:
      type: object
      description: One memory record (FR-DATA-002).
      required:
        - memoryId
        - scope
        - summary
        - status
        - createdAt
      properties:
        memoryId:
          type: string
          description: Owner-scoped memory identifier
        relationshipId:
          type: string
          description: Owning relationship identifier, present for RELATIONSHIP scope
        scope:
          type: string
          description: memory-scopes catalog code
        summary:
          type: string
          description: Memory content summary
        status:
          type: string
          description: memory-candidate-statuses catalog code
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        deletedAt:
          type: string
          format: date-time
          description: Deletion timestamp, present only when deleted
    ExportReminder:
      type: object
      description: One structured reminder (FR-DATA-002).
      required:
        - reminderId
        - relationshipId
        - text
        - remindAt
        - recurrence
        - status
      properties:
        reminderId:
          type: string
          description: Owner-scoped reminder identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        text:
          type: string
          description: The reminder text
        remindAt:
          type: string
          format: date-time
          description: UTC instant the reminder is due
        recurrence:
          type: string
          description: NONE, DAILY or WEEKLY
        status:
          type: string
          description: ACTIVE or DISMISSED
    ExportConsent:
      type: object
      description: One effective consent record (FR-DATA-002).
      required:
        - consentId
        - consentType
        - version
        - granted
        - grantedAt
      properties:
        consentId:
          type: string
          description: Owner-scoped consent record identifier
        consentType:
          type: string
          description: The FR-AUTH-003 consent type
        version:
          type: string
          description: The policy document version
        granted:
          type: boolean
          description: Effective granted state
        grantedAt:
          type: string
          format: date-time
          description: Record timestamp (RFC 3339)
        revokedAt:
          type: string
          format: date-time
          description: Revocation timestamp, present only on a revoke record
    ConversationRenamedResponse:
      type: object
      description: Result of renaming one conversation.
      required:
        - conversationId
        - title
      properties:
        conversationId:
          type: string
          description: The renamed conversation identifier
        title:
          type: string
          description: The applied title (null clears the rename)
    RenameConversationRequest:
      type: object
      description: Body for renaming a conversation (a blank title clears it).
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 200
          description: The new title (blank clears the rename)
    Memory:
      type: object
      description: >-
        A memory candidate or canonical record owned by exactly one user within a
        relationship. Model extraction only creates PENDING_CONFIRMATION
        candidates; ACCEPTED (canonical) is reached solely by user confirmation
        (INV-MEM-001/002). status follows the memory-candidate-statuses catalog.
      required:
        - memoryId
        - scope
        - summary
        - status
      properties:
        memoryId:
          type: string
          description: Stable owner-scoped memory identifier
        scope:
          type: string
          description: memory-scopes catalog code (SESSION or RELATIONSHIP in Alpha)
        summary:
          type: string
          description: Memory content summary
        status:
          type: string
          description: Current memory-candidate-statuses catalog code
        conversationId:
          type: string
          description: Owning conversation identifier, present for SESSION-scoped memory
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    MemoryCandidateCreateRequest:
      type: object
      description: Body for creating a memory candidate from model extraction.
      required:
        - scope
        - summary
      properties:
        scope:
          type: string
          description: memory-scopes catalog code; SESSION or RELATIONSHIP in Alpha
        summary:
          type: string
          description: Memory content summary proposed by the model
        conversationId:
          type: string
          description: Required when scope is SESSION (the binding conversation)
        evidence:
          type: array
          description: Cited source references supporting the candidate
          items:
            type: string
    MemoryUpdateRequest:
      type: object
      description: Body for editing a memory's content (status-preserving).
      required:
        - summary
      properties:
        summary:
          type: string
          description: The new memory content summary
    MemoryEvidence:
      type: object
      description: A cited source reference supporting a memory candidate.
      required:
        - evidenceId
        - sourceRef
      properties:
        evidenceId:
          type: string
          description: Stable owner-scoped evidence identifier
        sourceRef:
          type: string
          description: Cited source reference
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    LoginRequest:
      type: object
      description: Internal-account login credentials.
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          x-utf8-max-bytes: 512
          pattern: '.*\S.*'
          description: Internal account username; surrounding whitespace is removed and the value is lowercased
        password:
          type: string
          minLength: 1
          maxLength: 1024
          x-utf8-max-bytes: 4096
          pattern: '.*\S.*'
          description: Plaintext password (compared in the JVM, never stored or logged)
    AdminCreateAccountRequest:
      type: object
      description: >-
        Internal-account creation (ADMIN only). Role defaults to USER when
        omitted; only ADMIN or USER is accepted.
      required:
        - username
        - password
        - displayName
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          x-utf8-max-bytes: 512
          pattern: '.*\S.*'
          description: Internal account username (trimmed and normalized to lowercase)
        password:
          type: string
          minLength: 1
          maxLength: 1024
          x-utf8-max-bytes: 4096
          pattern: '.*\S.*'
          description: Plaintext password; only its BCrypt hash is stored
        role:
          type: string
          minLength: 1
          maxLength: 16
          x-utf8-max-bytes: 64
          pattern: '^(?:[Aa][Dd][Mm][Ii][Nn]|[Uu][Ss][Ee][Rr])$'
          description: ADMIN or USER (default USER)
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          x-utf8-max-bytes: 1024
          pattern: '.*\S.*'
          description: Human-readable display name
    AuthTokenResponse:
      type: object
      description: >-
        A new access token plus its refresh session. The raw refresh token is
        delivered only through the HttpOnly vc_refresh cookie; it is never
        returned in this response body.
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - accountId
        - role
      properties:
        accessToken:
          type: string
          description: JWT Bearer access token (expires after expiresInSeconds)
        tokenType:
          type: string
          description: Always Bearer
        expiresInSeconds:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        accountId:
          type: string
          description: The authenticated account id (also the owner_user_id)
        role:
          type: string
          description: ADMIN or USER
    LogoutResponse:
      type: object
      description: Idempotent logout acknowledgment.
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Always true; existence is never disclosed
    AccountListItem:
      type: object
      description: One internal account registry entry (never the password hash).
      required:
        - accountId
        - username
        - role
        - status
        - displayName
      properties:
        accountId:
          type: string
          description: The account id (also the owner_user_id)
        username:
          type: string
          description: Normalized (lowercase) internal username
        role:
          type: string
          description: ADMIN or USER
        status:
          type: string
          description: ACTIVE or DISABLED
        displayName:
          type: string
          description: Human-facing display name
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    DisableAccountResponse:
      type: object
      description: Result of disabling one internal account.
      required:
        - accountId
        - status
      properties:
        accountId:
          type: string
          description: The disabled account id
        status:
          type: string
          description: DISABLED
    AccountDeletedResponse:
      type: object
      description: Result of deleting the caller's own account (FR-AUTH-004).
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed deletion
    AuditEventListItem:
      type: object
      description: One identity_auth_event audit row (ADMIN-OPS).
      required:
        - id
        - eventType
        - username
        - occurredAt
      properties:
        id:
          type: string
          description: Monotonic event id (keyset cursor)
        eventType:
          type: string
          description: LOGIN_SUCCESS / LOGIN_FAILURE / LOGOUT / ACCOUNT_CREATE / ACCOUNT_DISABLE
        accountId:
          type: string
          description: Account the event is about, absent for login failures without a resolved account
        username:
          type: string
          description: Normalized username recorded with the event
        occurredAt:
          type: string
          format: date-time
          description: Event timestamp (RFC 3339)
    UsageSummaryItem:
      type: object
      description: One day of settled usage/cost aggregates (ADMIN-OPS).
      required:
        - day
        - generations
        - inputTokens
        - outputTokens
        - cost
      properties:
        day:
          type: string
          format: date
          description: UTC calendar day
        generations:
          type: integer
          format: int64
          minimum: 0
          description: Settled generations that day
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Settled provider input tokens that day
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Settled provider output tokens that day
        cost:
          type: number
          description: Settled actual cost that day (USD unless the deployment currency differs)
    AccountResponse:
      type: object
      description: An internal account (ADMIN creation result).
      required:
        - accountId
        - username
        - role
        - status
      properties:
        accountId:
          type: string
          description: The new account id (also the owner_user_id)
        username:
          type: string
          description: Normalized (lowercase) internal username
        role:
          type: string
          description: ADMIN or USER
        status:
          type: string
          description: ACTIVE at creation
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      description: The target internal account id
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped relationship identifier
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped conversation identifier
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped generation identifier
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped message identifier
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped reminder identifier
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped memory identifier
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped export request identifier
    ExportToken:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: The one-time download token handed out inside the authenticated status response

                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listConsents
      summary: The effective consent state per type (FR-AUTH-003)
      description: >-
        The LATEST consent record per type via vc.list_consents (the effective

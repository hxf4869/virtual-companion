openapi: 3.1.0
info:
  title: Virtual Companion API
  version: 0.1.0
  description: >-
    Contract-first HTTP API (ADR-0002). This document is the single source of
    truth; Java interfaces and TypeScript clients are generated from it and must
    not be hand-edited or used to back-drive the contract. The ErrorEnvelope
    shape is uniform across every error response; NOT_FOUND_OR_FORBIDDEN hides
    resource existence so a missing resource and a forbidden one are
    indistinguishable to the caller.
security:
  - bearerAuth: []
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Service version and build identity
      description: >-
        Baseline contract endpoint proving the OpenAPI -> Java interface and
        TypeScript client generation pipeline. Public, unauthenticated.
      security: []
      responses:
        '200':
          description: Service version and build identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/service-mode:
    get:
      operationId: getServiceMode
      summary: Current service mode (FR-RES-005 user transparency)
      description: >-
        The current generation-service mode for the authenticated caller:
        FULL_AI (live model providers wired) or ZERO_LLM (no generation model —
        deterministic record mode only). DEGRADED_AI / SAFETY_RESTRICTED /
        MAINTENANCE exist in the service-modes catalog but are not reachable in
        Technical Alpha and are never reported. The mode is an ops fact, never
        role-played content — clients must show it plainly (FR-RES-005).
        Requires a server-verified authentication context.
      responses:
        '200':
          description: The current service mode and a plain-language summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceModeStatus'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/age/state:
    get:
      operationId: getAgeState
      summary: The caller's effective age state (FR-AUTH-002)
      description: >-
        The effective adult-verification state of the caller (age-states
        catalog), AGE_UNKNOWN when never verified. The stored record carries
        only the result, the age band, the verification time and the provider
        reference — never an identity document. Requires a server-verified
        authentication context.
      responses:
        '200':
          description: The effective age state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeStateResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/age/verification:
    post:
      operationId: verifyAge
      summary: Run the simulated adult verification (FR-AUTH-002, Alpha port)
      description: >-
        Walks the age-states catalog transition table from the caller's
        current state to ADULT_VERIFIED through the vendor-agnostic
        AgeVerificationPort (Technical Alpha uses the deterministic simulated
        verifier; a real provider replaces the port implementation, never the
        callers). Every step is appended to the result history with the
        provider reference and verification time; no identity document is
        stored. A current state that the catalog forbids from reaching
        ADULT_VERIFIED (minor, appeal-pending, suspended) maps to
        INVALID_REQUEST (fail closed). Requires a server-verified
        authentication context.
      responses:
        '200':
          description: The new effective age state (ADULT_VERIFIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeStateResponse'
        '400':
          description: The current age state cannot complete adult verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships:
    post:
      operationId: createRelationship
      summary: Create a Companion relationship (becomes the active Companion)
      description: >-
        Creates a new relationship owned by the caller. The new relationship
        becomes the caller's single active Companion; any previously active
        relationship is atomically deactivated so activeCompanionLimit=1 always
        holds. Requires a server-verified authentication context; the caller's
        identity is the owner, never a request field. Concurrent creates for the
        same owner can never produce two active Companions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '200':
          description: The created relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listRelationships
      summary: List the caller's relationships
      description: >-
        Returns every relationship owned by the caller (the active Companion and
        any dormant ones). Requires a server-verified authentication context;
        other owners' relationships are never disclosed.
      responses:
        '200':
          description: Relationships owned by the caller (active and dormant)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}:
    get:
      operationId: getRelationship
      summary: Fetch a relationship owned by the caller
      description: >-
        Returns the relationship if it belongs to the caller. A foreign or
        absent id is indistinguishable and maps to NOT_FOUND_OR_FORBIDDEN so
        existence is never disclosed across owners.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The caller's relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: activateRelationship
      summary: Make a relationship the active Companion
      description: >-
        Promotes the target relationship to the caller's single active Companion,
        atomically deactivating any other active relationship. A foreign or
        absent id maps to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/deactivate:
    post:
      operationId: deactivateRelationship
      summary: Deactivate a relationship (zero active Companions permitted)
      description: >-
        Sets the caller's relationship inactive. Alpha permits zero active
        Companions. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN;
        existence is never disclosed.
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations:
    post:
      operationId: createConversation
      summary: Open a conversation under a relationship
      description: >-
        Creates a conversation row under one of the caller's relationships
        (vc.create_conversation). The caller identity is the owner;
        owner_user_id is never a request field. A foreign or absent relationship
        maps to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed. Requires a
        server-verified authentication context.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: The newly created conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listConversations
      summary: List the caller's conversations with a last-message preview
      description: >-
        Keyset-paginated conversations owned by the caller
        (vc.list_conversations), optionally scoped to one relationship. The
        after cursor is the last conversation id seen; ordering is stable by
        (owner, id). A foreign or absent relationship yields no rows and never
        discloses existence. Requires a server-verified authentication context.
      parameters:
        - name: relationshipId
          in: query
          required: false
          schema:
            type: string
          description: Restrict to conversations under this relationship; omit for all.
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor (the last conversation id seen); omit to start from the beginning.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of conversations, ordered oldest-first within the page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationListItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}:
    delete:
      operationId: deleteConversation
      summary: Delete one conversation (CONV-MGMT)
      description: >-
        Deletes the conversation; in-flight work items are cancelled and
        dependent rows (messages, generations, realtime events, usage) cascade
        inside the SD function. A foreign or absent id maps to
        NOT_FOUND_OR_FORBIDDEN (existence is never disclosed). Requires a
        server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: The conversation was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDeletedResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: renameConversation
      summary: Rename one conversation (CONV-MGMT)
      description: >-
        Writes the conversation title (a blank title clears the rename). A
        foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN (existence is never
        disclosed). Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConversationRequest'
      responses:
        '200':
          description: The renamed conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRenamedResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}/generations:
    post:
      operationId: sendGeneration
      summary: Idempotently send a Chat turn (create or rejoin a generation)
      description: >-
        Creates a new generation for the conversation or rejoins the existing
        one for the supplied idempotency key (vc.receive_generation). The caller
        identity is the owner; owner_user_id is never a request field. Requires a
        server-verified authentication context. Cross-conversation or cross-owner
        references never disclose existence.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendGenerationRequest'
      responses:
        '200':
          description: The generation (newly created or rejoined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Paginated message history for a conversation
      description: >-
        Keyset-paginated history of messages in a conversation (vc.list_messages).
        The after cursor is the last message id seen; ordering is stable by
        (owner, id). A foreign or absent conversation yields no rows and never
        discloses existence. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor (the last message id seen); omit to start from the beginning.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of messages, ordered oldest-first within the page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}/messages/{messageId}:
    delete:
      operationId: deleteMessage
      summary: Delete one message (FR-CHAT-004 / FR-DATA-003)
      description: >-
        Deletes one message of the caller's conversation via vc.delete_message.
        Memory evidence rows pointing at the message (source_ref
        message:{id}) are removed in the same transaction so no dangling
        evidence survives; confirmed memory items keep their content and
        remain manageable in the memory center. The assistant-message link on
        the owning generation is cleared (ON DELETE SET NULL). A foreign or
        absent message maps to NOT_FOUND_OR_FORBIDDEN; existence is never
        disclosed. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The message was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeletedResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: setMessageNoMemory
      summary: Flip the 不记住 negative-memory marker of one message (MEM-NEG)
      description: >-
        Marks or unmarks one owned message via vc.set_message_no_memory. A
        message flagged noMemory is skipped by the memory-extraction worker,
        so the negative intent survives at the source (message.no_memory per
        the V0.3 spec). The marker is reversible: false restores extraction.
        A foreign or absent message maps to NOT_FOUND_OR_FORBIDDEN; existence
        is never disclosed. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageNoMemoryUpdate'
      responses:
        '200':
          description: The updated message with its noMemory marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid body (noMemory missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel a non-terminal generation
      description: >-
        Transitions a cancellable non-terminal generation to CANCELLED
        (vc.cancel_generation via the catalog double-hop CANCEL_REQUESTED then
        CANCELLED). Terminal states and COMMITTING are not cancellable. A foreign
        or absent id maps to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: The generation, now in CANCELLED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/snapshot:
    get:
      operationId: getGenerationSnapshot
      summary: Read a consistent generation snapshot
      description: >-
        Returns the generation status, the final assistant message id (if any),
        and the ordered realtime event stream up to a consistent point
        (vc.read_generation_snapshot). A foreign or absent id never discloses
        existence. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: A consistent generation snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/feedback:
    post:
      operationId: recordGenerationFeedback
      summary: Record user feedback on a generation (FR-CHAT-003)
      description: >-
        Records one owner-scoped feedback row per (generation, kind) via
        vc.record_generation_feedback; a repeated submission of the same kind
        for the same generation is an idempotent no-op (the first note wins).
        kind follows the message-feedback-kinds catalog. A foreign or absent
        generation maps to NOT_FOUND_OR_FORBIDDEN; existence is never
        disclosed. Requires a server-verified authentication context.
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationFeedbackCreateRequest'
      responses:
        '200':
          description: The recorded feedback (created or already present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationFeedbackResponse'
        '400':
          description: Unapproved feedback kind or an invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/realtime/tickets:
    post:
      operationId: createRealtimeTicket
      summary: Mint a single-use Fetch-SSE resume ticket bound to the caller's generation
      description: >-
        Mints a short-lived single-use resume ticket via vc.issue_realtime_ticket,
        bound to the seven-tuple (owner, generation, session, origin, transport,
        streamEpoch, afterSeq). The owner is taken from the server-verified
        principal and never from the body; transport is fixed to FETCH_SSE (the
        only Alpha realtime transport) and is also not accepted from the body.
        The server stores only sha256(secret); the plaintext secret is returned
        exactly once and must be consumed within the 45s TTL when opening the
        SSE resume stream (separate task). A foreign or absent generation maps
        to NOT_FOUND_OR_FORBIDDEN so existence is never disclosed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketCreateRequest'
      responses:
        '200':
          description: The minted ticket with its one-time plaintext secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
        '400':
          description: Malformed body or non-positive identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/realtime/streams/{generationId}:
    get:
      operationId: openRealtimeStream
      summary: Open the Fetch-SSE resume stream for a generation
      description: >-
        Opens the single Alpha realtime transport (FETCH_SSE) resume stream.
        The caller binds the connection to a single-use resume ticket minted by
        POST /api/v1/realtime/tickets: vc.consume_realtime_ticket validates the
        secret (sha256-only stored), the boundTo seven-tuple, single-use and the
        45s TTL, failing closed on any mismatch. The owner is taken from the
        server-verified principal and never from the query; transport is fixed
        to FETCH_SSE. The resume cursor afterSeq is carried by the SSE-standard
        Last-Event-ID header (defaulting to 0 when absent); ticketId, secret,
        sessionId, origin and streamEpoch are bound via query parameters — the
        secret is a short-lived single-use credential, not the long-lived token
        forbidden in the realtime query (h5Security). vc.resume_stream returns
        one of five dispositions, mapped to SSE events: RESUMED and
        TERMINAL_SNAPSHOT emit the ordered durable events (and the committed
        snapshot for a terminal generation) then complete; GAP_EXPIRED emits
        stream.gap; RESET_REQUIRED emits stream.reset; a foreign or absent
        generation, or any ticket-consume failure, emits stream.denied so
        existence is never disclosed. A 400 INVALID_REQUEST is returned only
        before the stream opens, for a malformed or missing parameter.
      parameters:
        - $ref: '#/components/parameters/GenerationId'
        - name: ticketId
          in: query
          required: true
          schema:
            type: string
          description: The server-assigned id of the resume ticket to consume
        - name: secret
          in: query
          required: true
          schema:
            type: string
          description: One-time plaintext ticket secret (sha256-only persisted)
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
          description: The caller's realtime session id (must match the ticket binding)
        - name: origin
          in: query
          required: true
          schema:
            type: string
          description: The origin the SSE resume is opened from (must match the ticket binding)
        - name: streamEpoch
          in: query
          required: true
          schema:
            type: string
          description: The stream epoch the caller last observed (must match the ticket binding)
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: The last contiguous eventSeq the caller advanced to (defaults to 0)
      responses:
        '200':
          description: The Fetch-SSE resume stream opened (text/event-stream)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeStreamEvent'
        '400':
          description: Malformed or missing parameter before the stream opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:

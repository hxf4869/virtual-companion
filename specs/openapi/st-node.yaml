openapi: 3.1.0
info:
  title: Virtual Companion ST Node document commits
  version: 1.0.0
  description: >-
    NF-07：现有 ST JSON 保存路由的有条件局部提交。使用同一原始文件，不创建配置版本库。
    原生页面、Helper 与自有桌面持有读取基线；全部 before 匹配后才提交。
    原有未携带 vc_changes 的完整替换接口保留给已存在的受管装配/导入调用，不能视为有条件提交。
servers:
  - url: /
security:
  - vcSession: []
paths:
  /api/settings/save:
    post:
      operationId: stCommitSettings
      summary: 按读取旧值提交设置字段
      parameters:
        - $ref: '#/components/parameters/STCSRF'
        - $ref: '#/components/parameters/ExpectedAccount'
        - $ref: '#/components/parameters/ExpectedSession'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsCommit'
      responses:
        '200':
          description: 原子提交成功；保留原 result=ok 响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { const: ok }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/presets/save:
    post:
      operationId: stCommitPreset
      summary: 按读取旧值提交既有格式的预设
      parameters:
        - $ref: '#/components/parameters/STCSRF'
        - $ref: '#/components/parameters/ExpectedAccount'
        - $ref: '#/components/parameters/ExpectedSession'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetCommit'
      responses:
        '200':
          description: 提交成功；保留原 name 响应
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/worldinfo/edit:
    post:
      operationId: stCommitWorldbook
      summary: 按读取旧值提交世界书条目
      parameters:
        - $ref: '#/components/parameters/STCSRF'
        - $ref: '#/components/parameters/ExpectedAccount'
        - $ref: '#/components/parameters/ExpectedSession'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldbookCommit'
      responses:
        '200':
          description: 提交成功；保留原 ok=true 响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/st/chat-cutover/freeze:
    post:
      operationId: stFreezeChatAdmission
      summary: Persistently close old-chat admission for one frozen Owner
      description: >-
        SX-8 private HTTP proposal, not implemented; requires Owner review. Existing private service token only;
        reject every Origin header, including an empty one, and verify the configured owner-to-handle mapping.
        The trusted operator first commits ST-to-FROZEN authority CAS in Go with a new epoch. ST never queries Go
        for authority. Synchronously close this Owner's local admission before any await, then fsync and atomically
        rename .vc-f2/chat-cutover.json (0700 directory, 0600 file). Reject symlinks/corrupt markers. No handler may
        enter while persistence is pending. Return 200 only after the marker is durable; activeHandlers may still
        be nonzero. Same run/epoch is idempotent; a different run/epoch is 409 REVISION_CONFLICT and stays closed.
        This is not proof of drain and does not authorize export. A failed close remains closed in the current
        process; a restart loads the durable marker or fails closed on an interrupted/corrupt marker. The single
        Node process serves this ST root; a second process using the same root is unsupported and must block cutover.
        For this and drain/status, the Node route deadline is 150 seconds; control work is bounded to 120 seconds.
        A timeout returns 503 CHAT_TRANSFER_TIMEOUT with Retry-After 1, never a generic storage failure or success.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCutoverRequest' }
      responses:
        '200':
          description: Admission closed durably; not necessarily drained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCutoverStatus' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatCutoverForbidden' }
        '409': { $ref: '#/components/responses/ChatCutoverConflict' }
        '503': { $ref: '#/components/responses/ChatTransferUnavailable' }
  /internal/v1/st/chat-cutover/drain:
    post:
      operationId: stDrainChatHandlers
      summary: Wait for admitted server handlers to finish before trusted export
      description: >-
        SX-8 private HTTP proposal, not implemented; requires Owner review. Same authentication and owner/run/epoch
        checks as freeze. The gate must already be durably closed for this exact run and epoch. Wait for active
        sources, inbox saves/readbacks and supported native chat-file handlers to finish their finally blocks.
        Socket finish/close, Go caller timeout, elapsed time and a disconnected client never decrement this count.
        Late requests are rejected without touching the old chat disk. Return DRAINED only when activeHandlers is
        zero; cancellation or the 120-second wait deadline keeps the gate closed, returns a typed timeout when the
        response can still be sent, and forbids export. Retrying this same request waits for the same drain.
        The trusted local operator may export only after DRAINED and must recheck the same run/epoch before opening
        frozen files. Existing F2 pending journal recovery and verification must finish before the manifest is
        sealed; an unreadable or unknown source blocks export rather than being treated as deleted.
        Export and import are separate trusted local CLI operations, not public uploads. The CLI verifies each
        manifest/hash and stages each chat outside the database; then uses a dedicated owner-bound 120-second
        transaction per chat, with PostgreSQL statement_timeout=120000ms and lock_timeout=5000ms, preserving FORCE
        RLS and owner/export/memory barriers. It does not call the normal five-second WithOwner boundary. All raw
        identities, tombstones and that chat's STAGED checkpoint commit together. Authority stays FROZEN until the
        entire run and current rights union are verified. Begin/bind/lock/work/statement/commit timeouts map to the
        same CHAT_TRANSFER_TIMEOUT outcome; retry the same (run,owner,oldIdentity,sourceHash) checkpoint. An unknown
        commit acknowledgement is resolved from that checkpoint, never by allocating another identity. No failed
        or partial chat is marked STAGED. Full activation and any real-account execution require separate Owner
        authorization. See specs/contracts/chat-transfer-contract.yaml for the complete trusted artifact contract.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCutoverRequest' }
      responses:
        '200':
          description: Server processing completed; exact run remains durably closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCutoverDrained' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatCutoverForbidden' }
        '409': { $ref: '#/components/responses/ChatCutoverConflict' }
        '503': { $ref: '#/components/responses/ChatTransferUnavailable' }
  /internal/v1/st/chat-cutover/status:
    post:
      operationId: stReadChatDrainStatus
      summary: Read exact run admission and active-handler status without changing it
      description: >-
        SX-8 private HTTP proposal, not implemented; requires Owner review. Same service authentication, Origin
        rejection and owner/run/epoch validation as freeze. Pure in-memory status, with the marker loaded before
        accepting traffic on startup. No Go authority callback and no old-chat disk read. DRAINED means closed,
        durable and activeHandlers=0. A different run/epoch or an open gate is 409; unavailable marker state is 503.
        This does not silently close or reopen a gate. Neither this route nor a browser/native request changes
        database authority. Logs contain fixed operation/outcome and aggregate counts only, no owner/run identity.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCutoverRequest' }
      responses:
        '200':
          description: Current admission/handler state for the exact run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCutoverStatus' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatCutoverForbidden' }
        '409': { $ref: '#/components/responses/ChatCutoverConflict' }
        '503': { $ref: '#/components/responses/ChatTransferUnavailable' }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Existing private ST service token; never sent to browsers.
    vcSession:
      type: apiKey
      in: cookie
      name: vc_session
  parameters:
    STCSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    ExpectedAccount:
      name: X-VC-Expected-Account-ID
      in: header
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    ExpectedSession:
      name: X-VC-Expected-Session-ID
      in: header
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
  schemas:
    ChatCutoverRequest:
      type: object
      additionalProperties: false
      required: [ownerAccountId, runId, authorityEpoch]
      properties:
        ownerAccountId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        runId: { type: string, format: uuid }
        authorityEpoch: { type: string, pattern: '^[1-9][0-9]*$' }
      description: The authenticated operator supplies the already committed FROZEN epoch; ST does not infer it.
    ChatCutoverStatus:
      type: object
      additionalProperties: false
      required: [ownerAccountId, runId, authorityEpoch, state, closed, durable, activeHandlers]
      properties:
        ownerAccountId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        runId: { type: string, format: uuid }
        authorityEpoch: { type: string, pattern: '^[1-9][0-9]*$' }
        state: { type: string, enum: [CLOSED, DRAINED] }
        closed: { const: true }
        durable: { const: true }
        activeHandlers: { type: integer, minimum: 0 }
      oneOf:
        - properties:
            state: { const: CLOSED }
            activeHandlers: { type: integer, minimum: 1 }
        - properties:
            state: { const: DRAINED }
            activeHandlers: { const: 0 }
    ChatCutoverDrained:
      allOf:
        - $ref: '#/components/schemas/ChatCutoverStatus'
        - type: object
          properties:
            state: { const: DRAINED }
            activeHandlers: { const: 0 }
    ValueState:
      type: object
      required: [exists]
      additionalProperties: false
      properties:
        exists: { type: boolean }
        value: {}
      if:
        properties:
          exists: { const: true }
      then:
        required: [value]
    Change:
      type: object
      required: [path, before, after]
      additionalProperties: false
      properties:
        path:
          type: array
          items: { type: string, minLength: 1 }
          description: >-
            字面对象键路径，点不分段；数组必须整体修改，不接受数组下标路径。
            拒绝原型污染键、重复路径及祖先/后代重叠。空路径仅用于明确新建或覆盖完整文档。
        before: { $ref: '#/components/schemas/ValueState' }
        after: { $ref: '#/components/schemas/ValueState' }
      description: >-
        缺失与null不同；after.exists=false删除属性。对象按键值比较，数组按顺序比较。
        所有before必须匹配，否则整批不写；冲突响应不回传旧值、配置或凭据。
    SettingsCommit:
      type: object
      required: [vc_changes]
      additionalProperties: false
      properties:
        vc_changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
    PresetCommit:
      type: object
      required: [name, apiId, vc_changes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        apiId:
          type: string
          enum: [openai, instruct, context, sysprompt, reasoning, kobold, koboldhorde, novel, textgenerationwebui]
        vc_changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
    WorldbookCommit:
      type: object
      required: [name, vc_changes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        vc_changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
    ErrorCode:
      type: string
      enum: [VC_DOCUMENT_CONFLICT, VC_DOCUMENT_INVALID, VC_DOCUMENT_UNAVAILABLE, VC_AUTH_REQUIRED, ACCOUNT_CONTEXT_CHANGED, NOT_FOUND_OR_FORBIDDEN]
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
  responses:
    ChatCutoverForbidden:
      description: ACCESS_DENIED; browser Origin or unmapped/inactive owner is rejected.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties: { code: { const: ACCESS_DENIED } }
    ChatCutoverConflict:
      description: REVISION_CONFLICT; run/epoch mismatch or gate not durably closed. Keep it closed; never infer drain.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties: { code: { const: REVISION_CONFLICT } }
    ChatTransferUnavailable:
      description: >-
        CHAT_TRANSFER_TIMEOUT for a bounded operation/drain timeout, SCHEMA_UNAVAILABLE for unavailable/corrupt local
        state. Gate stays closed. Retry-After is 1 for timeout. Retry the same exact run/epoch; never export on failure.
      headers:
        Retry-After: { schema: { type: integer, const: 1 } }
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [CHAT_TRANSFER_TIMEOUT, SCHEMA_UNAVAILABLE] }
    Invalid:
      description: 非法路径、文档、基线或变更；无写入
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未认证，不写入
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 任一旧值或页面身份不匹配，整批不写，客户端保留草稿
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: 受管保存钩子不可用，不能退回完整覆盖
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

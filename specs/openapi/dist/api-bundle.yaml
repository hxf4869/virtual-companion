            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown username or wrong password; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'AUTH_RATE_LIMITED: Authentication is temporarily rate limited'
          headers:
            Retry-After:
              description: Positive integer seconds before another admission attempt
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Renew a session from a refresh token
      description: 'Java runtime until Go cutover: validates the presented refresh token server-side (unrevoked, unexpired,
        ACTIVE account), revokes it and issues a new access token and refresh session. Go v1 (ADR-0007): RETIRE this operation
        together with H5 auto-refresh; opaque vc_session has no refresh chain. Public. An unknown, revoked, expired or DISABLED-account
        token all map to AUTHENTICATION_REQUIRED; the cause is never disclosed. Before token hashing or session JDBC, a Technical
        Alpha single-instance admission guard applies route-source and token rolling windows and the same non-blocking concurrency
        bulkhead. Servlet remoteAddr is authoritative; forwarded client-address headers are ignored.'
      security: []
      parameters:
      - in: cookie
        name: vc_refresh
        required: true
        schema:
          type: string
          x-utf8-max-bytes: 512
        description: Required HttpOnly refresh cookie; the raw value is never accepted in a request body.
      responses:
        '200':
          description: 'Java runtime: new access token; the rotated refresh session is delivered only through the HttpOnly
            vc_refresh cookie. Go v1: this operation is RETIRE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid, revoked, expired or disabled refresh session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'AUTH_RATE_LIMITED: Authentication is temporarily rate limited'
          headers:
            Retry-After:
              description: Positive integer seconds before another admission attempt
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh session
      description: 'Revokes the caller''s presented refresh session. Idempotent: a second logout or a foreign/unknown token
        is still reported as success so existence is never disclosed. Requires a valid Bearer access token.'
      parameters:
      - in: cookie
        name: vc_refresh
        required: true
        schema:
          type: string
          x-utf8-max-bytes: 512
        description: Required HttpOnly refresh cookie; the raw value is never accepted in a request body.
      responses:
        '200':
          description: The refresh session was revoked (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/sessions:

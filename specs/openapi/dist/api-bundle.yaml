      description: 'Appends a versioned consent record for the caller via vc.record_consent (append-only history; the latest
        row per type is the effective state). consentType follows the FR-AUTH-003 catalogue; version is the policy document
        version the user saw. Withdrawing MODEL_TRAINING never affects basic chat service. ADR-0006 §7.7: a revocation (granted=false)
        is a high-risk operation and MUST carry the caller''s CURRENT password (verified synchronously, fail-closed, no time
        window); a grant (granted=true) is low-risk and never asks for one. Requires a server-verified authentication context.'
      requestBody:

                  $ref: '#/components/schemas/AuthSession'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeAuthSession
      summary: Revoke one refresh family
      description: Revokes the named live session and its rotation family. Foreign or unknown ids fail closed without disclosing
        existence. Idempotent.
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Revoked (or already absent)

  /api/v1/auth/account:
    delete:
      operationId: deleteAccount
      summary: Delete the caller's own account (FR-AUTH-004)
      description: 'Self-service account deletion (注销受理). ADR-0006 §7.7: the caller must re-enter the CURRENT password in
        the body; it is verified synchronously (fail-closed, no time window) before anything is deleted, and a wrong password
        keeps the session alive. Before the destructive cascade, V103 independently commits an owner-bound deletion intent,
        cancels durable generation/work and cooperatively signals provider sessions on every instance. The intent blocks new
        outbound and late message/memory/vector/export writes. The caller''s account, refresh sessions and owned business
        data are then removed through the vc_user cascade. The append-only compliance audit and a tombstone containing only
        account id plus username digest survive; the deleted username cannot be recreated. An already-deleted or disabled
        account maps to NOT_FOUND_OR_FORBIDDEN (existence is never disclosed). Requires a valid Bearer access token.'
      requestBody:
        required: true
        x-raw-max-bytes: 16384
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: The account was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletedResponse'
        '400':
          description: Missing, unreadable or invalid request body (blank currentPassword)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Wrong current password, or account absent, already deleted or disabled; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

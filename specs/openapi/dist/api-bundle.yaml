openapi: 3.1.0
info:
  title: Virtual Companion API
  version: 0.1.0
  description: Contract-first HTTP API (ADR-0002). This document is the single source of truth; Java interfaces and TypeScript
    clients are generated from it and must not be hand-edited or used to back-drive the contract. The ErrorEnvelope shape
    is uniform across every error response; NOT_FOUND_OR_FORBIDDEN hides resource existence so a missing resource and a forbidden
    one are indistinguishable to the caller.
security:
- bearerAuth: []
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Service version and build identity
      description: Baseline contract endpoint proving the OpenAPI -> Java interface and TypeScript client generation pipeline.
        Public, unauthenticated.
      security: []
      responses:
        '200':
          description: Service version and build identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships:
    post:
      operationId: createRelationship
      summary: Create a Companion relationship (becomes the active Companion)
      description: Creates a new relationship owned by the caller. The new relationship becomes the caller's single active
        Companion; any previously active relationship is atomically deactivated so activeCompanionLimit=1 always holds. Requires
        a server-verified authentication context; the caller's identity is the owner, never a request field. Concurrent creates
        for the same owner can never produce two active Companions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '200':
          description: The created relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listRelationships
      summary: List the caller's relationships
      description: Returns every relationship owned by the caller (the active Companion and any dormant ones). Requires a
        server-verified authentication context; other owners' relationships are never disclosed.
      responses:
        '200':
          description: Relationships owned by the caller (active and dormant)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}:
    get:
      operationId: getRelationship
      summary: Fetch a relationship owned by the caller
      description: Returns the relationship if it belongs to the caller. A foreign or absent id is indistinguishable and maps
        to NOT_FOUND_OR_FORBIDDEN so existence is never disclosed across owners.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The caller's relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: activateRelationship
      summary: Make a relationship the active Companion
      description: Promotes the target relationship to the caller's single active Companion, atomically deactivating any other
        active relationship. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/deactivate:
    post:
      operationId: deactivateRelationship
      summary: Deactivate a relationship (zero active Companions permitted)
      description: Sets the caller's relationship inactive. Alpha permits zero active Companions. A foreign or absent id maps
        to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations:
    post:
      operationId: createConversation
      summary: Open a conversation under a relationship
      description: Creates a conversation row under one of the caller's relationships (vc.create_conversation). The caller
        identity is the owner; owner_user_id is never a request field. A foreign or absent relationship maps to NOT_FOUND_OR_FORBIDDEN;
        existence is never disclosed. Requires a server-verified authentication context.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: The newly created conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listConversations
      summary: List the caller's conversations with a last-message preview
      description: Keyset-paginated conversations owned by the caller (vc.list_conversations), optionally scoped to one relationship.
        The after cursor is the last conversation id seen; ordering is stable by (owner, id). A foreign or absent relationship
        yields no rows and never discloses existence. Requires a server-verified authentication context.
      parameters:
      - name: relationshipId
        in: query
        required: false
        schema:
          type: string
        description: Restrict to conversations under this relationship; omit for all.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor (the last conversation id seen); omit to start from the beginning.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of conversations, ordered oldest-first within the page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationListItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}:
    delete:
      operationId: deleteConversation
      summary: Delete one conversation (CONV-MGMT)
      description: Deletes the conversation; in-flight work items are cancelled and dependent rows (messages, generations,
        realtime events, usage) cascade inside the SD function. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN (existence
        is never disclosed). Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: The conversation was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDeletedResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: renameConversation
      summary: Rename one conversation (CONV-MGMT)
      description: Writes the conversation title (a blank title clears the rename). A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN
        (existence is never disclosed). Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConversationRequest'
      responses:
        '200':
          description: The renamed conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRenamedResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}/generations:
    post:
      operationId: sendGeneration
      summary: Idempotently send a Chat turn (create or rejoin a generation)
      description: Creates a new generation for the conversation or rejoins the existing one for the supplied idempotency
        key (vc.receive_generation). The caller identity is the owner; owner_user_id is never a request field. Requires a
        server-verified authentication context. Cross-conversation or cross-owner references never disclose existence.
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendGenerationRequest'
      responses:
        '200':
          description: The generation (newly created or rejoined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Paginated message history for a conversation
      description: Keyset-paginated history of messages in a conversation (vc.list_messages). The after cursor is the last
        message id seen; ordering is stable by (owner, id). A foreign or absent conversation yields no rows and never discloses
        existence. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor (the last message id seen); omit to start from the beginning.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of messages, ordered oldest-first within the page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel a non-terminal generation
      description: Transitions a cancellable non-terminal generation to CANCELLED (vc.cancel_generation via the catalog double-hop
        CANCEL_REQUESTED then CANCELLED). Terminal states and COMMITTING are not cancellable. A foreign or absent id maps
        to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
      - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: The generation, now in CANCELLED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/snapshot:
    get:
      operationId: getGenerationSnapshot
      summary: Read a consistent generation snapshot
      description: Returns the generation status, the final assistant message id (if any), and the ordered realtime event
        stream up to a consistent point (vc.read_generation_snapshot). A foreign or absent id never discloses existence. Requires
        a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: A consistent generation snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generations/{generationId}/feedback:
    post:
      operationId: recordGenerationFeedback
      summary: Record user feedback on a generation (FR-CHAT-003)
      description: Records one owner-scoped feedback row per (generation, kind) via vc.record_generation_feedback; a repeated
        submission of the same kind for the same generation is an idempotent no-op (the first note wins). kind follows the
        message-feedback-kinds catalog. A foreign or absent generation maps to NOT_FOUND_OR_FORBIDDEN; existence is never
        disclosed. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/GenerationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationFeedbackCreateRequest'
      responses:
        '200':
          description: The recorded feedback (created or already present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationFeedbackResponse'
        '400':
          description: Unapproved feedback kind or an invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/realtime/tickets:
    post:
      operationId: createRealtimeTicket
      summary: Mint a single-use Fetch-SSE resume ticket bound to the caller's generation
      description: Mints a short-lived single-use resume ticket via vc.issue_realtime_ticket, bound to the seven-tuple (owner,
        generation, session, origin, transport, streamEpoch, afterSeq). The owner is taken from the server-verified principal
        and never from the body; transport is fixed to FETCH_SSE (the only Alpha realtime transport) and is also not accepted
        from the body. The server stores only sha256(secret); the plaintext secret is returned exactly once and must be consumed
        within the 45s TTL when opening the SSE resume stream (separate task). A foreign or absent generation maps to NOT_FOUND_OR_FORBIDDEN
        so existence is never disclosed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketCreateRequest'
      responses:
        '200':
          description: The minted ticket with its one-time plaintext secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
        '400':
          description: Malformed body or non-positive identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/realtime/streams/{generationId}:
    get:
      operationId: openRealtimeStream
      summary: Open the Fetch-SSE resume stream for a generation
      description: 'Opens the single Alpha realtime transport (FETCH_SSE) resume stream. The caller binds the connection to
        a single-use resume ticket minted by POST /api/v1/realtime/tickets: vc.consume_realtime_ticket validates the secret
        (sha256-only stored), the boundTo seven-tuple, single-use and the 45s TTL, failing closed on any mismatch. The owner
        is taken from the server-verified principal and never from the query; transport is fixed to FETCH_SSE. The resume
        cursor afterSeq is carried by the SSE-standard Last-Event-ID header (defaulting to 0 when absent); ticketId, secret,
        sessionId, origin and streamEpoch are bound via query parameters — the secret is a short-lived single-use credential,
        not the long-lived token forbidden in the realtime query (h5Security). vc.resume_stream returns one of five dispositions,
        mapped to SSE events: RESUMED and TERMINAL_SNAPSHOT emit the ordered durable events (and the committed snapshot for
        a terminal generation) then complete; GAP_EXPIRED emits stream.gap; RESET_REQUIRED emits stream.reset; a foreign or
        absent generation, or any ticket-consume failure, emits stream.denied so existence is never disclosed. A 400 INVALID_REQUEST
        is returned only before the stream opens, for a malformed or missing parameter.'
      parameters:
      - $ref: '#/components/parameters/GenerationId'
      - name: ticketId
        in: query
        required: true
        schema:
          type: string
        description: The server-assigned id of the resume ticket to consume
      - name: secret
        in: query
        required: true
        schema:
          type: string
        description: One-time plaintext ticket secret (sha256-only persisted)
      - name: sessionId
        in: query
        required: true
        schema:
          type: string
        description: The caller's realtime session id (must match the ticket binding)
      - name: origin
        in: query
        required: true
        schema:
          type: string
        description: The origin the SSE resume is opened from (must match the ticket binding)
      - name: streamEpoch
        in: query
        required: true
        schema:
          type: string
        description: The stream epoch the caller last observed (must match the ticket binding)
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
        description: The last contiguous eventSeq the caller advanced to (defaults to 0)
      responses:
        '200':
          description: The Fetch-SSE resume stream opened (text/event-stream)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeStreamEvent'
        '400':
          description: Malformed or missing parameter before the stream opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/memories/candidates:
    post:
      operationId: createMemoryCandidate
      summary: Create a memory candidate from model extraction (PENDING_CONFIRMATION)
      description: The model-extraction entry point that persists a memory candidate (vc.create_memory_candidate). The candidate
        is always created in PENDING_CONFIRMATION and never ACCEPTED; canonical memory is reached only by the user confirming
        it later (INV-MEM-001/002). Alpha scope is SESSION or RELATIONSHIP; SESSION additionally requires a conversation binding.
        The caller identity is the owner. Requires a server-verified authentication context; a foreign relationship maps to
        NOT_FOUND_OR_FORBIDDEN.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCandidateCreateRequest'
      responses:
        '200':
          description: The created candidate, in PENDING_CONFIRMATION status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/memories:
    get:
      operationId: listMemories
      summary: List the caller's memory for a relationship
      description: Returns the memory candidates and canonical records scoped to a relationship (vc.list_memory). Soft-deleted
        records are excluded unless includeDeleted is set. Another relationship's memory is never disclosed; a foreign relationship
        yields no rows and never discloses existence. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
        description: Include soft-deleted memory in the result (default false).
      responses:
        '200':
          description: Memory scoped to the relationship (excluding deleted by default)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}:
    get:
      operationId: getMemory
      summary: Fetch a memory owned by the caller
      description: Returns a non-deleted memory owned by the caller (vc.get_memory). A foreign, absent or deleted id maps
        to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The caller's memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateMemory
      summary: Edit a memory's content (status-preserving, idempotent)
      description: 'Edits the summary of an owned, non-deleted, editable memory (vc.update_memory). Only PENDING_CONFIRMATION
        and ACCEPTED memories are editable; status is never changed, so this cannot create or revive a canonical record. Idempotent:
        applying the same summary twice succeeds both times. A foreign, absent, deleted or dead-end id maps to NOT_FOUND_OR_FORBIDDEN.
        Requires a server-verified authentication context.'
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdateRequest'
      responses:
        '200':
          description: The updated memory, status unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteMemory
      summary: Soft-delete a memory (idempotent)
      description: 'Soft-deletes an owned memory (vc.delete_memory). Idempotent on already- deleted rows: a duplicate delete
        of the caller''s own memory returns success. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN; existence is never
        disclosed. Requires a server-verified authentication context.'
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The memory was soft-deleted (or was already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}/confirm:
    post:
      operationId: confirmMemoryCandidate
      summary: Confirm a pending candidate into canonical memory
      description: The sole path to a canonical (ACCEPTED) record (vc.confirm_memory_candidate). Only a PENDING_CONFIRMATION
        candidate can be confirmed; confirming an already-confirmed or otherwise transitioned memory is rejected and maps
        to NOT_FOUND_OR_FORBIDDEN (confirm is intentionally not idempotent into canonical). Requires a server-verified authentication
        context.
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The memory, now in ACCEPTED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}/reject:
    post:
      operationId: rejectMemoryCandidate
      summary: Reject a pending candidate
      description: Rejects a PENDING_CONFIRMATION candidate (vc.reject_memory_candidate). Only a pending candidate can be
        rejected; rejecting an already-transitioned memory is rejected and maps to NOT_FOUND_OR_FORBIDDEN. Requires a server-verified
        authentication context.
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The memory, now in REJECTED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memories/{memoryId}/evidence:
    get:
      operationId: listMemoryEvidence
      summary: List the source Evidence of a memory
      description: Returns the source Evidence chain of an owned, non-deleted memory (vc.list_memory_evidence). A foreign,
        absent or deleted id yields no rows, indistinguishable from a real memory that carries no evidence, so existence is
        never disclosed. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: The ordered source Evidence for the memory (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryEvidence'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with internal-account credentials
      description: Exchanges a username and password for an access token and a refresh session. Public. An unknown user and
        a wrong password are indistinguishable and both map to NOT_FOUND_OR_FORBIDDEN (existence is never disclosed); a DISABLED
        account maps to AUTHENTICATION_REQUIRED. Credentials are never logged, placed in a URL or stored. Before account lookup
        or password verification, a Technical Alpha single-instance admission guard applies route-source and source-plus-canonical-username
        rolling windows and a non-blocking shared concurrency bulkhead. Servlet remoteAddr is authoritative; forwarded client-address
        headers are ignored.
      security: []
      requestBody:
        required: true
        x-raw-max-bytes: 16384
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: New access token; the refresh session is delivered only through the HttpOnly vc_refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Missing, unreadable or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: DISABLED account (cause is not disclosed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown username or wrong password; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'AUTH_RATE_LIMITED: Authentication is temporarily rate limited'
          headers:
            Retry-After:
              description: Positive integer seconds before another admission attempt
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Renew a session from a refresh token
      description: Validates the presented refresh token server-side (unrevoked, unexpired, ACTIVE account), revokes it and
        issues a new access token and refresh session. Public. An unknown, revoked, expired or DISABLED-account token all
        map to AUTHENTICATION_REQUIRED; the cause is never disclosed. Before token hashing or session JDBC, a Technical Alpha
        single-instance admission guard applies route-source and token rolling windows and the same non-blocking concurrency
        bulkhead. Servlet remoteAddr is authoritative; forwarded client-address headers are ignored.
      security: []
      parameters:
      - in: cookie
        name: vc_refresh
        required: true
        schema:
          type: string
          x-utf8-max-bytes: 512
        description: Required HttpOnly refresh cookie; the raw value is never accepted in a request body.
      responses:
        '200':
          description: New access token; the rotated refresh session is delivered only through the HttpOnly vc_refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid, revoked, expired or disabled refresh session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'AUTH_RATE_LIMITED: Authentication is temporarily rate limited'
          headers:
            Retry-After:
              description: Positive integer seconds before another admission attempt
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh session
      description: 'Revokes the caller''s presented refresh session. Idempotent: a second logout or a foreign/unknown token
        is still reported as success so existence is never disclosed. Requires a valid Bearer access token.'
      parameters:
      - in: cookie
        name: vc_refresh
        required: true
        schema:
          type: string
          x-utf8-max-bytes: 512
        description: Required HttpOnly refresh cookie; the raw value is never accepted in a request body.
      responses:
        '200':
          description: The refresh session was revoked (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/accounts:
    post:
      operationId: createInternalAccount
      summary: Create an internal account (ADMIN only)
      description: 'Creates an internal account for an ACTIVE ADMIN caller. No public registration: a non-ADMIN caller maps
        to ACCESS_DENIED. The new account starts ACTIVE; a duplicate username maps to NOT_FOUND_OR_FORBIDDEN so existence
        is never disclosed. Requires a valid Bearer access token.'
      requestBody:
        required: true
        x-raw-max-bytes: 16384
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateAccountRequest'
      responses:
        '200':
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Missing, unreadable or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Duplicate username; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listInternalAccounts
      summary: List internal accounts (ADMIN only, ADMIN-ACCTS)
      description: 'The account registry for the management UI. ADMIN only: a non-ADMIN caller maps to ACCESS_DENIED. Never
        exposes password hashes. Requires a valid Bearer access token.'
      responses:
        '200':
          description: The account registry ordered by account id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountListItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/accounts/{accountId}/disable:
    post:
      operationId: disableInternalAccount
      summary: Disable an internal account (ADMIN only, ADMIN-ACCTS)
      description: Flips one account to DISABLED (idempotent). Login/refresh for a DISABLED account is rejected by the existing
        identity flow. An admin cannot disable their own account; a non-ADMIN caller maps to ACCESS_DENIED; an unknown target
        fails closed (existence is never disclosed). Requires a valid Bearer access token.
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account was disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisableAccountResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role or targets themselves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target account absent; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/audit:
    get:
      operationId: listAdminAuditEvents
      summary: Keyset-paginated audit event list (ADMIN only, ADMIN-OPS)
      description: Newest-first keyset page of the append-only identity_auth_event audit trail (login/logout/admin account
        events), via vc.identity_auth_event_list. after is the last event id seen (exclusive); limit is clamped to a safe
        band by the server. Requires a valid Bearer access token whose account is an ACTIVE ADMIN.
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor (the last event id seen); omit to start from the newest.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of audit events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventListItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/admin/usage:
    get:
      operationId: getAdminUsageSummary
      summary: Per-day usage and cost summary (ADMIN only, ADMIN-OPS)
      description: Per-day aggregates (generation count, settled input/output tokens, actual cost) over vc.generation_usage
        since the days floor, via vc.admin_usage_summary. days is clamped to 1..90 by the server (default 14). Requires a
        valid Bearer access token whose account is an ACTIVE ADMIN.
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
        description: Days to cover, clamped to 1..90 (default 14).
      responses:
        '200':
          description: Per-day usage rows, newest day first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageSummaryItem'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks the ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      description: Unified error shape. NOT_FOUND_OR_FORBIDDEN never discloses whether a resource exists; every error response
        uses this envelope.
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Stable, non-sensitive human-readable explanation
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (never sensitive data)
    ErrorCode:
      type: string
      description: Stable error code catalog (specs/catalog/error-codes.yaml)
      enum:
      - AUTHENTICATION_REQUIRED
      - ACCESS_DENIED
      - NOT_FOUND_OR_FORBIDDEN
      - AGE_VERIFICATION_REQUIRED
      - MODEL_NO_ELIGIBLE_DEPLOYMENT
      - MODEL_ATTEMPT_TIMEOUT
      - MODEL_ALL_UNAVAILABLE
      - GENERATION_CANCELLED
      - GENERATION_OUTPUT_BLOCKED
      - STREAM_GAP_EXPIRED
      - STREAM_RESET_REQUIRED
      - MEMORY_CONFIRMATION_REQUIRED
      - MEMORY_FORBIDDEN_CONTENT
      - CATALOG_DRIFT_DETECTED
      - BETA_OPERATIONS_NOT_READY
      - INVALID_REQUEST
      - AUTH_RATE_LIMITED
    VersionResponse:
      type: object
      description: Service version and build identity
      required:
      - version
      properties:
        version:
          type: string
        commit:
          type: string
    Relationship:
      type: object
      description: A Companion relationship owned by exactly one user. At most one relationship per owner is active at any
        time (activeCompanionLimit=1).
      required:
      - relationshipId
      - personaRef
      properties:
        relationshipId:
          type: string
          description: Stable owner-scoped relationship identifier
        personaRef:
          type: string
          description: Reference to the Persona bound to this Companion
        active:
          type: boolean
          description: Whether this is the owner's current active Companion
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    RelationshipCreateRequest:
      type: object
      description: Body for creating a new Companion relationship.
      required:
      - personaRef
      properties:
        personaRef:
          type: string
          description: Reference to the Persona to bind as the Companion
    Generation:
      type: object
      description: A generation owned by exactly one user within a conversation. One logical request has one stable logicalGenerationId
        (INV-GEN-001); status follows the generation-states catalog; mode is the interaction mode captured at reception (CHAT-MODE).
      required:
      - generationId
      - conversationId
      - logicalGenerationId
      - status
      - mode
      properties:
        generationId:
          type: string
          description: Stable owner-scoped generation identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        logicalGenerationId:
          type: string
          description: Idempotent logical label shared by create and rejoin
        status:
          type: string
          description: Current generation-states catalog code
        mode:
          $ref: '#/components/schemas/InteractionModeCode'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    GenerationSnapshot:
      type: object
      description: 'A consistent point-in-time read of a generation: status, final assistant message id and the ordered realtime
        event stream (INV-RT-001). usage is present only after finalize settles the provider usage (USAGE-VIZ).'
      required:
      - status
      - events
      properties:
        status:
          type: string
          description: Current generation-states catalog code
        assistantMessageId:
          type: string
          description: Final assistant message id once committed, absent otherwise
        events:
          type: array
          description: Ordered realtime events up to a consistent point
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/GenerationUsage'
    GenerationUsage:
      type: object
      description: Settled provider token usage for one generation (USAGE-VIZ).
      required:
      - inputTokens
      - outputTokens
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Provider input (prompt) tokens settled at finalize
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Provider output (completion) tokens settled at finalize
    RealtimeTicketCreateRequest:
      type: object
      description: Resume cursor the caller binds a ticket to. Identifiers and counters are decimal strings (hashid encoding
        is deferred); the server parses them into 64-bit integers. Transport is not accepted here; the server fixes it to
        FETCH_SSE.
      required:
      - generationId
      - sessionId
      - origin
      - streamEpoch
      - afterSeq
      properties:
        generationId:
          type: string
          description: The generation the ticket will resume
        sessionId:
          type: string
          description: The caller's realtime session id
        origin:
          type: string
          description: The origin the SSE resume will be opened from
        streamEpoch:
          type: string
          description: The stream epoch the caller last observed
        afterSeq:
          type: string
          description: The last contiguous eventSeq the caller advanced to (0 resumes from the start)
    RealtimeTicket:
      type: object
      description: A freshly minted single-use resume ticket. The secret is returned exactly once; only its sha256 is persisted.
        Consume it within the 45s TTL when opening the SSE resume stream.
      required:
      - ticketId
      - secret
      properties:
        ticketId:
          type: string
          description: The server-assigned ticket identifier
        secret:
          type: string
          description: One-time plaintext secret (sha256-only persisted)
    RealtimeStreamEvent:
      type: object
      description: A single Server-Sent Event on the resume stream (text/event-stream). event is one of the durable realtime
        event types (chat.accepted, safety.notice, ...), snapshot for a terminal generation, or the control events stream.gap,
        stream.reset and stream.denied. id carries the eventSeq for a durable event so the client advances only the last contiguous
        sequence (INV-RT-001); the data payload is the envelope object produced by vc.resume_stream. stream.denied never discloses
        whether the cause was a ticket failure or a foreign/absent generation.
      required:
      - event
      properties:
        event:
          type: string
          description: The SSE event name (durable event type, snapshot, or stream.gap/reset/denied)
        id:
          type: string
          description: The eventSeq for a durable event (the Last-Event-ID cursor)
        data:
          type: object
          additionalProperties: true
          description: The event payload (envelope-encoded) or the snapshot object
    Message:
      type: object
      description: A chat message owned by exactly one user within a conversation.
      required:
      - messageId
      - conversationId
      - role
      - content
      properties:
        messageId:
          type: string
          description: Stable owner-scoped message identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        role:
          type: string
          description: Message role (e.g. user, assistant)
        content:
          type: string
          description: Message content
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    SendGenerationRequest:
      type: object
      description: Body for idempotently sending a Chat turn; mode selects the interaction mode for the turn (CHAT-MODE).
      required:
      - idempotencyKey
      properties:
        idempotencyKey:
          type: string
          description: Caller-supplied idempotency label; reuse to rejoin the same generation
        userContent:
          type: string
          description: The user's chat content for this turn
        mode:
          $ref: '#/components/schemas/InteractionModeCode'
    InteractionModeCode:
      type: string
      description: 'Turn-level interaction mode captured at reception (CHAT-MODE). AUTO lets the persona''s default mode rule
        (gentle-listener: LISTEN); LISTEN asks the companion to listen and reflect without unsolicited advice; DISCUSS opens
        an active exchange with questions and analysis. Rejoining the same generation via idempotencyKey keeps the first reception''s
        mode.'
      enum:
      - AUTO
      - LISTEN
      - DISCUSS
      default: AUTO
    GenerationFeedbackCreateRequest:
      type: object
      description: Body for recording user feedback on a generation (FR-CHAT-003).
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/MessageFeedbackKind'
        note:
          type: string
          maxLength: 500
          description: Optional free-text clarification (first submission wins)
    MessageFeedbackKind:
      type: string
      description: 'message-feedback-kinds catalog code (FR-CHAT-003): TOO_MECHANICAL (太机械), FORGOT_CONTEXT (忘记了), CROSSED_BOUNDARY
        (越界), FACTUAL_ERROR (事实错误), UNSAFE (不安全).'
      enum:
      - TOO_MECHANICAL
      - FORGOT_CONTEXT
      - CROSSED_BOUNDARY
      - FACTUAL_ERROR
      - UNSAFE
    GenerationFeedbackResponse:
      type: object
      description: The recorded (or already present) generation feedback row.
      required:
      - generationId
      - kind
      - createdAt
      properties:
        generationId:
          type: string
          description: Owning generation identifier
        kind:
          $ref: '#/components/schemas/MessageFeedbackKind'
        note:
          type: string
          description: Free-text clarification, absent when none was given
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    CreateConversationRequest:
      type: object
      description: Body for creating a conversation under a relationship.
      required:
      - relationshipId
      properties:
        relationshipId:
          type: string
          description: The relationship under which to open the conversation
    ConversationResponse:
      type: object
      description: The newly created conversation.
      required:
      - conversationId
      properties:
        conversationId:
          type: string
          description: Stable owner-scoped conversation identifier
    ConversationListItem:
      type: object
      description: One conversation row in the caller's list, carrying a clamped preview of the most recent message when the
        conversation has any messages.
      required:
      - conversationId
      - relationshipId
      - createdAt
      properties:
        conversationId:
          type: string
          description: Stable owner-scoped conversation identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        lastMessageRole:
          type: string
          description: Role of the most recent message (user or assistant), absent for an empty conversation
        lastMessagePreview:
          type: string
          description: Clamped preview of the most recent message, absent for an empty conversation
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        title:
          type: string
          description: User-renamed conversation title (CONV-MGMT), absent until renamed
    ConversationDeletedResponse:
      type: object
      description: Result of deleting one conversation.
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    ConversationRenamedResponse:
      type: object
      description: Result of renaming one conversation.
      required:
      - conversationId
      - title
      properties:
        conversationId:
          type: string
          description: The renamed conversation identifier
        title:
          type: string
          description: The applied title (null clears the rename)
    RenameConversationRequest:
      type: object
      description: Body for renaming a conversation (a blank title clears it).
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 200
          description: The new title (blank clears the rename)
    Memory:
      type: object
      description: A memory candidate or canonical record owned by exactly one user within a relationship. Model extraction
        only creates PENDING_CONFIRMATION candidates; ACCEPTED (canonical) is reached solely by user confirmation (INV-MEM-001/002).
        status follows the memory-candidate-statuses catalog.
      required:
      - memoryId
      - scope
      - summary
      - status
      properties:
        memoryId:
          type: string
          description: Stable owner-scoped memory identifier
        scope:
          type: string
          description: memory-scopes catalog code (SESSION or RELATIONSHIP in Alpha)
        summary:
          type: string
          description: Memory content summary
        status:
          type: string
          description: Current memory-candidate-statuses catalog code
        conversationId:
          type: string
          description: Owning conversation identifier, present for SESSION-scoped memory
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    MemoryCandidateCreateRequest:
      type: object
      description: Body for creating a memory candidate from model extraction.
      required:
      - scope
      - summary
      properties:
        scope:
          type: string
          description: memory-scopes catalog code; SESSION or RELATIONSHIP in Alpha
        summary:
          type: string
          description: Memory content summary proposed by the model
        conversationId:
          type: string
          description: Required when scope is SESSION (the binding conversation)
        evidence:
          type: array
          description: Cited source references supporting the candidate
          items:
            type: string
    MemoryUpdateRequest:
      type: object
      description: Body for editing a memory's content (status-preserving).
      required:
      - summary
      properties:
        summary:
          type: string
          description: The new memory content summary
    MemoryEvidence:
      type: object
      description: A cited source reference supporting a memory candidate.
      required:
      - evidenceId
      - sourceRef
      properties:
        evidenceId:
          type: string
          description: Stable owner-scoped evidence identifier
        sourceRef:
          type: string
          description: Cited source reference
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    LoginRequest:
      type: object
      description: Internal-account login credentials.
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          x-utf8-max-bytes: 512
          pattern: .*\S.*
          description: Internal account username; surrounding whitespace is removed and the value is lowercased
        password:
          type: string
          minLength: 1
          maxLength: 1024
          x-utf8-max-bytes: 4096
          pattern: .*\S.*
          description: Plaintext password (compared in the JVM, never stored or logged)
    AdminCreateAccountRequest:
      type: object
      description: Internal-account creation (ADMIN only). Role defaults to USER when omitted; only ADMIN or USER is accepted.
      required:
      - username
      - password
      - displayName
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          x-utf8-max-bytes: 512
          pattern: .*\S.*
          description: Internal account username (trimmed and normalized to lowercase)
        password:
          type: string
          minLength: 1
          maxLength: 1024
          x-utf8-max-bytes: 4096
          pattern: .*\S.*
          description: Plaintext password; only its BCrypt hash is stored
        role:
          type: string
          minLength: 1
          maxLength: 16
          x-utf8-max-bytes: 64
          pattern: ^(?:[Aa][Dd][Mm][Ii][Nn]|[Uu][Ss][Ee][Rr])$
          description: ADMIN or USER (default USER)
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          x-utf8-max-bytes: 1024
          pattern: .*\S.*
          description: Human-readable display name
    AuthTokenResponse:
      type: object
      description: A new access token plus its refresh session. The raw refresh token is delivered only through the HttpOnly
        vc_refresh cookie; it is never returned in this response body.
      required:
      - accessToken
      - tokenType
      - expiresInSeconds
      - accountId
      - role
      properties:
        accessToken:
          type: string
          description: JWT Bearer access token (expires after expiresInSeconds)
        tokenType:
          type: string
          description: Always Bearer
        expiresInSeconds:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        accountId:
          type: string
          description: The authenticated account id (also the owner_user_id)
        role:
          type: string
          description: ADMIN or USER
    LogoutResponse:
      type: object
      description: Idempotent logout acknowledgment.
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true; existence is never disclosed
    AccountListItem:
      type: object
      description: One internal account registry entry (never the password hash).
      required:
      - accountId
      - username
      - role
      - status
      - displayName
      properties:
        accountId:
          type: string
          description: The account id (also the owner_user_id)
        username:
          type: string
          description: Normalized (lowercase) internal username
        role:
          type: string
          description: ADMIN or USER
        status:
          type: string
          description: ACTIVE or DISABLED
        displayName:
          type: string
          description: Human-facing display name
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    DisableAccountResponse:
      type: object
      description: Result of disabling one internal account.
      required:
      - accountId
      - status
      properties:
        accountId:
          type: string
          description: The disabled account id
        status:
          type: string
          description: DISABLED
    AuditEventListItem:
      type: object
      description: One identity_auth_event audit row (ADMIN-OPS).
      required:
      - id
      - eventType
      - username
      - occurredAt
      properties:
        id:
          type: string
          description: Monotonic event id (keyset cursor)
        eventType:
          type: string
          description: LOGIN_SUCCESS / LOGIN_FAILURE / LOGOUT / ACCOUNT_CREATE / ACCOUNT_DISABLE
        accountId:
          type: string
          description: Account the event is about, absent for login failures without a resolved account
        username:
          type: string
          description: Normalized username recorded with the event
        occurredAt:
          type: string
          format: date-time
          description: Event timestamp (RFC 3339)
    UsageSummaryItem:
      type: object
      description: One day of settled usage/cost aggregates (ADMIN-OPS).
      required:
      - day
      - generations
      - inputTokens
      - outputTokens
      - cost
      properties:
        day:
          type: string
          format: date
          description: UTC calendar day
        generations:
          type: integer
          format: int64
          minimum: 0
          description: Settled generations that day
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Settled provider input tokens that day
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Settled provider output tokens that day
        cost:
          type: number
          description: Settled actual cost that day (USD unless the deployment currency differs)
    AccountResponse:
      type: object
      description: An internal account (ADMIN creation result).
      required:
      - accountId
      - username
      - role
      - status
      properties:
        accountId:
          type: string
          description: The new account id (also the owner_user_id)
        username:
          type: string
          description: Normalized (lowercase) internal username
        role:
          type: string
          description: ADMIN or USER
        status:
          type: string
          description: ACTIVE at creation
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      description: The target internal account id
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped relationship identifier
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped conversation identifier
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped generation identifier
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped memory identifier

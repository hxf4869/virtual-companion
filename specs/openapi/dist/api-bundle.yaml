openapi: 3.1.0
info:
  title: Virtual Companion API
  version: 0.1.0
  description: Contract-first HTTP API (ADR-0002). This document is the single source of truth; Java interfaces and TypeScript
    clients are generated from it and must not be hand-edited or used to back-drive the contract. The ErrorEnvelope shape
    is uniform across every error response; NOT_FOUND_OR_FORBIDDEN hides resource existence so a missing resource and a forbidden
    one are indistinguishable to the caller. Paths here remain the Java runtime surface until cutover. Go v1 KEEP/SIMPLIFY/DEFER/RETIRE
    decisions live in specs/catalog/go-v1-api-scope.yaml (ADR-0007); RETIRE operations are removed together with H5 callers
    in a later slice, not left as 410 stubs.
security:
- bearerAuth: []
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Service version and build identity
      description: Baseline contract endpoint proving the OpenAPI -> Java interface and TypeScript client generation pipeline.
        Public, unauthenticated.
      security: []
      responses:
        '200':
          description: Service version and build identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/service-mode:
    get:
      operationId: getServiceMode
      summary: Current service mode (FR-RES-005 user transparency)
      description: 'The current generation-service mode for the authenticated caller: FULL_AI (live model providers wired)
        or ZERO_LLM (no generation model — deterministic record mode only). DEGRADED_AI / SAFETY_RESTRICTED / MAINTENANCE
        exist in the service-modes catalog but are not reachable in Technical Alpha and are never reported. The mode is an
        ops fact, never role-played content — clients must show it plainly (FR-RES-005). Requires a server-verified authentication
        context.'
      responses:
        '200':
          description: The current service mode and a plain-language summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceModeStatus'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/age/state:
    get:
      operationId: getAgeState
      summary: The caller's effective age state (FR-AUTH-002)
      description: The effective adult-verification state of the caller (age-states catalog), AGE_UNKNOWN when never verified.
        The stored record carries only the result, the age band, the verification time and the provider reference — never
        an identity document. Requires a server-verified authentication context.
      responses:
        '200':
          description: The effective age state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeStateResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/age/verification:
    post:
      operationId: verifyAge
      summary: Run the simulated adult verification (FR-AUTH-002, Alpha port)
      description: Walks the age-states catalog transition table from the caller's current state to ADULT_VERIFIED through
        the vendor-agnostic AgeVerificationPort (Technical Alpha uses the deterministic simulated verifier; a real provider
        replaces the port implementation, never the callers). Every step is appended to the result history with the provider
        reference and verification time; no identity document is stored. A current state that the catalog forbids from reaching
        ADULT_VERIFIED (minor, appeal-pending, suspended) maps to INVALID_REQUEST (fail closed). Requires a server-verified
        authentication context.
      responses:
        '200':
          description: The new effective age state (ADULT_VERIFIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeStateResponse'
        '400':
          description: The current age state cannot complete adult verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/age/appeal:
    post:
      operationId: submitAgeAppeal
      summary: Submit an age-verification appeal (FR-AUTH-002)
      description: Appends an age appeal for the caller (vc.submit_age_appeal) and flips the effective age state to AGE_APPEAL_PENDING
        in the same transaction. Allowed only from a state the age-states catalog can reach AGE_APPEAL_PENDING from (ADULT_VERIFICATION_REQUIRED
        / MINOR_SUSPECTED); anything else maps to INVALID_REQUEST (fail closed). Resolution stays a human review action —
        this endpoint only records the appeal, it never rewrites a verification result. Requires a server-verified authentication
        context.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgeAppealRequest'
      responses:
        '200':
          description: The appended appeal record (status SUBMITTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeAppealRecord'
        '400':
          description: The current age state cannot submit an appeal, or an invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/age/appeals:
    get:
      operationId: listAgeAppeals
      summary: The caller's age appeals, newest first (FR-AUTH-002)
      description: Keyset-paginated age appeals owned by the caller (vc.list_age_appeals). The after cursor is the last appeal
        id seen. Appeals are append-only intake records; resolution status changes only through human review. Requires a server-verified
        authentication context.
      security:
      - bearerAuth: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor (the last appeal id seen); omit to start from the beginning.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size, clamped to a safe band by the server.
      responses:
        '200':
          description: A page of the caller's appeals, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgeAppealRecord'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/usage-health:
    get:
      operationId: getUsageHealth
      summary: Continuous-use reminder prefs and current session (FR well-being)
      description: Read-only view of the caller's continuous-use reminder settings and the current continuous-session minutes.
        Does not extend the session. reminderAfterMinutes defaults to 120 and sessionGapMinutes to 30 until the caller PUTs
        approved values. Requires a server-verified authentication context.
      responses:
        '200':
          description: Prefs and computed continuous-use status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageHealthStatus'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateUsageHealthPrefs
      summary: Replace continuous-use reminder prefs
      description: Replaces the caller's reminder interval and session-gap minutes. Only approved values are accepted (60/90/120/180
        and 15/30/45). The reminder is a system-layer fact, never role-played. Requires a server-verified authentication context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageHealthPrefsUpdate'
      responses:
        '200':
          description: Prefs after the update, plus current session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageHealthStatus'
        '400':
          description: Unapproved interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/usage-health/heartbeat:
    post:
      operationId: usageHealthHeartbeat
      summary: Record activity and recompute continuous-use reminder
      description: Extends or restarts the caller's continuous-use session and returns whether a system-layer reminder is
        due. Adjacent activity within sessionGapMinutes continues the session; a longer gap starts a new one. Requires a server-verified
        authentication context.
      responses:
        '200':
          description: Updated continuous-use status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageHealthStatus'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/usage-health/reminder:
    post:
      operationId: recordUsageReminder
      summary: Record the outcome of a continuous-use reminder
      description: Appends a reminder event (SHOWN, CONTINUED or ENDED). Used when the client displays the reminder or the
        user continues / ends. Does not role-play. Requires a server-verified authentication context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageReminderRequest'
      responses:
        '200':
          description: The updated status after recording the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageHealthStatus'
        '400':
          description: Unapproved result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/incognito-pref:
    get:
      operationId: getIncognitoPref
      summary: Default incognito flag for the next new conversation
      description: Reads whether the next newly created conversation should start incognito (FR-CHAT-005). Existing conversations
        keep their frozen flag. Missing prefs read as false. Requires a server-verified authentication context.
      responses:
        '200':
          description: Current default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncognitoPref'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateIncognitoPref
      summary: Replace the default incognito flag for the next new conversation
      description: Sets whether the next newly created conversation should start incognito. Does not flip existing conversations.
        Requires a server-verified authentication context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncognitoPrefUpdate'
      responses:
        '200':
          description: Pref after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncognitoPref'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships:
    post:
      operationId: createRelationship
      summary: Create a Companion relationship (becomes the active Companion)
      description: Creates a new relationship owned by the caller. The new relationship becomes the caller's single active
        Companion; any previously active relationship is atomically deactivated so activeCompanionLimit=1 always holds. Requires
        a server-verified authentication context; the caller's identity is the owner, never a request field. Concurrent creates
        for the same owner can never produce two active Companions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '200':
          description: The created relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listRelationships
      summary: List the caller's relationships
      description: Returns every relationship owned by the caller (the active Companion and any dormant ones). Requires a
        server-verified authentication context; other owners' relationships are never disclosed.
      responses:
        '200':
          description: Relationships owned by the caller (active and dormant)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}:
    get:
      operationId: getRelationship
      summary: Fetch a relationship owned by the caller
      description: Returns the relationship if it belongs to the caller. A foreign or absent id is indistinguishable and maps
        to NOT_FOUND_OR_FORBIDDEN so existence is never disclosed across owners.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The caller's relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: activateRelationship
      summary: Make a relationship the active Companion
      description: Promotes the target relationship to the caller's single active Companion, atomically deactivating any other
        active relationship. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now the active Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteRelationship
      summary: Delete a Companion and its relationship-domain data (FR-COMP-004)
      description: Permanently removes the caller's Companion relationship and its relationship-domain data (conversations,
        memories and reminders). In-flight GENERATION and MEMORY_EXTRACT work items for this relationship are cancelled first
        so no worker processes a dangling reference. Account-level records (consents, age state, exports, identity) are not
        touched. Deactivate remains a separate operation that only leaves the active slot. A foreign or absent id maps to
        NOT_FOUND_OR_FORBIDDEN; existence is never disclosed. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      - name: retainImportable
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, snapshot ACCEPTED RELATIONSHIP memories for later explicit import. Default false (hard clear,
          no archive).
      responses:
        '200':
          description: The Companion was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipDeletedResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateRelationshipPrefs
      summary: Update structured Companion preferences (FR-COMP-003)
      description: Replaces the caller's structured Companion preferences for one owned relationship (companion display name,
        how to address the user, reply length, initiative, humor, advice preference, reminder permission, memory share scope,
        avoid-topic codes, gender presentation and curated avatar reference). Every field is required in the body so there
        are no silent partial edits. Catalog codes are validated against companion-prefs, companion-presentation and memory-scopes;
        names are labels only (never free-form prompt text). Every companion stays an adult role and avatars may only reference
        platform-curated assets (no photo upload) (FR-COMP-002). A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN; existence
        is never disclosed. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipPrefsUpdate'
      responses:
        '200':
          description: The relationship with the updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          description: Unapproved catalog code or invalid name label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/deactivate:
    post:
      operationId: deactivateRelationship
      summary: Deactivate a relationship (zero active Companions permitted)
      description: Sets the caller's relationship inactive. Alpha permits zero active Companions. A foreign or absent id maps
        to NOT_FOUND_OR_FORBIDDEN; existence is never disclosed.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: The relationship, now inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/clearance-preview:
    get:
      operationId: previewRelationshipClearance
      summary: Preview the relationship-domain rows a reset or delete would clear (FR-COMP-004)
      description: Read-only count of conversations, memories and reminders owned by the caller under this Companion. The
        same scope is cleared by reset and by delete; reset keeps the Companion row and its structured preferences, delete
        also removes the Companion. The response is factual scope, not a retention appeal. A foreign or absent id maps to
        NOT_FOUND_OR_FORBIDDEN; existence is never disclosed. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: Counts of relationship-domain rows that would be cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipClearancePreview'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/reset:
    post:
      operationId: resetRelationship
      summary: Reset a Companion's relationship-domain data and keep the row (FR-COMP-004)
      description: Clears conversations, memories and reminders under the caller's Companion while keeping the relationship
        row and its structured preferences (including presentation fields). In-flight GENERATION and MEMORY_EXTRACT work items
        for this relationship are cancelled first. Account-level records are not touched. A later Companion created from the
        same persona template does not inherit the cleared confirmed memories. A foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN;
        existence is never disclosed. Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      - name: retainImportable
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, snapshot ACCEPTED RELATIONSHIP memories for later explicit import. Default false. Same-template
          create never inherits unless the user later calls import.
      responses:
        '200':
          description: The Companion after reset (row and preferences retained)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/memory-imports:
    get:
      operationId: listMemoryImports
      summary: Preview the importable confirmed-memory archive (FR-COMP-004)
      description: Returns the caller's latest explicit archive of ACCEPTED RELATIONSHIP memories for one persona template.
        A missing archive is an empty count, never 404. Create/reset never inherit unless the user later POSTs import. Requires
        a server-verified authentication context.
      parameters:
      - name: personaRef
        in: query
        required: true
        schema:
          type: string
        description: persona-templates catalog code
      responses:
        '200':
          description: Archive count (zero when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryImportPreview'
        '400':
          description: personaRef is not an approved template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: discardMemoryImport
      summary: Discard the importable archive without importing (FR-COMP-004)
      description: Deletes the caller's archive for one persona after the user actively chooses not to import. A missing archive
        is still 200. Requires a server-verified authentication context.
      parameters:
      - name: personaRef
        in: query
        required: true
        schema:
          type: string
        description: persona-templates catalog code
      responses:
        '200':
          description: Archive discarded or already absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryImportDiscarded'
        '400':
          description: personaRef is not an approved template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/relationships/{relationshipId}/memory-imports:
    post:
      operationId: importMemories
      summary: Import the archived confirmed memories into this Companion
      description: Copies the caller's archive for this Companion's persona into the target relationship as ACCEPTED RELATIONSHIP
        memories. The POST is the required explicit user choice (FR-COMP-004). The archive is consumed. A foreign or absent
        relationship maps to NOT_FOUND_OR_FORBIDDEN. An empty archive imports zero rows. Requires a server-verified authentication
        context.
      parameters:
      - $ref: '#/components/parameters/RelationshipId'
      responses:
        '200':
          description: Number of memories imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryImportResult'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversations:
    post:
      operationId: createConversation
      summary: Open a conversation under a relationship
      description: Creates a conversation row under one of the caller's relationships (vc.create_conversation). The caller
        identity is the owner; owner_user_id is never a request field. A foreign or absent relationship maps to NOT_FOUND_OR_FORBIDDEN;
        existence is never disclosed. Requires a server-verified authentication context.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: The newly created conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listConversations
      summary: List the caller's conversations with a last-message preview
      description: Keyset-paginated conversations owned by the caller (vc.list_conversations), optionally scoped to one relationship.
        The after cursor is the last conversation id seen; ordering is stable by (owner, id). A foreign or absent relationship
        yields no rows and never discloses existence. Requires a server-verified authentication context.
      parameters:
      - name: relationshipId
        in: query
        required: false
        schema:
          type: string
        description: Restrict to conversations under this relationship; omit for all.
      - name: after
        in: query
        required: false
        schema:
          type: string

            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/exports:
    post:
      operationId: createExport
      summary: Enqueue an asynchronous data export (FR-DATA-002)
      description: 'Creates an export request and enqueues a DATA_EXPORT work item (vc.create_export_request); the worker
        builds the JSON document asynchronously and the status endpoint reports PENDING until READY. Only one in-flight export
        per account is allowed. ADR-0006 §7.7: creating an export is a high-risk data-rights operation — the body must carry
        the caller''s CURRENT password and it is verified synchronously (fail-closed, no time window) before anything is enqueued;
        a wrong password never discloses whether it differs from an absent account (NOT_FOUND_OR_FORBIDDEN). The response
        issues the one-time download token EXACTLY ONCE (only its sha256 digest is stored, V76); save downloadUrl immediately
        — status polls never carry it again. Requires a server-verified authentication context.'
      requestBody:
        required: true
        x-raw-max-bytes: 16384
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreateRequest'
      responses:
        '200':
          description: The created export request (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequest'
        '400':
          description: An export for this account is already in flight, or the body is missing/invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Wrong current password; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED — shared per-owner export admission rejected the request
          headers:
            Retry-After:
              description: Seconds until the caller should retry
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/exports/{exportId}:

      operationId: getExportStatus
      summary: Read one owned export request status (FR-DATA-002)
      description: Status of the caller's export request via vc.get_export_request. The response never carries the download
        token or URL (the token was issued once in the create response, V76); a foreign or absent id maps to NOT_FOUND_OR_FORBIDDEN
        (existence is never disclosed). Requires a server-verified authentication context.
      parameters:
      - $ref: '#/components/parameters/ExportId'
      responses:

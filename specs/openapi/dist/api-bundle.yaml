      operationId: listAuthSessions
      summary: List live refresh sessions for the caller
      description: Returns the caller's live (unrevoked, unexpired) refresh families. Never includes token hashes, IP addresses,
        or device fingerprints. The current cookie, when present, is marked current=true.
      parameters:
      - in: cookie
        name: vc_refresh
        required: false
        schema:
          type: string
          x-utf8-max-bytes: 512
      responses:
        '200':
          description: Live sessions (empty list when none)
          content:
            application/json:
              schema:
                type: array

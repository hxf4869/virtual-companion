      description: 'Java runtime until Go cutover (ADR-0006 §3.3): derived state of the machine-local private provider plan.
        VALID means today lies inside the configured applicability window; UNKNOWN means the plan is enabled but its window
        is missing, invalid or expired — the single Owner canary continues, a P2 PROVIDER_PLAN_UNKNOWN alert fires at most
        once per day, and no zero cost or fabricated remaining allowance is ever returned. Go v1 (ADR-0007): this admin operation
        is RETIRE. Generation admission fail-closes when real billing is on but price or the conservative reservation ceiling
        is unconfigured; UI must not display fabricated cost. Caps the private configuration does not state stay null. monthCostUsd

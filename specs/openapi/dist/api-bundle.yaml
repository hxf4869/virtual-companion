      summary: Flip the memory auto-save switch (MEM-AUTO-SAVE, §7.4)
      description: 'Java runtime: flips the per-owner auto-save switch (vc.set_memory_auto_save_pref, V66). Turning it off
        stops every future auto-save immediately; already auto-saved rows stay (each is individually deletable). Go v1 (ADR-0007):
        RETIRE this operation with getMemoryAutoSave. Requires a server-verified authentication context.'

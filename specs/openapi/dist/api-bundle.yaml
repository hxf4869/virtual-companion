  /api/v1/memories/auto-save:
    get:
      operationId: getMemoryAutoSave
      summary: The caller's memory auto-save switch (MEM-AUTO-SAVE, §7.4)
      description: 'The per-owner deterministic low-sensitivity auto-save switch Java runtime: vc.get_memory_auto_save_pref
        (V66). Default true — §7.4 lists auto-save as the controlled Beta baseline, limited to the fixed low-sensitivity whitelist
        categories; the owner can turn it off at any time. Go v1 (ADR-0007): RETIRE auto-save; candidates are Owner-explicit
        only. Hide the H5 switch in the same slice. Requires a server-verified authentication context.'

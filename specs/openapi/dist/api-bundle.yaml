  /api/v1/emergency-contact:
    get:
      operationId: getEmergencyContact
      summary: The caller's live emergency contact card (EMERGENCY-CONTACT, §20.14)
      description: The caller's live (non-revoked) emergency contact via vc.get_emergency_contact (V65). An expired verification
        is lazily demoted to DRAFT on read (验证过期后重新确认). The stored value is application-layer encrypted; decryption happens
        only for this response, and every read of a stored row appends an EMERGENCY_CONTACT_VIEW audit row. A DRAFT contact
        can never be used for an actual liaison. Null body when nothing is saved. Requires a server-verified authentication
        context. The whole capability fails closed with 403 while the deployment switch is off (§20.14 未完成 评审宁可不启用).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The live contact card, or an empty body when none is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The capability is not enabled on this deployment (§20.14 review pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: saveEmergencyContact
      summary: Save or change the emergency contact (as an unverified draft)
      description: Saves (or changes) the emergency contact via vc.upsert_emergency_contact (V65). Requires the standing EMERGENCY_CONTACT
        consent grant (re-verified in SQL — a missing or withdrawn consent fails closed). The contact value is encrypted with
        the deployment AES-256-GCM key before it reaches the database. Changing a stored contact demotes it back to DRAFT
        for re-verification (联系方式变更后重新确认). Requires a server-verified authentication context.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyContactSaveRequest'
      responses:
        '200':
          description: The saved (draft) contact card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '400':
          description: Missing consent, an invalid body or an unapproved value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The capability is not enabled on this deployment (§20.14 review pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/emergency-contact/verify-start:
    post:
      operationId: startEmergencyContactVerification
      summary: Mint a one-time verification invite token (§20.14 step 2)
      description: 'Mints a one-time invite token for the contact-side acceptance via vc.start_emergency_contact_verification
        (V65; the database stores only the token''s SHA-256 digest). Only a DRAFT contact can be invited. Alpha: the token
        is returned for manual relay — no email or SMS is ever sent. Requires a server-verified authentication context.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The one-time invite token and its invite time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContactVerificationInvite'
        '400':
          description: No draft contact saved, or the contact is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The capability is not enabled on this deployment (§20.14 review pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/emergency-contact/verify-confirm:
    post:
      operationId: confirmEmergencyContactVerification
      summary: The contact-side acceptance of the invite token (§20.14 step 3)
      description: Confirms the contact-side acceptance via vc.confirm_emergency_contact_verification (V65). Binds WHEN (verifiedAt),
        HOW (the simulated channel) and WHICH consent version the contact accepted, and sets the 180-day verification validity.
        A wrong token or an invite older than 7 days fails closed without disclosing which. Requires a server-verified authentication
        context.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyContactVerifyConfirmRequest'
      responses:
        '200':
          description: The verified contact card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '400':
          description: A wrong, absent or stale invite token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The capability is not enabled on this deployment (§20.14 review pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/emergency-contact/revoke:
    post:
      operationId: revokeEmergencyContact
      summary: Withdraw the emergency contact (§20.14 撤回)
      description: Withdraws the live contact via vc.revoke_emergency_contact (V65, terminal — a new contact starts a fresh
        row and a fresh verification). Returns revoked=false when nothing live existed. Requires a server-verified authentication
        context.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Whether a live contact existed and was withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContactRevokeResult'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The capability is not enabled on this deployment (§20.14 review pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Java runtime until Go cutover: HS256 JWT access token. Go v1 (ADR-0007, Phase 5) replaces this scheme
        with an opaque HttpOnly vc_session cookie in the same H5 transport slice; JWT and opaque issuers must not coexist.'
  schemas:
    ErrorEnvelope:
      type: object
      description: Unified error shape. NOT_FOUND_OR_FORBIDDEN never discloses whether a resource exists; every error response
        uses this envelope.
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Stable, non-sensitive human-readable explanation
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (never sensitive data)
    ErrorCode:
      type: string
      description: Stable error code catalog (specs/catalog/error-codes.yaml)
      enum:
      - AUTHENTICATION_REQUIRED
      - ACCESS_DENIED
      - NOT_FOUND_OR_FORBIDDEN
      - AGE_VERIFICATION_REQUIRED
      - MODEL_NO_ELIGIBLE_DEPLOYMENT
      - MODEL_ATTEMPT_TIMEOUT
      - MODEL_ALL_UNAVAILABLE
      - GENERATION_CANCELLED
      - GENERATION_OUTPUT_BLOCKED
      - STREAM_GAP_EXPIRED
      - STREAM_RESET_REQUIRED
      - MEMORY_CONFIRMATION_REQUIRED
      - MEMORY_FORBIDDEN_CONTENT
      - CATALOG_DRIFT_DETECTED
      - BETA_OPERATIONS_NOT_READY
      - INVALID_REQUEST
      - AUTH_RATE_LIMITED
    ServiceModeStatus:
      type: object
      description: Current generation-service mode (FR-RES-005).
      required:
      - mode
      - summary
      properties:
        mode:
          type: string
          description: 'service-modes catalog code: FULL_AI (live models wired) or ZERO_LLM (deterministic record mode only).
            DEGRADED_AI / SAFETY_RESTRICTED / MAINTENANCE are catalog codes but never reported in Technical Alpha.'
          enum:
          - FULL_AI
          - ZERO_LLM
        summary:
          type: string
          description: Plain, non-role-played human-readable status line
    AgeStateResponse:
      type: object
      description: The caller's effective adult-verification state (FR-AUTH-002). Only the result, the age band, the verification
        time and the provider reference are stored — never an identity document.
      required:
      - ageState
      properties:
        ageState:
          type: string
          description: age-states catalog code (AGE_UNKNOWN when never verified)
          enum:
          - AGE_UNKNOWN
          - ADULT_SELF_DECLARED
          - ADULT_VERIFICATION_REQUIRED
          - ADULT_VERIFIED
          - MINOR_SUSPECTED
          - MINOR_VERIFIED
          - AGE_APPEAL_PENDING
          - AGE_REVERIFY_REQUIRED
          - AGE_ACCESS_SUSPENDED
        providerRef:
          type: string
          description: Verification provider reference (alpha-simulated in Technical Alpha)
        verifiedAt:
          type: string
          format: date-time
          description: Verification time (RFC 3339), present once verified
    AgeAppealRequest:
      type: object
      description: Age-appeal submission body (FR-AUTH-002). The reason is the caller's own appeal statement; it is stored
        trimmed and never rewrites a verification result.
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the caller believes the age verdict is wrong (trimmed server-side).
    AgeAppealRecord:
      type: object
      description: An age-appeal intake record (FR-AUTH-002). SUBMITTED until a human review resolves it; resolution fields
        are present only once resolved.
      required:
      - id
      - reason
      - status
      - createdAt
      properties:
        id:
          type: string
          description: The appeal id (opaque cursor for listAgeAppeals).
        reason:
          type: string
          description: The caller's appeal statement as submitted.
        status:
          type: string
          enum:
          - SUBMITTED
          - RESOLVED
          description: Intake lifecycle status; resolution is a human review action.
        resolutionNote:
          type: string
          description: Present once a human review resolved the appeal.
        createdAt:
          type: string
          format: date-time
          description: Submission time (RFC 3339).
        resolvedAt:
          type: string
          format: date-time
          description: Resolution time (RFC 3339), present once resolved.
    AgeAppealResolutionRequest:
      type: object
      required:
      - decision
      - resolutionNote
      properties:
        decision:
          type: string
          enum:
          - APPROVE_ADULT
          - DENY_MINOR
          - REVERIFY
          - SUSPEND
        resolutionNote:
          type: string
          minLength: 1
          maxLength: 240
          description: Human reviewer rationale; never identity-document or biometric content.
    AgeAppealResolutionResponse:
      type: object
      required:
      - appealId
      - decision
      - ageState
      - resolvedAt
      properties:
        appealId:
          type: string
        decision:
          type: string
          enum:
          - APPROVE_ADULT
          - DENY_MINOR
          - REVERIFY
          - SUSPEND
        ageState:
          type: string
          enum:
          - ADULT_VERIFIED
          - MINOR_VERIFIED
          - AGE_REVERIFY_REQUIRED
          - AGE_ACCESS_SUSPENDED
        resolvedAt:
          type: string
          format: date-time
    CreateReportRequest:
      type: object
      description: Report/complaint submission body (FR-DATA-001, §20.15). The message anchor is optional; when present it
        must be one of the caller's own persisted messages.
      required:
      - reason
      - note
      properties:
        messageId:
          type: string
          description: Optional anchor to one of the caller's persisted messages.
        reason:
          type: string
          enum:
          - UNSAFE_CONTENT
          - AI_IDENTITY
          - MINOR_SAFEGUARD
          - PRIVACY_OR_DATA
          - OTHER
          description: report-reasons catalog code.
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: Free-text description (stored trimmed server-side).
    ReportRecord:
      type: object
      description: A report intake record (FR-DATA-001). SUBMITTED until a human review resolves it; the message anchor becomes
        null when the anchored message is later deleted, while the intake record survives.
      required:
      - id
      - reason
      - note
      - status
      - createdAt
      properties:
        id:
          type: string
          description: The report id (opaque cursor for listReports).
        messageId:
          type: string
          nullable: true
          description: The anchored message id, null for a general report or a deleted anchor.
        reason:
          type: string
          enum:
          - UNSAFE_CONTENT
          - AI_IDENTITY
          - MINOR_SAFEGUARD
          - PRIVACY_OR_DATA
          - OTHER
          description: report-reasons catalog code.
        note:
          type: string
          description: The caller's description as submitted.
        status:
          type: string
          enum:
          - SUBMITTED
          - RESOLVED
          description: Intake lifecycle status; resolution is a human review action.
        resolutionNote:
          type: string
          description: Present once a human review resolved the report.
        createdAt:
          type: string
          format: date-time
          description: Submission time (RFC 3339).
        resolvedAt:
          type: string
          format: date-time
          description: Resolution time (RFC 3339), present once resolved.
    ConversationSummary:
      type: object
      description: The newest still-valid L2 summary of a conversation (CONV-SUMMARY, §11.18). available=false when the conversation
        has no summary yet.
      required:
      - available
      properties:
        available:
          type: boolean
          description: Whether a valid summary exists for the conversation.
        fromMessageId:
          type: string
          description: First message id covered by the summary.
        toMessageId:
          type: string
          description: Last message id covered by the summary.
        summary:
          type: string
          description: The summary text.
        modelId:
          type: string
          description: The summarizer model id.
        modelVersion:
          type: string
          description: The summarizer model version.
        promptVersion:
          type: string
          description: The approved prompt version.
        confidence:
          type: number
          format: float
          description: Confidence in [0,1].
        validated:
          type: boolean
          description: Whether the summary passed validation.
        serviceClass:
          type: string
          enum:
          - ECONOMY
          - PREMIUM
          description: The service class that produced the summary.
        previousId:
          type: string
          nullable: true
          description: The previous summary row id (version chain).
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339).
    ChatWipePreview:
      type: object
      description: Counts of what an account-wide chat wipe would clear right now (FR-DATA-003 全部聊天删除). Relationships, confirmed
        memories and account-level rows are never part of a chat wipe.
      required:
      - conversationCount
      - messageCount
      - inFlightCount
      properties:
        conversationCount:
          type: integer
          description: Conversations that would be deleted, across all relationships.
        messageCount:
          type: integer
          description: Messages that would be deleted with them.
        inFlightCount:
          type: integer
          description: In-flight GENERATION / MEMORY_EXTRACT work items that would be cancelled.
    ChatWipeResult:
      type: object
      description: What an executed account-wide chat wipe cleared.
      required:
      - conversationsDeleted
      - messagesDeleted
      - workItemsCancelled
      properties:
        conversationsDeleted:
          type: integer
          description: Conversations deleted by this wipe.
        messagesDeleted:
          type: integer
          description: Messages deleted with them.
        workItemsCancelled:
          type: integer
          description: In-flight chat work items cancelled before the delete.
    UsageHealthStatus:
      type: object
      description: Continuous-use reminder prefs and the current session (§20.7 / 21.3.3). reminderDue is a system-layer fact,
        never role-played.
      required:
      - reminderAfterMinutes
      - sessionGapMinutes
      - continuousMinutes
      - reminderDue
      properties:
        reminderAfterMinutes:
          type: integer
          description: Minutes of continuous use before a reminder (60, 90, 120 or 180)
        sessionGapMinutes:
          type: integer
          description: Idle gap that starts a new continuous session (15, 30 or 45)
        continuousMinutes:
          type: integer
          minimum: 0
          description: Minutes in the current continuous session (0 if none)
        reminderDue:
          type: boolean
          description: True when a system-layer reminder should be shown
        sessionStartedAt:
          type: string
          format: date-time
          description: Start of the current continuous session, absent when none
    UsageHealthPrefsUpdate:
      type: object
      description: Full replacement of continuous-use reminder prefs.
      required:
      - reminderAfterMinutes
      - sessionGapMinutes
      properties:
        reminderAfterMinutes:
          type: integer
          enum:
          - 60
          - 90
          - 120
          - 180
        sessionGapMinutes:
          type: integer
          enum:
          - 15
          - 30
          - 45
    IncognitoPref:
      type: object
      description: Account default for the next new conversation's incognito flag.
      required:
      - defaultIncognito
      properties:
        defaultIncognito:
          type: boolean
    IncognitoPrefUpdate:
      type: object
      description: Replacement of the next-conversation incognito default.
      required:
      - defaultIncognito
      properties:
        defaultIncognito:
          type: boolean
    UsageReminderRequest:
      type: object
      description: Outcome of a continuous-use reminder.
      required:
      - result
      properties:
        result:
          type: string
          enum:
          - SHOWN
          - CONTINUED
          - ENDED
    VersionResponse:
      type: object
      description: Service version and build identity
      required:
      - version
      properties:
        version:
          type: string
        commit:
          type: string
    Relationship:
      type: object
      description: A Companion relationship owned by exactly one user. At most one relationship per owner is active at any
        time (activeCompanionLimit=1). Structured preferences (FR-COMP-003) are always present after create (catalog defaults
        apply until the caller PATCHes them). Presentation fields (FR-COMP-002) carry the companion's gender presentation
        and a platform-curated avatar reference; every companion is fixed to an adult role, avatars come only from approved
        assets and real-person photo upload is not supported in v1.
      required:
      - relationshipId
      - personaRef
      - replyLength
      - initiative
      - humor
      - advicePref
      - remindersAllowed
      - memoryShareScope
      - avoidTopics
      - gender
      - avatarRef
      properties:
        relationshipId:
          type: string
          description: Stable owner-scoped relationship identifier
        personaRef:
          type: string
          description: Reference to the Persona bound to this Companion
        active:
          type: boolean
          description: Whether this is the owner's current active Companion
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        companionName:
          type: string
          maxLength: 32
          description: Optional Companion display name (a label, never a prompt)
        userAddressAs:
          type: string
          maxLength: 32
          description: Optional label the Companion should use for the user
        replyLength:
          type: string
          description: companion-prefs CompanionReplyLength code
        initiative:
          type: string
          description: companion-prefs CompanionInitiative code
        humor:
          type: string
          description: companion-prefs CompanionHumor code
        advicePref:
          type: string
          description: companion-prefs CompanionAdvicePref code
        remindersAllowed:
          type: boolean
          description: Whether the user allows structured reminders for this Companion
        memoryShareScope:
          type: string
          description: Alpha memory share (SESSION or RELATIONSHIP)
        avoidTopics:
          type: array
          items:
            type: string
          description: companion-prefs CompanionAvoidTopic codes the model must not raise
        gender:
          type: string
          description: companion-presentation CompanionGender code (FEMALE, MALE or NEUTRAL). Presentation only, never a behavior
            change (FR-COMP-002)
        avatarRef:
          type: string
          description: companion-presentation CompanionAvatar code referencing a platform-curated, reviewed asset (no photo
            upload in v1)
    RelationshipPrefsUpdate:
      type: object
      description: Full replacement of structured Companion preferences (FR-COMP-003). Names are optional labels; an omitted
        or empty name clears the stored label. Enum fields and avoidTopics must be approved catalog codes.
      required:
      - replyLength
      - initiative
      - humor
      - advicePref
      - remindersAllowed
      - memoryShareScope
      - avoidTopics
      - gender
      - avatarRef
      properties:
        companionName:
          type: string
          maxLength: 32
          description: Optional Companion display name (empty string clears)
        userAddressAs:
          type: string
          maxLength: 32
          description: Optional user-address label (empty string clears)
        replyLength:
          type: string
          description: companion-prefs CompanionReplyLength code
        initiative:
          type: string
          description: companion-prefs CompanionInitiative code
        humor:
          type: string
          description: companion-prefs CompanionHumor code
        advicePref:
          type: string
          description: companion-prefs CompanionAdvicePref code
        remindersAllowed:
          type: boolean
          description: Whether structured reminders are allowed
        memoryShareScope:
          type: string
          description: SESSION or RELATIONSHIP (Alpha-enabled memory-scopes)
        avoidTopics:
          type: array
          items:
            type: string
          description: companion-prefs CompanionAvoidTopic codes
        gender:
          type: string
          description: companion-presentation CompanionGender code (FEMALE, MALE or NEUTRAL). Presentation only; never a behavior
            change (FR-COMP-002)
        avatarRef:
          type: string
          description: companion-presentation CompanionAvatar code referencing a platform-curated, reviewed asset (no photo
            upload in v1)
    RelationshipClearancePreview:
      type: object
      description: Factual scope of relationship-domain rows a reset or delete would clear (FR-COMP-004). Counts cover every
        conversation, memory item and reminder under the Companion. Account-level records are outside this scope.
      required:
      - relationshipId
      - conversationCount
      - memoryCount
      - reminderCount
      properties:
        relationshipId:
          type: string
          description: Owner-scoped relationship identifier
        conversationCount:
          type: integer
          minimum: 0
          description: Conversations under this Companion
        memoryCount:
          type: integer
          minimum: 0
          description: Memory items under this Companion (all statuses)
        reminderCount:
          type: integer
          minimum: 0
          description: Reminders under this Companion
    RelationshipDeletedResponse:
      type: object
      description: Result of deleting one Companion relationship (FR-COMP-004).
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    MemoryImportPreview:
      type: object
      description: Latest explicit archive of ACCEPTED RELATIONSHIP memories for one persona (FR-COMP-004). acceptedCount
        is 0 when no archive exists.
      required:
      - personaRef
      - acceptedCount
      properties:
        personaRef:
          type: string
          description: persona-templates catalog code
        acceptedCount:
          type: integer
          minimum: 0
          description: Number of archived confirmed memories
        createdAt:
          type: string
          format: date-time
          description: Archive timestamp, absent when empty
    MemoryImportResult:
      type: object
      description: Result of an explicit memory import (FR-COMP-004).
      required:
      - importedCount
      properties:
        importedCount:
          type: integer
          minimum: 0
          description: Number of ACCEPTED memories copied into the target Companion
    MemoryImportDiscarded:
      type: object
      description: Result of discarding an import archive without importing.
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true when the archive is gone
    RelationshipCreateRequest:
      type: object
      description: Body for creating a new Companion relationship.
      required:
      - personaRef
      properties:
        personaRef:
          type: string
          description: Reference to the Persona to bind as the Companion
    Generation:
      type: object
      description: A generation owned by exactly one user within a conversation. One logical request has one stable logicalGenerationId
        (INV-GEN-001); status follows the generation-states catalog; mode is the interaction mode captured at reception (CHAT-MODE).
      required:
      - generationId
      - conversationId
      - logicalGenerationId
      - status
      - mode
      properties:
        generationId:
          type: string
          description: Stable owner-scoped generation identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        logicalGenerationId:
          type: string
          description: Idempotent logical label shared by create and rejoin
        status:
          type: string
          description: Current generation-states catalog code
        mode:
          $ref: '#/components/schemas/InteractionModeCode'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    GenerationSnapshot:
      type: object
      description: 'A consistent point-in-time read of a generation: status, final assistant message id and settled usage.
        Go v1 resumes by snapshot only — events is an empty wire-compatibility array, never a delta replay. usage is present
        only after finalize settles the provider usage (USAGE-VIZ).'
      required:
      - status
      - events
      properties:
        status:
          type: string
          description: Current generation-states catalog code
        assistantMessageId:
          type: string
          description: Final assistant message id once committed, absent otherwise
        events:
          type: array
          description: Ordered realtime events up to a consistent point
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/GenerationUsage'
    GenerationUsage:
      type: object
      description: Settled provider token usage for one generation (USAGE-VIZ).
      required:
      - inputTokens
      - outputTokens
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Provider input (prompt) tokens settled at finalize
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Provider output (completion) tokens settled at finalize
    RealtimeTicketCreateRequest:
      type: object
      description: Resume cursor the caller binds a ticket to. Identifiers and counters are decimal strings (hashid encoding
        is deferred); the server parses them into 64-bit integers. Transport is not accepted here; the server fixes it to
        FETCH_SSE.
      required:
      - generationId
      - sessionId
      - origin
      - streamEpoch
      - afterSeq
      properties:
        generationId:
          type: string
          description: The generation the ticket will resume
        sessionId:
          type: string
          description: The caller's realtime session id
        origin:
          type: string
          description: The origin the SSE resume will be opened from
        streamEpoch:
          type: string
          description: The stream epoch the caller last observed
        afterSeq:
          type: string
          description: The last contiguous eventSeq the caller advanced to (0 resumes from the start)
    RealtimeTicket:
      type: object
      description: A freshly minted single-use resume ticket. The secret is returned exactly once; only its sha256 is persisted.
        Consume it within the 45s TTL when opening the SSE resume stream.
      required:
      - ticketId
      - secret
      properties:
        ticketId:
          type: string
          description: The server-assigned ticket identifier
        secret:
          type: string
          description: One-time plaintext secret (sha256-only persisted)
    RealtimeStreamEvent:
      type: object
      description: A single Server-Sent Event on the resume stream (text/event-stream). event is one of the durable realtime
        event types (chat.accepted, safety.notice, ...), snapshot for a terminal generation, or the control events stream.gap,
        stream.reset and stream.denied. id carries the eventSeq for a durable event so the client advances only the last contiguous
        sequence (INV-RT-001); the data payload is the envelope object produced by vc.resume_stream. stream.denied never discloses
        whether the cause was a ticket failure or a foreign/absent generation.
      required:
      - event
      properties:
        event:
          type: string
          description: The SSE event name (durable event type, snapshot, or stream.gap/reset/denied)
        id:
          type: string
          description: The eventSeq for a durable event (the Last-Event-ID cursor)
        data:
          type: object
          additionalProperties: true
          description: The event payload (envelope-encoded) or the snapshot object
    Message:
      type: object
      description: A chat message owned by exactly one user within a conversation.
      required:
      - messageId
      - conversationId
      - role
      - content
      properties:
        messageId:
          type: string
          description: Stable owner-scoped message identifier
        conversationId:
          type: string
          description: Owning conversation identifier
        role:
          type: string
          description: Message role (e.g. user, assistant)
        content:
          type: string
          description: Message content
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        noMemory:
          type: boolean
          description: 'MEM-NEG (V44): true while memory extraction skips this message (不记住 marker); false by default'
    MessageNoMemoryUpdate:
      type: object
      description: Body for flipping the 不记住 marker of one message (MEM-NEG).
      required:
      - noMemory
      properties:
        noMemory:
          type: boolean
          description: true marks the message so memory extraction skips it; false restores it
    GenerationVersion:
      type: object
      description: One saved generation of a user message (GEN-VER / FR-CHAT-003).
      required:
      - generationId
      - selected
      - status
      properties:
        generationId:
          type: string
        selected:
          type: boolean
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        assistantMessageId:
          type: string
          description: Final assistant message of this version, absent until finalize
    SendGenerationRequest:
      type: object
      description: Body for idempotently sending a Chat turn; mode selects the interaction mode for the turn (CHAT-MODE).
      required:
      - idempotencyKey
      properties:
        idempotencyKey:
          type: string
          description: Caller-supplied idempotency label; reuse to rejoin the same generation
        userContent:
          type: string
          description: The user's chat content for this turn
        sourceUserMessageId:
          type: string
          description: Existing user message to regenerate against (GEN-VER / FR-CHAT-003). When set, the server does not
            insert a second user row and the new generation becomes the selected version.
        mode:
          $ref: '#/components/schemas/InteractionModeCode'
    InteractionModeCode:
      type: string
      description: 'Turn-level interaction mode captured at reception (CHAT-MODE). AUTO lets the persona''s default mode rule
        (gentle-listener: LISTEN); LISTEN asks the companion to listen and reflect without unsolicited advice; DISCUSS opens
        an active exchange with questions and analysis; CASUAL is a light everyday stance (FR-CHAT-002). Rejoining the same
        generation via idempotencyKey keeps the first reception''s mode.'
      enum:
      - AUTO
      - LISTEN
      - DISCUSS
      - CASUAL
      default: AUTO
    GenerationFeedbackCreateRequest:
      type: object
      description: Body for recording user feedback on a generation (FR-CHAT-003).
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/MessageFeedbackKind'
        note:
          type: string
          maxLength: 500
          description: Optional free-text clarification (first submission wins)
    MessageFeedbackKind:
      type: string
      description: 'message-feedback-kinds catalog code (FR-CHAT-003): TOO_MECHANICAL (太机械), FORGOT_CONTEXT (忘记了), CROSSED_BOUNDARY
        (越界), FACTUAL_ERROR (事实错误), UNSAFE (不安全).'
      enum:
      - TOO_MECHANICAL
      - FORGOT_CONTEXT
      - CROSSED_BOUNDARY
      - FACTUAL_ERROR
      - UNSAFE
    GenerationFeedbackResponse:
      type: object
      description: The recorded (or already present) generation feedback row.
      required:
      - generationId
      - kind
      - createdAt
      properties:
        generationId:
          type: string
          description: Owning generation identifier
        kind:
          $ref: '#/components/schemas/MessageFeedbackKind'
        note:
          type: string
          description: Free-text clarification, absent when none was given
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    CreateConversationRequest:
      type: object
      description: Body for creating a conversation under a relationship.
      required:
      - relationshipId
      properties:
        relationshipId:
          type: string
          description: The relationship under which to open the conversation
        incognito:
          type: boolean
          description: 'INC-MODE (FR-CHAT-005): true opens an incognito conversation — chosen knowingly at creation time.
            Incognito conversations never produce long-term memory candidates; necessary safety and statutory logs still apply.
            Defaults to false.'
          default: false
    ConversationResponse:
      type: object
      description: The newly created conversation.
      required:
      - conversationId
      properties:
        conversationId:
          type: string
          description: Stable owner-scoped conversation identifier
    ConversationListItem:
      type: object
      description: One conversation row in the caller's list, carrying a clamped preview of the most recent message when the
        conversation has any messages.
      required:
      - conversationId
      - relationshipId
      - createdAt
      properties:
        conversationId:
          type: string
          description: Stable owner-scoped conversation identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        lastMessageRole:
          type: string
          description: Role of the most recent message (user or assistant), absent for an empty conversation
        lastMessagePreview:
          type: string
          description: Clamped preview of the most recent message, absent for an empty conversation
        incognito:
          type: boolean
          description: INC-MODE (FR-CHAT-005) — true when the conversation is incognito
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        title:
          type: string
          description: User-renamed conversation title (CONV-MGMT), absent until renamed
    ConversationDeletedResponse:
      type: object
      description: Result of deleting one conversation.
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    ConversationEndedResponse:
      type: object
      description: Result of ending today's conversation.
      required:
      - ok
      - incognitoCleared
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed end
        incognitoCleared:
          type: boolean
          description: True when this was an incognito conversation and message bodies were cleared
    MessageDeletedResponse:
      type: object
      description: Result of deleting one message (FR-CHAT-004 / FR-DATA-003).
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    Reminder:
      type: object
      description: One structured user reminder (FR-NOTIFY-001).
      required:
      - reminderId
      - relationshipId
      - text
      - remindAt
      - recurrence
      - status
      - createdAt
      properties:
        reminderId:
          type: string
          description: Stable owner-scoped reminder identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        text:
          type: string
          description: The reminder text (1..500 characters)
        remindAt:
          type: string
          format: date-time
          description: UTC instant the reminder is due
        recurrence:
          type: string
          description: NONE, DAILY or WEEKLY
          enum:
          - NONE
          - DAILY
          - WEEKLY
        status:
          type: string
          description: ACTIVE or DISMISSED
          enum:
          - ACTIVE
          - DISMISSED
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (RFC 3339)
    ReminderCreateRequest:
      type: object
      description: Body for creating a structured reminder.
      required:
      - text
      - remindAt
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: The reminder text
        remindAt:
          type: string
          format: date-time
          description: UTC instant the reminder is due
        recurrence:
          type: string
          description: NONE (default), DAILY or WEEKLY
          enum:
          - NONE
          - DAILY
          - WEEKLY
          default: NONE
    ReminderUpdateRequest:
      type: object
      description: Body for updating a reminder. Every field is required — the update writes the whole record so no partial
        silent edit is possible.
      required:
      - text
      - remindAt
      - recurrence
      - status
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        remindAt:
          type: string
          format: date-time
        recurrence:
          type: string
          enum:
          - NONE
          - DAILY
          - WEEKLY
        status:
          type: string
          enum:
          - ACTIVE
          - DISMISSED
    ReminderDeletedResponse:
      type: object
      description: Result of deleting one reminder.
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed delete
    ServiceClassAssignRequest:
      type: object
      description: ADMIN-only simulated service-class assignment (ENT-SNAP).
      required:
      - accountId
      - serviceClass
      properties:
        accountId:
          type: string
          description: The target internal account id
        serviceClass:
          type: string
          description: ECONOMY or PREMIUM
          enum:
          - ECONOMY
          - PREMIUM
    ServiceClassAssignResponse:
      type: object
      description: The applied assignment.
      required:
      - accountId
      - serviceClass
      properties:
        accountId:
          type: string
          description: The target account id
        serviceClass:
          type: string
          description: The applied class (ECONOMY or PREMIUM)
    ServiceClassAssignmentItem:
      type: object
      description: One assignment registry row (ENT-SNAP).
      required:
      - accountId
      - username
      - serviceClass
      properties:
        accountId:
          type: string
          description: The account id
        username:
          type: string
          description: Normalized internal username
        serviceClass:
          type: string
          description: Assigned class (ECONOMY is the default for unassigned accounts)
        assignedAt:
          type: string
          format: date-time
          description: First assignment timestamp, absent when never assigned
        updatedAt:
          type: string
          format: date-time
          description: Last assignment timestamp, absent when never assigned
    ConsentUpsertRequest:
      type: object
      description: Body for appending a versioned consent record (FR-AUTH-003).
      required:
      - consentType
      - version
      - granted
      properties:
        consentType:
          type: string
          description: 'FR-AUTH-003 catalogue: SERVICE_TERMS, PRIVACY_POLICY, AI_CONTENT_NOTICE, THIRD_PARTY_MODEL_PROCESSING,
            SENSITIVE_DATA_PROCESSING, EMERGENCY_CONTACT, MODEL_TRAINING, PUSH_NOTIFICATION.'
          enum:
          - SERVICE_TERMS
          - PRIVACY_POLICY
          - AI_CONTENT_NOTICE
          - THIRD_PARTY_MODEL_PROCESSING
          - SENSITIVE_DATA_PROCESSING
          - EMERGENCY_CONTACT
          - MODEL_TRAINING
          - PUSH_NOTIFICATION
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: The policy document version the user saw
        granted:
          type: boolean
          description: true grants (or re-grants), false revokes
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: 'ADR-0006 §7.7: the caller''s freshly re-entered CURRENT password. REQUIRED when granted is false (revocation
            — verified synchronously server-side, fail-closed); ignored for grants (granted=true). Never logged, never echoed.'
    ConsentRecord:
      type: object
      description: One versioned consent record (FR-AUTH-003).
      required:
      - consentId
      - consentType
      - version
      - granted
      - grantedAt
      properties:
        consentId:
          type: string
          description: Stable owner-scoped record identifier
        consentType:
          type: string
          description: The FR-AUTH-003 consent type
        version:
          type: string
          description: The policy document version
        granted:
          type: boolean
          description: true while the consent is granted
        grantedAt:
          type: string
          format: date-time
          description: Grant/record timestamp (RFC 3339)
        revokedAt:
          type: string
          format: date-time
          description: Revocation timestamp, present only on a revoke record
    ExportCreateRequest:
      type: object
      description: Body for enqueueing a data export (FR-DATA-002, ADR-0006 §7.7).
      required:
      - currentPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: The caller's freshly re-entered CURRENT password; verified synchronously server-side (fail-closed)
            before the export is enqueued. Never logged, never echoed.
    ExportRequest:
      type: object
      description: One asynchronous data-export request (FR-DATA-002).
      required:
      - exportId
      - status
      - requestedAt
      properties:
        exportId:
          type: string
          description: Stable owner-scoped export request identifier
        status:
          type: string
          description: PENDING, READY, FAILED or EXPIRED
          enum:
          - PENDING
          - READY
          - FAILED
          - EXPIRED
        requestedAt:
          type: string
          format: date-time
          description: Request timestamp (RFC 3339)
        completedAt:
          type: string
          format: date-time
          description: Completion timestamp, present once READY
        expiresAt:
          type: string
          format: date-time
          description: Download expiry, present once READY
        errorMessage:
          type: string
          description: Stable failure reason, present only on FAILED
        downloadToken:
          type: string
          description: One-time download secret, present ONLY in the create response (V76); only its sha256 digest is stored
            server-side.
        downloadUrl:
          type: string
          description: Short-lived one-time download link, present ONLY in the create response; status polls never repeat
            it.
    ExportDownload:
      type: object
      description: The exported user-data document (FR-DATA-002, one-time).
      required:
      - exportId
      - generatedAt
      - expiresAt
      - aiContentNotice
      - conversations
      - memories
      - reminders
      - consents
      properties:
        exportId:
          type: string
          description: The export request identifier
        generatedAt:
          type: string
          format: date-time
          description: Document generation timestamp (RFC 3339)
        expiresAt:
          type: string
          format: date-time
          description: Document expiry timestamp (RFC 3339)
        aiContentNotice:
          type: string
          description: Plain-language notice that assistant messages are AI-generated
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ExportConversation'
        memories:
          type: array
          items:
            $ref: '#/components/schemas/ExportMemory'
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/ExportReminder'
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ExportConsent'
    ExportConversation:
      type: object
      description: One conversation with its full message history (FR-DATA-002).
      required:
      - conversationId
      - relationshipId
      - incognito
      - messages
      properties:
        conversationId:
          type: string
          description: Owner-scoped conversation identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        title:
          type: string
          description: User-renamed title, absent until renamed
        incognito:
          type: boolean
          description: Frozen creation-time incognito flag
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ExportMessage'
    ExportMessage:
      type: object
      description: One message with its AI-generated marker (FR-DATA-002).
      required:
      - messageId
      - role
      - content
      - aiGenerated
      properties:
        messageId:
          type: string
          description: Owner-scoped message identifier
        role:
          type: string
          description: user or assistant
        content:
          type: string
          description: The message text
        aiGenerated:
          type: boolean
          description: true for assistant messages (AI 生成内容标识)
    ExportMemory:
      type: object
      description: One memory record (FR-DATA-002).
      required:
      - memoryId
      - scope
      - summary
      - status
      - createdAt
      properties:
        memoryId:
          type: string
          description: Owner-scoped memory identifier
        relationshipId:
          type: string
          description: Owning relationship identifier, present for RELATIONSHIP scope
        scope:
          type: string
          description: memory-scopes catalog code
        summary:
          type: string
          description: Memory content summary
        status:
          type: string
          description: memory-candidate-statuses catalog code
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        deletedAt:
          type: string
          format: date-time
          description: Deletion timestamp, present only when deleted
    ExportReminder:
      type: object
      description: One structured reminder (FR-DATA-002).
      required:
      - reminderId
      - relationshipId
      - text
      - remindAt
      - recurrence
      - status
      properties:
        reminderId:
          type: string
          description: Owner-scoped reminder identifier
        relationshipId:
          type: string
          description: Owning relationship identifier
        text:
          type: string
          description: The reminder text
        remindAt:
          type: string
          format: date-time
          description: UTC instant the reminder is due
        recurrence:
          type: string
          description: NONE, DAILY or WEEKLY
        status:
          type: string
          description: ACTIVE or DISMISSED
    ExportConsent:
      type: object
      description: One effective consent record (FR-DATA-002).
      required:
      - consentId
      - consentType
      - version
      - granted
      - grantedAt
      properties:
        consentId:
          type: string
          description: Owner-scoped consent record identifier
        consentType:
          type: string
          description: The FR-AUTH-003 consent type
        version:
          type: string
          description: The policy document version
        granted:
          type: boolean
          description: Effective granted state
        grantedAt:
          type: string
          format: date-time
          description: Record timestamp (RFC 3339)
        revokedAt:
          type: string
          format: date-time
          description: Revocation timestamp, present only on a revoke record
    ConversationRenamedResponse:
      type: object
      description: Result of renaming one conversation.
      required:
      - conversationId
      - title
      properties:
        conversationId:
          type: string
          description: The renamed conversation identifier
        title:
          type: string
          description: The applied title (null clears the rename)
    RenameConversationRequest:
      type: object
      description: Body for renaming a conversation (a blank title clears it).
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 200
          description: The new title (blank clears the rename)
    Memory:
      type: object
      description: A memory candidate or canonical record owned by exactly one user within a relationship. Model extraction
        only creates PENDING_CONFIRMATION candidates; ACCEPTED (canonical) is reached by user confirmation (INV-MEM-001/002)
        or, since V66, the deterministic low-sensitivity auto-save rule — such rows carry autoSaved=true so the UI can mark
        them (界面明示). status follows the memory-candidate-statuses catalog.
      required:
      - memoryId
      - scope
      - summary
      - status
      - autoSaved
      properties:
        memoryId:
          type: string
          description: Stable owner-scoped memory identifier
        scope:
          type: string
          description: memory-scopes catalog code (SESSION or RELATIONSHIP in Alpha)
        summary:
          type: string
          description: Memory content summary
        status:
          type: string
          description: Current memory-candidate-statuses catalog code
        conversationId:
          type: string
          description: Owning conversation identifier, present for SESSION-scoped memory
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
        deletedAt:
          type: string
          format: date-time
          description: Soft-deletion timestamp; present only when includeDeleted is true
        autoSaved:
          type: boolean
          description: True only for rows saved by the deterministic low-sensitivity auto rule (V66).
        supersededAt:
          type: string
          format: date-time
          description: R44 (V68) explicit-supersede timestamp; present only when this canonical memory was replaced by a newer
            confirmed one (§11.11). Like deletedAt it is a tombstone column, not a status value.
        supersededByMemoryId:
          type: string
          description: The replacing memory identifier, present only with supersededAt.
        eventAt:
          type: string
          format: date-time
          description: R44 (V68 / §11.12) event anchor; present only on event memories (any event field requires eventAt).
        eventStatus:
          type: string
          description: memory-event-statuses catalog code (PLANNED / IN_PROGRESS / COMPLETED / CANCELLED / UNKNOWN).
        eventExpiresAt:
          type: string
          format: date-time
          description: Event expiry; once passed, reads lazily move the row to EXPIRED (§11.12 Event 到期, V61-style lazy sweep).
    MemoryAutoSavePref:
      type: object
      description: The per-owner memory auto-save switch state (V66, §7.4).
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether the deterministic low-sensitivity auto-save rule is active for the owner.
    MemoryAutoSaveRequest:
      type: object
      description: Body for flipping the memory auto-save switch.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: The desired switch state.
    MemoryCandidateCreateRequest:
      type: object
      description: Body for creating a memory candidate from model extraction.
      required:
      - scope
      - summary
      properties:
        scope:
          type: string
          description: memory-scopes catalog code; SESSION or RELATIONSHIP in Alpha
        summary:
          type: string
          description: Memory content summary proposed by the model
        conversationId:
          type: string
          description: Required when scope is SESSION (the binding conversation)
        evidence:
          type: array
          description: Cited source references supporting the candidate
          items:
            type: string
        eventAt:
          type: string
          format: date-time
          description: 'R44 (V68 / §11.12): optional event anchor; any event field requires it.'
        eventStatus:
          type: string
          description: memory-event-statuses catalog code; defaults to PLANNED when eventAt is set.
        eventExpiresAt:
          type: string
          format: date-time
          description: Optional event expiry; must be strictly after eventAt.
    MemoryUpdateRequest:
      type: object
      description: Body for editing a memory's content (status-preserving).
      required:
      - summary
      properties:
        summary:
          type: string
          description: The new memory content summary
        eventAt:
          type: string
          format: date-time
          description: 'R44: optional event edit; absent leaves the stored value unchanged.'
        eventStatus:
          type: string
          description: 'R44: optional memory-event-statuses code edit; absent leaves the stored value unchanged.'
        eventExpiresAt:
          type: string
          format: date-time
          description: 'R44: optional event expiry edit; absent leaves the stored value unchanged.'
    MemoryConfirmRequest:
      type: object
      description: R44 (V68 / §11.11) optional confirm body — the explicit supersede choice. The target must be an active
        canonical memory of the same relationship; a stale or invalid target is 400 INVALID_REQUEST (the id came from the
        caller's own list, so it is not an existence-hidden case). Absent body or field means a plain confirm.
      properties:
        supersedeMemoryId:
          type: string
          description: Identifier of the canonical memory this confirmation replaces.
    MemoryEvidence:
      type: object
      description: A cited source reference supporting a memory candidate.
      required:
      - evidenceId
      - sourceRef
      properties:
        evidenceId:
          type: string
          description: Stable owner-scoped evidence identifier
        sourceRef:
          type: string
          description: Cited source reference
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    LoginRequest:
      type: object
      description: Internal-account login credentials.
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          x-utf8-max-bytes: 512
          pattern: .*\S.*
          description: Internal account username; surrounding whitespace is removed and the value is lowercased
        password:
          type: string
          minLength: 1
          maxLength: 1024
          x-utf8-max-bytes: 4096
          pattern: .*\S.*
          description: Plaintext password (compared in the JVM, never stored or logged)
    AdminCreateAccountRequest:
      type: object
      description: Internal-account creation (ADMIN only). Role defaults to USER when omitted; only ADMIN or USER is accepted.
      required:
      - username
      - password
      - displayName
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          x-utf8-max-bytes: 512
          pattern: .*\S.*
          description: Internal account username (trimmed and normalized to lowercase)
        password:
          type: string
          minLength: 1
          maxLength: 1024
          x-utf8-max-bytes: 4096
          pattern: .*\S.*
          description: Plaintext password; only its BCrypt hash is stored
        role:
          type: string
          minLength: 1
          maxLength: 16
          x-utf8-max-bytes: 64
          pattern: ^(?:[Aa][Dd][Mm][Ii][Nn]|[Uu][Ss][Ee][Rr])$
          description: ADMIN or USER (default USER)
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          x-utf8-max-bytes: 1024
          pattern: .*\S.*
          description: Human-readable display name
    AuthTokenResponse:
      type: object
      description: A new access token plus its refresh session. The raw refresh token is delivered only through the HttpOnly
        vc_refresh cookie; it is never returned in this response body.
      required:
      - accessToken
      - tokenType
      - expiresInSeconds
      - accountId
      - role
      - passwordMustChange
      properties:
        accessToken:
          type: string
          description: JWT Bearer access token (expires after expiresInSeconds)
        tokenType:
          type: string
          description: Always Bearer
        expiresInSeconds:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        accountId:
          type: string
          description: The authenticated account id (also the owner_user_id)
        role:
          type: string
          description: ADMIN or USER
        passwordMustChange:
          type: boolean
          description: True when this session was issued against an admin-set temporary password. Such a session is restricted
            to the password-change flow (POST /auth/password, /auth/logout, /auth/refresh) until a new password is set; every
            other request answers 403 PASSWORD_CHANGE_REQUIRED.
    AuthSession:
      type: object
      description: One live refresh family. Never includes token hash, IP, or fingerprint.
      required:
      - id
      - familyId
      - createdAt
      - lastSeenAt
      - expiresAt
      - current
      properties:
        id:
          type: string
        familyId:
          type: string
        clientLabel:
          type: string
          description: Coarse client label such as h5; never a device fingerprint
        createdAt:
          type: string
        lastSeenAt:
          type: string
        expiresAt:
          type: string
        current:
          type: boolean
    RevokeAllSessionsResponse:
      type: object
      required:
      - revoked
      properties:
        revoked:
          type: integer
          format: int32
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    PasswordChangedResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    ReauthRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
    DeleteAccountRequest:
      type: object
      description: 'Body for deleting the caller''s own account (FR-AUTH-004, ADR-0006 §7.7): the freshly re-entered CURRENT
        password gates the destructive cascade. Never logged, never echoed.'
      required:
      - currentPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: The caller's CURRENT password, re-entered immediately before deletion
    ReauthResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    AdminResetPasswordRequest:
      type: object
      required:
      - newPassword
      properties:
        newPassword:
          type: string
    AdminResetResponse:
      type: object
      required:
      - ok
      - passwordMustChange
      properties:
        ok:
          type: boolean
        passwordMustChange:
          type: boolean
          description: Always true; the caller must change the password on next login. Never implies a message was sent.
    LogoutResponse:
      type: object
      description: Idempotent logout acknowledgment.
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true; existence is never disclosed
    AccountListItem:
      type: object
      description: One internal account registry entry (never the password hash).
      required:
      - accountId
      - username
      - role
      - status
      - displayName
      properties:
        accountId:
          type: string
          description: The account id (also the owner_user_id)
        username:
          type: string
          description: Normalized (lowercase) internal username
        role:
          type: string
          description: ADMIN or USER
        status:
          type: string
          description: ACTIVE or DISABLED
        displayName:
          type: string
          description: Human-facing display name
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339)
    DisableAccountResponse:
      type: object
      description: Result of disabling one internal account.
      required:
      - accountId
      - status
      properties:
        accountId:
          type: string
          description: The disabled account id
        status:
          type: string
          description: DISABLED
    AccountDeletedResponse:
      type: object
      description: Result of deleting the caller's own account (FR-AUTH-004).
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Always true on a confirmed deletion
    TrialGrantRequest:
      type: object
      description: ENT-TRIAL grant body; turns/days fall back to 20/14 when omitted.
      required:
      - accountId
      properties:
        accountId:
          type: string
          description: The target account id.
        turns:
          type: integer
          description: Turn budget (1..1000, default 20).
        days:
          type: integer
          description: Expiry in days (1..90, default 14).
    TrialGrantResponse:
      type: object
      description: The granted trial id.
      required:
      - grantId
      - ok
      properties:
        grantId:
          type: string
          description: The new trial grant id.
        ok:
          type: boolean
          description: Always true on success.
    QuotaReconciliation:
      type: object
      description: 'Quota-ledger reconciliation over the window (§12.26): volumes plus the three anomaly classes.'
      required:
      - settledCount
      - settledAmount
      - releasedCount
      - releasedAmount
      - settledNotCompleted
      - completedNotSettled
      - failedWithoutRelease
      properties:
        settledCount:
          type: integer
          description: SETTLE ledger rows in the window.
        settledAmount:
          type: integer
          description: Sum of settled quota amounts in the window.
        releasedCount:
          type: integer
          description: RELEASE ledger rows in the window (failure reversals).
        releasedAmount:
          type: integer
          description: Sum of released quota amounts in the window.
        settledNotCompleted:
          type: integer
          description: Anomaly — settles whose generation is not a success terminal.
        completedNotSettled:
          type: integer
          description: Anomaly — completed generations with attempts but no settle.
        failedWithoutRelease:
          type: integer
          description: Anomaly — failed terminals with attempts but no release.
    ProviderRegistryItem:
      type: object
      description: One persisted deployment registry row (V4, §12.4).
      required:
      - providerId
      - protocol
      - admissionState
      - updatedAt
      properties:
        providerId:
          type: string
          description: The deployment's stable provider id.
        protocol:
          type: string
          description: The model protocol code (model-protocols catalog).
        admissionState:
          type: string
          enum:
          - ADMITTED
          - DISABLED
          - REJECTED
          description: The durable admission state used by routing eligibility.
        updatedAt:
          type: string
          format: date-time
          description: Last registry update (RFC 3339).
    TrialStatus:
      type: object
      description: The caller's live simulated trial (FR-ENT-005 剩余额度). active=false when no trial is running.
      required:
      - active
      properties:
        active:
          type: boolean
          description: Whether a trial budget is live right now.
        remainingTurns:
          type: integer
          description: Remaining PREMIUM turns in the live trial.
        expiresAt:
          type: string
          format: date-time
          description: Trial expiry (RFC 3339).
    SurveyRequest:
      type: object
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: 被理解感评分（随机会话后,1..5）。
        conversationId:
          type: string
          nullable: true
          description: Optional conversation the score refers to.
    SurveyAccepted:
      type: object
      properties:
        accepted:
          type: boolean
          description: True when today's score was recorded; false if already scored today.
    SurveyRow:
      type: object
      required:
      - date
      - score
      properties:
        date:
          type: string
          format: date
        score:
          type: integer
          minimum: 1
          maximum: 5
    SafetyEventItem:
      type: object
      description: One deterministic safety-queue row (SAFETY-QUEUE, §20.5). Carries only the stage, the risk-levels catalog
        code and the rule id — content is never stored or returned; triage stays a human action.
      properties:
        id:
          type: string
          description: The safety event id (opaque cursor for listSafetyEvents).
        ownerId:
          type: string
          description: The owning account id.
        generationId:
          type: string
          nullable: true
          description: The generation the event refers to, when known.
        stage:
          type: string
          enum:
          - INPUT
          - INCREMENTAL
          - FINAL
          description: The pipeline stage that produced the event.
        riskLevel:
          type: string
          enum:
          - R0_NORMAL
          - R1_DISTRESS
          - R2_ELEVATED
          - R3_HIGH
          - R4_IMMINENT
          description: risk-levels catalog code of the tripped rule.
        ruleId:
          type: string
          description: The deterministic rule id that tripped.
        createdAt:
          type: string
          format: date-time
          description: Event time (RFC 3339).
        ageHours:
          type: number
          format: double
          description: 'METRICS-ALERT (V69): row age in hours (SQL-computed) so R3/R4 SLA breach is visible in the queue without
            a threshold in SQL.'
        slaBreached:
          type: boolean
          description: 'METRICS-ALERT (V69): true when an R3/R4 row is older than the deployment-configured SLA hours (virtual-companion.alerts.r3-sla-hours
            / r4-sla-hours).'
      required:
      - id
      - ownerId
      - stage
      - riskLevel
      - ruleId
      - createdAt
      - ageHours
      - slaBreached
    OpsCaseActionRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - ACK
          - ASSIGN
          - ESCALATE
          - RESOLVE
        assigneeAccountId:
          type: string
          nullable: true
        dispositionReason:
          type: string
          description: Required for RESOLVE; catalog-sized operator text, not chat body.
    RetentionLegalHoldRequest:
      type: object
      required:
      - ownerUserId
      - category
      - reasonCode
      properties:
        ownerUserId:
          type: string
        category:
          type: string
          enum:
          - ALL
          - NORMAL_CHAT
          - DELETED_CHAT
          - MEMORY_CANDIDATE
          - REJECTED_CANDIDATE
          - MODEL_CALL_DETAIL
          - SAFETY_LOG
          - EXPORT_RESIDUE
          - STREAM_FRAGMENT
        reasonCode:
          type: string
          enum:
          - LEGAL
          - REGULATORY
          - DISPUTE
          - SAFETY_REVIEW
    RetentionLegalHoldResponse:
      type: object
      required:
      - holdId
      - status
      properties:
        holdId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
    RetentionLegalHoldReleaseResponse:
      type: object
      required:
      - released
      properties:
        released:
          type: boolean
    OpsCaseNoteRequest:
      type: object
      required:
      - visibility
      - note
      properties:
        visibility:
          type: string
          enum:
          - INTERNAL
          - PUBLIC
        note:
          type: string
          maxLength: 500
          description: INTERNAL max 500; PUBLIC max 240. Empty text clears the selected note.
    OpsCaseInternalNote:
      type: object
      required:
      - note
      properties:
        note:
          type: string
          maxLength: 500
          description: Case-scoped operator note; every successful read is audited.
    OpsCase:
      type: object
      description: Frozen ops-case envelope (S0-14-A). Links one report, safety-event or age-appeal intake row. Chat body
        is never stored. slaHours is omitted until Owner sets a value — absence is not an SLA promise. Intake producers open
        cases automatically; mutation and note reads are audited.
      required:
      - id
      - kind
      - sourceOwnerId
      - sourceId
      - status
      - severity
      - openedAt
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - REPORT
          - SAFETY
          - AGE_APPEAL
        sourceOwnerId:
          type: string
        sourceId:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - ASSIGNED
          - ESCALATED
          - RESOLVED
        severity:
          type: string
          enum:
          - P0
          - P1
          - P2
        slaHours:
          type: integer
          nullable: true
          description: Owner-set hours; null means no SLA promise.
        assigneeAccountId:
          type: string
          nullable: true
        dispositionReason:
          type: string
        publicNote:
          type: string
          description: User-visible note only; internal notes are not in this schema.
        openedAt:
          type: string
          format: date-time
    BetaReportItem:
      type: object
      description: One report/complaint queue row (ADMIN-BETA, V64). Read-only; triage and disposition stay human actions
        outside the API.
      required:
      - id
      - ownerId
      - reason
      - status
      - createdAt
      properties:
        id:
          type: string
          description: The report id (opaque cursor for listBetaReports).
        ownerId:
          type: string
          description: The owning account id.
        messageId:
          type: string
          nullable: true
          description: The reported message id, when still present.
        reason:
          type: string
          enum:
          - UNSAFE_CONTENT
          - AI_IDENTITY
          - MINOR_SAFEGUARD
          - PRIVACY_OR_DATA
          - OTHER
          description: The report reason catalog code.
        note:
          type: string
          description: The optional free-text note submitted with the report.
        status:
          type: string
          enum:
          - SUBMITTED
          - RESOLVED
          description: The queue status; RESOLVED is reached by human action.
        createdAt:
          type: string
          format: date-time
          description: Submission time (RFC 3339).
    BetaAgeAppealItem:
      type: object
      description: One age-appeal queue row (ADMIN-BETA, V64). Read-only; resolution stays a human action outside the API.
      required:
      - id
      - ownerId
      - reason
      - status
      - createdAt
      properties:
        id:
          type: string
          description: The appeal id (opaque cursor for listBetaAgeAppeals).
        ownerId:
          type: string
          description: The owning account id.
        reason:
          type: string
          description: The appeal free-text reason.
        status:
          type: string
          enum:
          - SUBMITTED
          - RESOLVED
          description: The queue status; RESOLVED is reached by human action.
        createdAt:
          type: string
          format: date-time
          description: Submission time (RFC 3339).
    BetaExportTaskItem:
      type: object
      description: One async data-export task row (ADMIN-BETA, V64). Carries ids and statuses only — never payloads or download
        tokens.
      required:
      - id
      - ownerId
      - status
      - createdAt
      properties:
        id:
          type: string
          description: The export task id (opaque cursor for listBetaExportTasks).
        ownerId:
          type: string
          description: The owning account id.
        status:
          type: string
          enum:
          - PENDING
          - READY
          - FAILED
          - EXPIRED
          description: The task lifecycle status.
        createdAt:
          type: string
          format: date-time
          description: Request time (RFC 3339).
        completedAt:
          type: string
          nullable: true
          format: date-time
          description: Completion time, when the task reached a terminal state.
    BetaMemorySamplingItem:
      type: object
      description: One memory-anomaly sampling row (ADMIN-BETA, V64) — a memory that is not ACCEPTED or is soft-deleted. Content
        is limited to the memory summary itself, never message bodies.
      required:
      - id
      - ownerId
      - relationshipId
      - scope
      - summary
      - status
      - createdAt
      properties:
        id:
          type: string
          description: The memory id (opaque cursor for listBetaMemorySampling).
        ownerId:
          type: string
          description: The owning account id.
        relationshipId:
          type: string
          description: The relationship the memory belongs to.
        scope:
          type: string
          description: The memory scope code.
        summary:
          type: string
          description: The memory summary text (no message bodies).
        status:
          type: string
          description: The memory-candidate status (not ACCEPTED for sampled rows).
        deletedAt:
          type: string
          nullable: true
          format: date-time
          description: Soft-delete time, when the row is sampled as deleted.
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339).
    EmergencyContact:
      type: object
      description: The caller's live emergency contact card (§20.14, V65). A DRAFT row is only ever a draft — it can never
        be used for an actual liaison. contact is decrypted only for this response; every read is audited.
      required:
      - id
      - label
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          description: The contact row id.
        label:
          type: string
          description: The user-facing label (e.g. 妈妈).
        contact:
          type: string
          nullable: true
          description: The decrypted contact value (present on reads).
        status:
          type: string
          enum:
          - DRAFT
          - VERIFIED
          description: DRAFT is saved but unverified; VERIFIED passed the contact-side acceptance.
        consentVersion:
          type: string
          nullable: true
          description: The consent version the contact accepted, when verified.
        invitedAt:
          type: string
          nullable: true
          format: date-time
          description: The latest invite time, while a verification is pending.
        verifiedAt:
          type: string
          nullable: true
          format: date-time
          description: When the contact-side acceptance happened.
        verifiedMethod:
          type: string
          nullable: true
          description: How the acceptance happened (Alpha channel SIMULATED_EMAIL_LINK).
        verifiedExpiresAt:
          type: string
          nullable: true
          format: date-time
          description: Verification validity (180 days); expiry demotes to DRAFT.
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339).
        updatedAt:
          type: string
          format: date-time
          description: Last change time (RFC 3339).
    EmergencyContactSaveRequest:
      type: object
      description: The save body — the label and the (plaintext) contact value.
      required:
      - label
      - contact
      properties:
        label:
          type: string
          maxLength: 64
          description: The user-facing label.
        contact:
          type: string
          maxLength: 512
          description: The contact value; encrypted application-side before storage.
    EmergencyContactVerifyConfirmRequest:
      type: object
      description: The contact-side acceptance body (the invite token).
      required:
      - token
      properties:
        token:
          type: string
          maxLength: 128
          description: The one-time invite token the contact received.
    EmergencyContactVerificationInvite:
      type: object
      description: 'A one-time verification invite (§20.14 step 2). Alpha: the caller relays the token manually — nothing
        is ever sent.'
      required:
      - id
      - token
      - invitedAt
      properties:
        id:
          type: string
          description: The contact row id.
        token:
          type: string
          description: The one-time invite token (relayed manually in Alpha).
        invitedAt:
          type: string
          format: date-time
          description: The invite time (valid for 7 days).
    EmergencyContactRevokeResult:
      type: object
      description: The withdraw result.
      required:
      - revoked
      properties:
        revoked:
          type: boolean
          description: Whether a live contact existed and was withdrawn.
    AuditEventListItem:
      type: object
      description: One identity_auth_event audit row (ADMIN-OPS).
      required:
      - id
      - eventType
      - username
      - occurredAt
      properties:
        id:
          type: string
          description: Monotonic event id (keyset cursor)
        eventType:
          type: string
          description: LOGIN_SUCCESS / LOGIN_FAILURE / LOGOUT / ACCOUNT_CREATE / ACCOUNT_DISABLE
        accountId:
          type: string
          description: Account the event is about, absent for login failures without a resolved account
        username:
          type: string
          description: Normalized username recorded with the event
        occurredAt:
          type: string
          format: date-time
          description: Event timestamp (RFC 3339)
    UsageSummaryItem:
      type: object
      description: One day of settled usage/cost aggregates (ADMIN-OPS).
      required:
      - day
      - generations
      - inputTokens
      - outputTokens
      - cost
      properties:
        day:
          type: string
          format: date
          description: UTC calendar day
        generations:
          type: integer
          format: int64
          minimum: 0
          description: Settled generations that day
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Settled provider input tokens that day
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Settled provider output tokens that day
        cost:
          type: number
          description: Settled actual cost that day (USD unless the deployment currency differs)
    ProviderPlanStatusItem:
      type: object
      description: 'Java runtime until Go cutover (ADR-0006 §3.3): derived provider-plan state with operator-supplied plan
        facts carried verbatim. A cap the private configuration does not state stays null (never zero-substituted) and under
        status UNKNOWN no quota, remaining allowance or cost figure may be displayed. Go v1 (ADR-0007) retires this admin
        schema; missing price or reservation ceiling fail-closes generation instead of allowing UNKNOWN continue.'
      required:
      - status
      - reason
      properties:
        status:
          type: string
          enum:
          - VALID
          - UNKNOWN
          - DISABLED
          description: VALID while today lies inside the configured applicability window; UNKNOWN when the plan is enabled
            but the window is missing, invalid or expired; DISABLED when plan monitoring is off.
        reason:
          type: string
          enum:
          - OK
          - PLAN_DISABLED
          - WINDOW_MISSING
          - WINDOW_INVALID
          - NOT_YET_VALID
          - EXPIRED
          description: Fixed machine reason for the derived status.
        planName:
          type: string
          nullable: true
          description: Operator-supplied plan label (machine-local private config).
        validFrom:
          type: string
          format: date
          nullable: true
          description: First day the plan applies (inclusive), when stated.
        validUntil:
          type: string
          format: date
          nullable: true
          description: Last day the plan applies (inclusive), when stated.
        tokenCap:
          type: integer
          format: int64
          nullable: true
          description: Stated plan token cap; null means the plan states none (never zero).
        requestCap:
          type: integer
          format: int64
          nullable: true
          description: Stated plan request cap; null means the plan states none (never zero).
        monthCostUsd:
          type: number
          nullable: true
          description: Real settled month-to-date spend (vc.month_cost_spend), or null when no usage data is available; never
            a fabricated substitute.
    AccountResponse:
      type: object
      description: An internal account (ADMIN creation result).
      required:
      - accountId
      - username
      - role
      - status
      properties:
        accountId:
          type: string
          description: The new account id (also the owner_user_id)
        username:
          type: string
          description: Normalized (lowercase) internal username
        role:
          type: string
          description: ADMIN or USER
        status:
          type: string
          description: ACTIVE at creation
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      description: The target internal account id
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped relationship identifier
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped conversation identifier
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped generation identifier
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped message identifier
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped reminder identifier
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped memory identifier
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
      description: Owner-scoped export request identifier
    ExportToken:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: The one-time download token handed out inside the authenticated status response

      description: Returns the export document exactly once (the token is consumed on success, vc.consume_export digests the
        presented token before comparison). The token was issued once in the create response; expired, consumed, foreign or
        absent exports map to NOT_FOUND_OR_FORBIDDEN (existence is never disclosed). Requires a server-verified authentication
        context.
      parameters:
      - $ref: '#/components/parameters/ExportId'

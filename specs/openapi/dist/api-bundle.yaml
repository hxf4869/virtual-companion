  /api/v1/realtime/tickets:
    post:
      operationId: createRealtimeTicket
      summary: Mint a single-use Fetch-SSE resume ticket bound to the caller's generation
      description: 'Java runtime until Go cutover: mints a short-lived single-use resume ticket via vc.issue_realtime_ticket,
        bound to the seven-tuple (owner, generation, session, origin, transport, streamEpoch, afterSeq). Go v1 (ADR-0007):
        RETIRE this operation; SSE authenticates with the normal session cookie. The owner is taken from the server-verified
        principal and never from the body; transport is fixed to FETCH_SSE (the only Alpha realtime transport) and is also
        not accepted from the body. The server stores only sha256(secret); the plaintext secret is returned exactly once and
        must be consumed within the 45s TTL when opening the SSE resume stream. A foreign or absent generation maps to NOT_FOUND_OR_FORBIDDEN
        so existence is never disclosed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketCreateRequest'
      responses:
        '200':
          description: The minted ticket with its one-time plaintext secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
        '400':
          description: Malformed body or non-positive identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource absent or not owned by the caller; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/realtime/streams/{generationId}:
    get:
      operationId: openRealtimeStream
      summary: Open the Fetch-SSE resume stream for a generation
      description: 'Java runtime until Go cutover: opens the Fetch-SSE resume stream bound to a single-use ticket from POST
        /api/v1/realtime/tickets. vc.consume_realtime_ticket validates the secret (sha256-only stored), the boundTo seven-tuple,
        single-use and the 45s TTL, failing closed on any mismatch. Go v1 (ADR-0007, SIMPLIFY): same path, no ticket; the
        connection uses the opaque session cookie, Origin check and owner authorization, then a snapshot reconnect. Ticket
        query parameters and stream.gap/stream.reset are Java-era only. The owner is taken from the server-verified principal
        and never from the query; transport is fixed to FETCH_SSE. The Java resume cursor afterSeq is carried by the SSE-standard
        Last-Event-ID header (defaulting to 0 when absent); ticketId, secret, sessionId, origin and streamEpoch are bound
        via query parameters — the secret is a short-lived single-use credential, not the long-lived token forbidden in the
        realtime query (h5Security). Java vc.resume_stream returns one of five dispositions, mapped to SSE events: RESUMED
        and TERMINAL_SNAPSHOT emit the ordered durable events (and the committed snapshot for a terminal generation) then
        complete; GAP_EXPIRED emits stream.gap; RESET_REQUIRED emits stream.reset; a foreign or absent generation, or any
        ticket-consume failure, emits stream.denied so existence is never disclosed. A 400 INVALID_REQUEST is returned only
        before the stream opens, for a malformed or missing parameter.'
      parameters:
      - $ref: '#/components/parameters/GenerationId'
      - name: ticketId
        in: query
        required: true
        schema:
          type: string
        description: The server-assigned id of the resume ticket to consume
      - name: secret
        in: query
        required: true
        schema:
          type: string
        description: One-time plaintext ticket secret (sha256-only persisted)
      - name: sessionId
        in: query
        required: true
        schema:
          type: string
        description: The caller's realtime session id (must match the ticket binding)
      - name: origin
        in: query
        required: true
        schema:
          type: string
        description: The origin the SSE resume is opened from (must match the ticket binding)
      - name: streamEpoch
        in: query
        required: true
        schema:
          type: string
        description: The stream epoch the caller last observed (must match the ticket binding)
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
        description: The last contiguous eventSeq the caller advanced to (defaults to 0)
      responses:
        '200':
          description: The Fetch-SSE resume stream opened (text/event-stream)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeStreamEvent'
        '400':
          description: Malformed or missing parameter before the stream opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED — shared per-owner concurrent SSE lease limit reached
          headers:
            Retry-After:
              description: Seconds until the caller should retry
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

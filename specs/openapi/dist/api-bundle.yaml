      responses:
        '200':
          description: The export document (one-time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDownload'
        '401':
          description: No valid server-verified authentication context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not READY, expired, consumed, absent or not owned; existence is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with internal-account credentials
      description: 'Java runtime until Go cutover: exchanges a username and password for a JWT access token and a refresh
        session cookie. Go v1 (ADR-0007, SIMPLIFY): the same operation issues a single opaque HttpOnly vc_session cookie and
        MUST NOT return an access token in the body; POST /auth/refresh is RETIRE. Public. An unknown user and a wrong password
        are indistinguishable and both map to NOT_FOUND_OR_FORBIDDEN (existence is never disclosed); a DISABLED account maps
        to AUTHENTICATION_REQUIRED. Credentials are never logged, placed in a URL or stored. Before account lookup or password
        verification, a Technical Alpha single-instance admission guard applies route-source and source-plus-canonical-username
        rolling windows and a non-blocking shared concurrency bulkhead. Servlet remoteAddr is authoritative; forwarded client-address
        headers are ignored.'
      security: []
      requestBody:
        required: true
        x-raw-max-bytes: 16384
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'Java runtime: new access token; the refresh session is delivered only through the HttpOnly vc_refresh
            cookie. Go v1: opaque session cookie only; access token and refresh cookie are retired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Missing, unreadable or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: DISABLED account (cause is not disclosed)

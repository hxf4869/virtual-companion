schemaVersion: 1
contractId: SERVER_VERIFIED_IDENTITY_SESSION_BOUNDARY
phase: TECHNICAL_ALPHA
scope:
  kind: SECURITY_BOUNDARY
  runnableLoginIncluded: false
  concreteIdentityProviderSelected: false
normativeDependencies:
  ownership: specs/contracts/database-ownership-contract.yaml
  realtime: specs/contracts/realtime-contract.yaml
  betaGate: specs/contracts/beta-gate-contract.yaml
  costBoundary: specs/contracts/license-cost-boundary-contract.yaml
  productScope: specs/catalog/product-scope.yaml
  errors: specs/catalog/error-codes.yaml
  ageStates: specs/catalog/age-states.yaml
terminology:
  authenticationSession:
    purpose: bind a server-verified external identity to the current authenticated application context
    identifierType: authenticationSessionId
  conversation:
    purpose: contain the user-visible companion conversation
    identifierType: conversationId
  realtimeResumeTicket:
    purpose: grant one short-lived attempt to establish or resume an authorized realtime stream
    identifierType: realtimeTicketId
  memorySessionScope:
    purpose: classify temporary memory within the SESSION memory scope
    catalogCode: SESSION
    isIdentifier: false
    useAsSessionIdentifierForbidden: true
identifierRules:
  typeMustBeExplicitAtBoundaries: true
  crossTypeReuseForbidden: true
  interchangeForbidden:
    - authenticationSessionId_as_conversationId
    - authenticationSessionId_as_realtimeTicketId
    - conversationId_as_authenticationSessionId
    - conversationId_as_realtimeTicketId
    - realtimeTicketId_as_authenticationSessionId
    - realtimeTicketId_as_conversationId
    - memory_scope_SESSION_as_any_identifier
legacyFieldCompatibility:
  realtimeContractTicketBoundToSessionId:
    path: specs/contracts/realtime-contract.yaml#ticket.boundTo.sessionId
    canonicalType: authenticationSessionId
    fieldRenameRequiredNow: false
    semanticChange: false
    forbiddenInterpretations:
      - conversationId
      - memory_scope_SESSION
externalIdentityBoundary:
  minimumOpaqueKey:
    - provider
    - subject
  verificationRequiredBeforeMapping: true
  mapping:
    authority: SERVER_CONTROLLED
    output: owner_user_id
    clientOwnerClaimTrusted: false
    forbiddenAsOwnershipAuthority:
      - request_body_owner_user_id
      - query_owner_user_id
      - header_owner_user_id
      - path_owner_user_id
      - shared_fixed_production_identity
  failClosedWhen:
    - identity_provider_not_configured
    - external_identity_unverified
    - external_identity_mapping_missing
    - external_identity_mapping_conflicting
    - authentication_session_unknown
    - authentication_context_incomplete
    - required_boundary_field_missing
providerBoundary:
  matureIdentityComponentRequired: true
  projectOwnedProviderNeutralPortRequired: true
  projectOwnedAuthenticationCoreFromScratchForbidden: true
  goV1OwnerOnlyOpaqueSession:
    allowed: true
    effectiveAt: phase5_auth_generation_cutover
    supersedes: projectOwnedAuthenticationCoreFromScratchForbidden
    stillForbidden:
      - oauth_oidc_from_scratch
      - public_registration
      - jwt_and_opaque_dual_issuer
  forbiddenAsCorePrerequisite:
    - commercial_software_license
    - managed_identity_only_feature
    - enterprise_only_feature
    - paid_plugin
    - hosted_saas_only_feature
  providerMustNotOwnBusinessTruth:
    - companion_relationship
    - conversation
    - canonical_memory
authorizationAndOwnership:
  inheritsContractId: COMPOSITE_OWNERSHIP_AND_FORCE_RLS
  inheritedRequirementsMustNotBeWeakened: true
  ownerUserIdColumnRequired: true
  uniqueOwnerUserIdAndIdTargetRequired: true
  explicitApplicationOwnerPredicateRequired: true
  compositeOwnershipForeignKeysRequired: true
  rowLevelSecurityRequired: true
  forceRowLevelSecurityRequired: true
  runtimeRolesWithBypassRlsForbidden:
    - vc_api
    - vc_worker
    - vc_job_coordinator
    - vc_dispatcher
errorSemantics:
  AUTHENTICATION_REQUIRED:
    when: no valid server-verified authentication context can be established
    httpStatus: 401
  ACCESS_DENIED:
    when: an authenticated subject is not permitted to perform the requested general operation
  NOT_FOUND_OR_FORBIDDEN:
    when: a user-domain resource is absent or is not owned by the current owner
    resourceExistenceDisclosureForbidden: true
  AGE_VERIFICATION_REQUIRED:
    when: an age-gated capability requires a verified adult state and the requirement is not met
  INVALID_REQUEST:
    when: an authentication request body is missing, unreadable or violates the frozen field constraints
    httpStatus: 400
    envelope:
      code: INVALID_REQUEST
      message: The request is invalid
    rejectedFieldOrValueDisclosureForbidden: true
  AUTH_RATE_LIMITED:
    when: a login or refresh request exceeds a frozen single-instance admission window, backoff, state capacity or concurrency bulkhead
    httpStatus: 429
    envelope:
      code: AUTH_RATE_LIMITED
      message: Authentication is temporarily rate limited
    responseHeader:
      name: Retry-After
      value: POSITIVE_INTEGER_SECONDS
      calculation: CEIL_MAX_BACKOFF_OR_ROLLING_RELEASE_WITH_MINIMUM_ONE
    admissionCauseDisclosureForbidden: true
  newCatalogCodeIntroduced: true
  httpStatusMappingDefined: true
internalAccountRequestBoundary:
  usernameCanonicalization:
    operationOrder:
      - TRIM
      - LOWER_LOCALE_ROOT
    appliesTo:
      - authentication
      - login_audit
      - account_creation
      - admin_seed
      - jwt_username_claim
      - account_response
  passwordTransformationForbidden:
    - TRIM
    - CASE_FOLD
  displayNameTransformation:
    - TRIM
  role:
    optional: true
    acceptedCaseInsensitiveValues:
      - ADMIN
      - USER
    canonicalValues:
      - ADMIN
      - USER
  fieldCharacterLimits:
    username: 128
    password: 1024
    displayName: 256
    role: 16
  fieldUtf8ByteLimits:
    encoding: UTF-8
    username: 512
    password: 4096
    displayName: 1024
    role: 64
  requiredNonBlankFields:
    login:
      - username
      - password
    adminCreateAccount:
      - username
      - password
      - displayName
  aggregateRequestBodyByteLimit:
    encoding: RAW_HTTP_ENTITY_BYTES
    maxBytes: 16384
    appliesTo:
      - login
      - adminCreateAccount
    enforcement: BEFORE_JSON_MATERIALIZATION
ageCapabilityBoundary:
  betaGenerativeChatAllowedOnlyWhen: ADULT_VERIFIED
  dataRightsAllowedForEveryCatalogAgeState: true
  verificationOrAppealAllowedForEveryCatalogAgeState: true
  ageVerificationRequiredMustNotBlock:
    - data_rights
    - age_verification
    - age_appeal
h5CredentialBoundary:
  goV1:
    effectiveAt: phase5_auth_generation_cutover
    sessionCookie:
      name: vc_session
      attributes:
        - HttpOnly
        - Secure
        - SameSite
      sameSite: Lax
      refreshEndpoint: RETIRE
      accessTokenInResponseBodyForbidden: true
  preferredSessionCookie:
    name: vc_refresh
    attributes:
      - HttpOnly
      - Secure
      - SameSite
    exactSameSiteValueDeferred: false
    sameSite: Lax
    path: /api/v1/auth
    secureDefault: true
    secureConfigurableForLocalDevelopment: true
    requiredFor:
      - refresh
      - logout
    requestBodyForbiddenFor:
      - refresh
      - logout
    valueEncoding: UTF-8
    maxValueBytes: 512
    overLimitError: AUTHENTICATION_REQUIRED
    enforcement: BEFORE_REFRESH_TOKEN_HASH_OR_SESSION_JDBC
    refreshTokenInResponseBodyForbidden: true
  csrfCookie:
    name: vc_csrf
    httpOnly: false
    mechanism: DOUBLE_SUBMIT
    requiredHeader: X-CSRF-Token
    rotatesWithSession: true
  csrfRequiredForStateChanges: true
  originValidationRequired: true
  bearerOnlyWithoutSessionCookieNotCsrfBound: true
  longLivedTokenForbiddenLocations:
    - localStorage
    - url
    - query
    - realtime_connection_parameters
authAbuseAdmissionBoundary:
  deliveryScope: TECHNICAL_ALPHA_SINGLE_INSTANCE
  persistence: PROCESS_LOCAL_EPHEMERAL
  horizontalScaleProtectionProvided: false
  source:
    authority: SERVLET_REMOTE_ADDR
    forwardedHeadersTrusted: false
    ignoredHeaders:
      - Forwarded
      - X-Forwarded-For
      - X-Real-IP
  chainOrder:
    - COOKIE_CSRF_GUARD
    - ROUTE_SOURCE_ADMISSION
    - RAW_BODY_BYTE_LIMIT
    - MVC_INPUT_VALIDATION
    - INPUT_KEY_ADMISSION
    - AUTH_SERVICE
  routeMatching:
    method: POST_EXACT
    canonicalRawPaths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
    mvcEquivalentEncodedOrMatrixAlias: FIXED_INVALID_REQUEST_BEFORE_BODY
    unrelatedPathsRemainUnchanged: true
  containerLevelDuplicateFilterRegistrationForbidden: true
  routeSourceWindows:
    algorithm: ROLLING_WINDOW
    login:
      maxAdmissions: 20
      windowSeconds: 60
      stateCapacity: 4096
    refresh:
      maxAdmissions: 10
      windowSeconds: 60
      stateCapacity: 4096
    routeStateIsolated: true
  inputKeyWindows:
    algorithm: ROLLING_WINDOW
    login:
      key: HMAC_SOURCE_AND_CANONICAL_USERNAME
      maxAdmissions: 5
      windowSeconds: 900
      stateCapacity: 8192
    refresh:
      key: HMAC_RAW_REFRESH_TOKEN
      maxAdmissions: 5
      windowSeconds: 60
      stateCapacity: 8192
    progressiveAdmissionBackoffSeconds:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 60
    streakIncrementsOn: ADMITTED_INPUT_KEY_REQUEST
    streakExpiresAfterIdleSeconds: 1800
    successOrFailureResetsState: false
  concurrencyBulkhead:
    scope: LOGIN_AND_REFRESH_COMBINED
    maximumInFlight: 4
    acquisition: NON_BLOCKING_TRY_ACQUIRE
    leaseHeldThroughDownstreamCompletion: true
    rejectionRetryAfterSeconds: 1
  statePrivacy:
    digest: HMAC_SHA_256
    key: RANDOM_256_BIT_PROCESS_EPHEMERAL
    domainSeparationRequired: true
    rawSourceUsernameOrTokenStored: false
    activeStateEvictionForbidden: true
    capacityRejectionRetryAfterSeconds: 60
    expiredStateMayBeReclaimed: true
  timing:
    clockInjectable: true
    observedTimeMonotonicNondecreasing: true
    retryAfterRoundsUpToPositiveIntegerSeconds: true
    rejectingBucketMutatesOwnQuotaOrBackoff: false
    alreadyAdmittedUpstreamSourceMayRemainConsumed: true
  rejectionBeforeExpensiveOperations:
    - PASSWORD_BCRYPT
    - ACCOUNT_REPOSITORY_AUTHENTICATION
    - SESSION_JDBC
    - REFRESH_SUCCESSOR_GENERATION
    - PER_ATTEMPT_FAILURE_AUDIT
  residualsNotClosed:
    - MULTI_INSTANCE_SHARED_ATOMIC_LIMITING
    - RESTART_PERSISTENCE
    - TRUSTED_PROXY_TOPOLOGY
    - ACCOUNT_ONLY_CROSS_SOURCE_CREDENTIAL_STUFFING
    - PERMANENT_ACCOUNT_LOCKOUT
    - PASSWORD_POLICY
    - AUDIT_AGGREGATION_AND_RETENTION
realtimeResumeTicketBoundary:
  ttlSeconds: 45
  singleUse: true
  serverStoresHashOnly: true
  boundTo:
    - ownerUserId
    - authenticationSessionId
    - generationId
    - origin
    - transport
    - streamEpoch
    - afterSeq
  mayContainLongLivedCredential: false
  authorizationArtifactOnly: true
  ttlDoesNotDefineAuthenticationSessionTtl: true
privacyBoundary:
  dataClasses:
    - external_identity
    - account
    - age
    - authentication_session
  forbiddenDestinations:
    - general_application_log
    - url
    - model_context
  minimizationRequired: true
capabilityGates:
  publicRegistrationEnabled: false
  realUserBeta: BLOCKED
  realPayment: FORBIDDEN
  betaGenerationEnabledByDefault: false
  alphaTransport:
    - FETCH_SSE
  websocketEnabled: false
failureRules:
  identityProviderUnavailableDisposition: FAIL_CLOSED
  forbiddenFallbacks:
    - trust_client_owner_user_id
    - trust_development_identity_header
    - use_shared_fixed_production_identity
    - infer_authenticated_state_from_missing_fields
compatibility:
  currentProducer: NONE
  currentConsumer: NONE
  migrationWindowRequired: false
  firstImplementationMustConformBeforeExposure: true
integrationBoundary:
  futureProducer: mature_identity_provider_adapter
  futureConsumers:
    - api_authentication_entrypoint
    - owner_user_id_resolver
    - user_domain_query_boundary
    - realtime_ticket_issuer
    - security_audit_boundary
deferredOwnerDecisions:
  - identity_provider_and_login_channels
  - technical_alpha_account_provisioning_and_first_login_mapping
  - authentication_session_ttl_refresh_revocation_and_device_policy
  - account_and_authentication_session_state_catalogs
  - external_identity_bind_merge_unbind_and_delete_synchronization
  - remaining_public_api_paths_http_statuses_and_error_envelope
  - age_verification_provider_and_appeal_flow
resolvedOwnerDecisions:
  - decisionId: cookie_or_bearer_architecture_and_cookie_parameters
    resolvedAt: "2026-08-08"
    approvedBy: repository-owner
    source: TASK-0102
    resolution: >-
      HttpOnly refresh cookie (vc_refresh: HttpOnly + Secure 默认 true +
      SameSite=Lax + Path=/api/v1/auth) + CSRF double-submit（vc_csrf 非
      HttpOnly cookie + X-CSRF-Token header，随登录/刷新轮换）+ Origin
      allowlist 校验（virtual-companion.auth.cors-allowed-origins）。refresh
      token 永不进入响应体或脚本可读存储；Bearer-only 无会话 cookie 的请求
      不受 CSRF 约束（Origin 校验保持）；登录（尚无会话 cookie）不强制 CSRF
      token。对应实现：AuthController cookie 下发 + CookieCsrfGuardFilter。
  - decisionId: h5_api_same_origin_deploy
    resolvedAt: "2026-08-23"
    approvedBy: repository-owner
    source: S0-06
    resolution: >-
      Technical Alpha/受控 Beta 只支持同源反代（Caddy 或 Vite /api 代理）。
      Origin 白名单必须是精确 http(s) origin，禁止通配符；Compose 注入
      https://$VC_DOMAIN。CORS 方法含 PUT；allowCredentials 保持 false。
      不得关闭 CSRF、放开任意 origin 或把 token 写入 localStorage。同站不同源
      与跨站不是受支持模型。
  - decisionId: public_api_paths_http_statuses_and_error_envelope
    resolvedAt: "2026-08-08"
    approvedBy: repository-owner
    source: TASK-0102
    resolution: >-
      仅解析公开路径部分：GET /api/internal/baseline 为公开端点（permitAll，
      P1-08）；其余 public 路径、http statuses 与 error envelope 语义仍
      deferred（P2-04 范围）。
  - decisionId: auth_invalid_request_http_status_and_error_envelope
    resolvedAt: "2026-08-09"
    approvedBy: repository-owner
    source: TASK-0112
    resolution: >-
      POST /api/v1/auth/login 与 POST /api/v1/auth/admin/accounts 的缺失、JSON null、不可读 JSON、
      空白必填字段、超过冻结字符上限或 UTF-8 字节上限的字段，以及超过冻结原始请求体上限的请求，
      统一返回 HTTP 400；ErrorEnvelope 固定为
      INVALID_REQUEST / The request is invalid，不返回字段名、拒绝值或解析细节。既有凭据错误、
      disabled、非 ADMIN 与重复 username 的不泄密映射保持不变。
  - decisionId: auth_cookie_only_and_byte_boundaries
    resolvedAt: "2026-08-09"
    approvedBy: repository-owner
    source: TASK-0121
    resolution: >-
      login 与 adminCreateAccount 的原始 HTTP entity body 上限为 16384 bytes，必须在 JSON
      物化前按实际读取 bytes 拒绝；username/password/displayName/role 的 UTF-8 上限分别为
      512/4096/1024/64 bytes，保留既有字符上限。refresh/logout 只接受 required HttpOnly
      vc_refresh cookie，不接受 request body；cookie 值 UTF-8 上限为 512 bytes，超限与缺失
      均返回 HTTP 401 AUTHENTICATION_REQUIRED；login/refresh 响应体不含 refreshToken，原始
      token 只通过 vc_refresh cookie 轮换或清除。
  - decisionId: auth_single_instance_abuse_admission
    resolvedAt: "2026-08-09"
    approvedBy: repository-owner
    source: TASK-0122
    resolution: >-
      Technical Alpha 只使用 servlet remoteAddr 和进程级 ephemeral HMAC digest 执行单实例
      rolling-window 准入；login 为 source 20/60s 与 source+canonical username 5/900s，refresh
      为 source 10/60s 与 token 5/60s，并使用 1/2/4/8/16/60s 非阻塞退避、4-slot 全局
      tryAcquire 舱壁、有界过期状态与固定 429 AUTH_RATE_LIMITED/Retry-After。该边界
      忽略转发头，不声称提供跨实例、跨 source account-only、永久锁定、密码策略或
      审计保留保障。
rules:
  - deferred decisions have no implied default
  - public registration, real-user beta and real payment remain closed
  - an identity implementation requires a separate READY task

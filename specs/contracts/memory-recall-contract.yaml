schemaVersion: 1
contractId: MEMORY_RECALL_GO_V1
applicability:
  effectiveAt: go_memory_writer_recall_cutover
canonicalInvariants:
  - canonical memory belongs to one owner and one relationship
  - a manually created candidate is not a Prompt fact until the owner explicitly confirms it
  - auto-save is performed only by the MEMORY_EXTRACT job and lands directly as ACCEPTED with auto_saved=true; it never enters the candidate confirmation flow
  - auto-save is consent-gated by the per-owner pref (V66, default on) and honours the incognito and no_memory boundaries
  - one turn yields at most 3 auto-saved memories, deduplicated by idempotency key
  - an auto-saved memory stays owner-editable and owner-deletable; a deleted one must not resurrect
  - auto-saved memories are stored with RELATIONSHIP scope so they recall into later conversations of the same relationship; the relationship binding keeps them isolated across relationships and accounts
  - incognito and no-memory messages are not long-term extraction sources
  - delete, supersede and consent withdrawal make the item immediately unrecallable
  - restore-before-read must honour tombstones
  - provider or agent sessions are not a second canonical memory
storage:
  decision: docs/decisions/0009-v2-sillytavern-host-direction.md
  fieldEncryption: false
  representation: plaintext_or_json
  plaintextFields:
    - memory_item.summary
    - memory_item.temporal_cipher
    - conversation_summary.summary
    - st_message_source.content_cipher
    - memory_extract_attempt.output_payload
    - memory_import_bundle.payload[*].summary
  columnNaming: legacy_cipher_suffix_does_not_imply_encryption
  coverage: all_rows_including_invalid_suppressed_deleted_and_historical_versions
  accessProtection: owner_binding_and_force_rls_unchanged
  atRestProtection: directory_permissions_disk_or_volume_protection_and_encrypted_backups
  unchangedEncryption:
    - totp_secrets
    - provider_credentials
    - non_memory_message_fields_including_legacy_go_message_bodies
    - export_object_envelopes
    - backups
  upgrade:
    transaction: schema_change_paged_conversion_and_schema_history_are_atomic
    reader: injected_field_cipher_decrypt_with_current_and_previous_keys
    input: mixed_plaintext_enc1_and_enc2_in_nonempty_databases
    failure: rollback_entire_version_on_wrong_key_unknown_key_or_malformed_envelope
    preserve: ids_timestamps_states_suppression_and_replacement_relationships
    temporalValues: preserve_snapshot_without_reinterpretation_or_requeue
    deletionBarrier: complete_existing_account_deletion_before_upgrade_never_disable_barrier
    cutover: stop_old_writers_and_require_completed_migration_before_runtime_serves
    runtime: direct_plaintext_or_json_reads_and_writes_without_cipher_detection_fallback
goV1:
  autoSave: true
  modelAutoExtractionJob: true
  autoSavePrefDefaultOn: true
  autoSaveMaxItemsPerTurn: 3
  autoSavedMarking: auto_saved_true
  autoSaveIdempotency: idempotency_key
  productionSemanticRecallClaimed: false
  productionRecall:
    - EXPLICIT_CANDIDATE
    - KEYWORD
    - SOURCE
    - RECENCY
  ollamaEmbedding: SHADOW_EVAL_ONLY
  semanticRecallFailureDisposition: degrade_to_no_semantic_memory_chat_continues

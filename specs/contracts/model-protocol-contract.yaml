schemaVersion: 1
contractId: MODEL_PROTOCOL_ADAPTERS
internalPort: ModelProtocolAdapter
protocolFamilies:
  OPENAI_CHAT_COMPLETIONS:
    endpointShape: /v1/chat/completions
    alphaAllowed: true
  ANTHROPIC_MESSAGES:
    endpointShape: /v1/messages
    alphaAllowed: false
    deferred: true
  OPENAI_RESPONSES:
    endpointShape: /v1/responses
    alphaAllowed: false
    spikeOnly: true
alphaLiveRequirement: exactly one approved live deployment using OPENAI_CHAT_COMPLETIONS
offlineContractRequirement: the OpenAI Chat Completions adapter passes local mock-server tests
javaRuntimeUntilCutover:
  anthropicMessagesAdapter: retained_for_java_offline_tests_not_go_v1_live
goV1:
  liveProtocols:
    - OPENAI_CHAT_COMPLETIONS
  deferredProtocols:
    - ANTHROPIC_MESSAGES
  testOnlyProtocols:
    - FAKE
    - FAILURE
    - ZERO_LLM
  providerDisable:
    ordinaryRetryableFailure: per_request_only
    durableDisableAllowedReasons:
      - safety_leak
      - credential_explicitly_invalid
      - owner_operation
    consecutiveFailureDurableCircuit: RETIRE
javaRuntimeUntilCutoverProviderDisable:
  consecutiveFailureDurableCircuit: ADR-0006_section_3_4

requiredContractTests:
  - non_stream_success
  - sse_stream_success
  - unicode_and_long_text
  - usage_mapping
  - finish_or_stop_reason_mapping
  - 429_mapping
  - 5xx_mapping
  - connect_timeout
  - first_token_timeout
  - total_timeout
  - malformed_event
  - cancellation
  - late_token_fence
  - structured_output_when_claimed
businessLayerForbidden:
  - provider_sdk_type
  - provider_model_name
  - provider_api_key
  - provider_specific_error_class
  - provider_session_as_memory_truth

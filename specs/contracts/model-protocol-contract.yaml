schemaVersion: 1
contractId: MODEL_PROTOCOL_ADAPTERS
internalPort: ModelProtocolAdapter
protocolFamilies:
  OPENAI_CHAT_COMPLETIONS:
    endpointShape: /v1/chat/completions
    alphaAllowed: true
  ANTHROPIC_MESSAGES:
    endpointShape: /v1/messages
    alphaAllowed: true
  OPENAI_RESPONSES:
    endpointShape: /v1/responses
    alphaAllowed: true
alphaLiveRequirement: at least one admin-enabled provider/model route; deterministic global priority order; at most one safe fallback
offlineContractRequirement: every live protocol adapter passes local mock-server tests
javaRuntimeUntilCutover:
  anthropicMessagesAdapter: java_era_offline_only_go_v1_uses_independent_adapter
goV1:
  liveProtocols:
    - OPENAI_CHAT_COMPLETIONS
    - OPENAI_RESPONSES
    - ANTHROPIC_MESSAGES
  testOnlyProtocols:
    - FAKE
    - FAILURE
    - ZERO_LLM
  providerDisable:
    ordinaryRetryableFailure: per_request_only
    durableDisableAllowedReasons:
      - safety_leak
      - credential_explicitly_invalid
      - owner_operation
    consecutiveFailureDurableCircuit: RETIRE
  routing:
    scope: GLOBAL_CHAT_CHAIN
    selection: priority_ascending
    maxAttempts: 2
    fallbackAllowedOnlyWhen:
      - no_public_delta
      - connect_failure_delivery_not_sent
    forbidden:
      - weighted_random
      - session_affinity
      - automatic_circuit_breaker
      - health_score_routing
javaRuntimeUntilCutoverProviderDisable:
  consecutiveFailureDurableCircuit: ADR-0006_section_3_4

requiredContractTests:
  - non_stream_success
  - sse_stream_success
  - unicode_and_long_text
  - usage_mapping
  - finish_or_stop_reason_mapping
  - 429_mapping
  - 5xx_mapping
  - connect_timeout
  - first_token_timeout
  - total_timeout
  - malformed_event
  - cancellation
  - late_token_fence
  - structured_output_when_claimed
businessLayerForbidden:
  - provider_sdk_type
  - provider_model_name
  - provider_api_key
  - provider_specific_error_class
  - provider_session_as_memory_truth

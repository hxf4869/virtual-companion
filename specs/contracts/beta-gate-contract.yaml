schemaVersion: 1
contractId: CONTROLLED_BETA_HARD_GATE
# 时间字段机器真源是 specs/catalog/product-scope.yaml betaGate（§24.7 北京时间
# 10:00–22:00，2026-08-19 Owner 决策；原 20:30–00:00 为早期草案）。本契约必须
# 与其一致；scripts/checks/catalog_tool.py validate 强制两者同步（S0-02）。
generationWindow:
  timezone: Asia/Shanghai
  opensAt: '10:00'
  longConversationCutoff: '21:45'
  newGenerationCutoff: '22:00'
  inFlightGraceUntil: '22:10'
dutyWindow:
  startsAt: '09:45'
  endsAt: '22:30'
requiredBeforeEnable:
  - personal_information_protection_impact_assessment_completed
  - internal_product_ethics_review_completed
  - external_ethics_procedure_applicability_decision_recorded
  - age_state_is_ADULT_VERIFIED
  - named_safety_owner_and_backup_confirmed
  - dated_duty_roster_complete
  - risk_classifier_fail_closed_tests_pass
  - complaint_and_appeal_contact_active
  - high_risk_handoff_runbook_tested
hardDefault: beta_generation_enabled_false
highRiskAtClose: close_case_or_named_handoff; never abandon
emergencyContact:
  requiredForParticipation: false
  automaticContactAllowed: false
  missingOrInvalidFallback: show_real_world_help_options_and_follow_manual_runbook

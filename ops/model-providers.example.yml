# model-providers.example.yml — 真实 provider 部署配置模板（PROV-TMPL）
#
# 用法：复制本文件为部署环境的 application-provider.yml（或注入等效环境变量），
# 按部署实际值填写每个字段。本文件只包含结构与占位符，绝不包含真实凭据
# （红线：真实 provider 凭据只允许部署配置注入，不得进入仓库）。
#
# 凭据注入约定（ProviderSecretReader，二选一）：
#   - 环境变量 VC_MODEL_SECRET_<NAME>：NAME 为 secret 名大写、'-' 替换为 '_'，
#     例如 credential-secret: openai-bearer-token -> VC_MODEL_SECRET_OPENAI_BEARER_TOKEN
#   - Docker secret 文件 <secret-root>/<name>：secret-root 默认 /run/secrets，
#     文件内容即 bearer token / API key，必须为常规文件
# credential-secret 字段只写 secret 名，永远不写值。
#
# 主开关 virtual-companion.model-providers.enabled=false 时（默认），runtime 不装配
# 任何 live provider，外部 attempt 在路由层 fail-closed（无 eligible deployment），
# 且不读取任何凭据。启用真实 provider 不改变发布门禁：真实用户 Beta 前置条件
# （PIA、成年验证、值班、安全演练等）未满足前不得对真实用户开放。

virtual-companion:
  model-providers:
    enabled: false
    secret-root: /run/secrets
    deployments:
      - provider-id: openai-standard
        protocol: OPENAI_CHAT_COMPLETIONS
        supplier-name: OpenAI
        model: gpt-4.1-mini
        # 必须填写供应商明确提供的不可变 revision；不得复制可变 model alias。
        model-revision: replace-with-openai-immutable-supplier-revision
        # 运营方每次变更该 deployment 配置时自增/换版。
        config-version: openai-standard-v1
        endpoint: https://api.openai.com/v1/chat/completions
        credential-secret: openai-bearer-token
              # MODEL-ROLL（§12.14）：灰度顺序 = deployments 列表序（排后承接
      # failover 小流量）;回滚 = enabled 翻 false。流程见
      # docs/engineering/model-rollout.md。
# SAMPLE-CFG（可选）：部署级采样默认。max-tokens 缺省用 OpenAI 输出上限；
        # temperature 缺省 1.0，合法区间 0..2。
        max-tokens: 1024
        temperature: 0.8
        enabled: false
      - provider-id: anthropic-standard
        protocol: ANTHROPIC_MESSAGES
        supplier-name: Anthropic
        model: claude-sonnet-4-5
        # 必须填写供应商明确提供的不可变 revision；不得复制可变 model alias。
        model-revision: replace-with-anthropic-immutable-supplier-revision
        # 运营方每次变更该 deployment 配置时自增/换版。
        config-version: anthropic-standard-v1
        endpoint: https://api.anthropic.com/v1/messages
        credential-secret: anthropic-api-key
        anthropic-version: '2023-06-01'
        max-tokens: 1024
        # SAMPLE-CFG（可选）：temperature 缺省 1.0，合法区间 0..1。
        temperature: 0.7
        enabled: false

  # DOGFOOD-05（ADR-0006 §3.3）：动态套餐私有配置。套餐名称/限额/适用期只放
  # 仓库外的本机私有运行配置（或 VC_PROVIDER_PLAN_* 环境变量），不得写死在
  # 代码、Catalog 或 UI。enabled=false（默认）→ 状态 DISABLED；enabled=true 但
  # 适用期缺失/非法/已过期 → 状态 UNKNOWN：允许唯一 Owner canary 继续，但每自然日
  # 至多一条 P2 PROVIDER_PLAN_UNKNOWN 告警，且任何界面不得显示 0 成本或虚构剩余
  # 额度。cap 未配置时保持缺失（null），绝不当作 0。
  provider-plan:
    enabled: false
    plan-name: replace-with-private-plan-label
    # 适用期闭区间（含两端）；缺失或 valid-from > valid-until 均判 UNKNOWN。
    valid-from: 2026-01-01
    valid-until: 2026-01-31
    # 套餐未声明则整键省略（或留空），不要写 0。
    token-cap: 1000000
    request-cap: 500

  # S0-07: real moderation is an independent default-off SafetyClassifierPort.
  # The API key is never written here; inject only VC_MODERATION_API_KEY from a
  # deployment Secret/private environment. provider-ref/model-version are audit
  # labels and must describe the selected supplier; no supplier is implied.
  # DOGFOOD-STABILIZATION-02: mode=chat-completions is the only accepted mode
  # this round (openai-moderations is refused at wiring until its client
  # carries equal egress/DNS/response-size protections).
  moderation:
    enabled: false
    mode: chat-completions
    provider-ref: replace-with-approved-moderation-provider
    base-url: https://moderation.example-vendor.invalid/v1
    model: replace-with-approved-moderation-model
    model-version: replace-with-immutable-moderation-revision

  # S0-09: external embeddings are owner-consent gated and fixed to the
  # registered 64-dimensional pgvector space. API key: VC_EMBEDDING_API_KEY only.
  embedding:
    enabled: false
    base-url: https://embedding.example-vendor.invalid/v1
    model: replace-with-approved-embedding-model
    model-version: replace-with-immutable-embedding-revision
    dimension: 64
    space-id: replace-with-unique-model-version-dimension-space-id
    reembed-enabled: false
    source-space-id: alpha-hash-64
    reembed-batch-size: 16

# 本机真实 provider 联调覆盖（不入库）:激活 provider profile 并注入密钥。
services:
  runtime:
    environment:
      SPRING_PROFILES_ACTIVE: production,provider
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-provider.yml
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG: DEBUG
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,env,conditions
      MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES: always
      VC_MODEL_SECRET_OPENCODE_GO_API_KEY: ${VC_MODEL_SECRET_OPENCODE_GO_API_KEY:?}
      VC_MODEL_SECRET_WEIXIN_API_KEY: ${VC_MODEL_SECRET_WEIXIN_API_KEY:?}
      VC_MODEL_EGRESS_ALLOWED_HOSTS: ${VC_MODEL_EGRESS_ALLOWED_HOSTS:?}
      VIRTUAL_COMPANION_AUTH_ADMIN_SEED_USERNAME: ${VC_ADMIN_SEED_USERNAME}
      VIRTUAL_COMPANION_AUTH_ADMIN_SEED_PASSWORD: ${VC_ADMIN_SEED_PASSWORD}
      VIRTUAL_COMPANION_AUTH_INVITE_REGISTRATION_ENABLED: "true"
    volumes:
      - ./.local/application-provider.yml:/app/config/application-provider.yml:ro

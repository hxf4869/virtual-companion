# 本机真实 provider 联调覆盖（不入库）:激活 provider profile 并注入密钥。
services:
  runtime:
    environment:
      SPRING_PROFILES_ACTIVE: production,provider
      VC_MODEL_SECRET_OPENCODE_GO_API_KEY: ${VC_MODEL_SECRET_OPENCODE_GO_API_KEY:?}
    volumes:
      - ./.local/application-provider.yml:/app/config/application-provider.yml:ro

# Go-only topology: PostgreSQL 18 + pgvector, companiond, MinIO, and Caddy.
# Migrate and bootstrap reuse the same Go image as one-shot startup jobs.

x-companiond-image: &companiond-image
  image: virtual-companion-runtime:local
  build:
    context: ../../backend
    dockerfile: Dockerfile

services:
  db:
    image: pgvector/pgvector:0.8.5-pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    environment:
      POSTGRES_USER: vc_migrator
      POSTGRES_PASSWORD: ${VC_MIGRATOR_DB_PASSWORD:?set in .env}
      VC_MIGRATOR_DB_PASSWORD: ${VC_MIGRATOR_DB_PASSWORD:?set in .env}
      VC_RUNTIME_DB_PASSWORD: ${VC_RUNTIME_DB_PASSWORD:?set in .env}
      POSTGRES_DB: vc
    volumes:
      - db-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc_migrator -d vc"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Schema ownership is intentionally separate from the steady-state runtime.
  # The embedded Go migrator exits before bootstrap/runtime start.
  migrate:
    <<: *companiond-image
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]
    environment:
      VC_MIGRATE_DB_DSN: postgres://vc_migrator:${VC_MIGRATOR_DB_PASSWORD:?set in .env}@db:5432/vc?sslmode=disable
    restart: "no"

  # Initializes/verifies the owner-binding secret and optionally seeds the
  # first ADMIN. Migrator credentials exist only in this short-lived job.
  bootstrap:
    <<: *companiond-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["bootstrap"]
    environment:
      VC_BOOTSTRAP_DB_DSN: postgres://vc_migrator:${VC_MIGRATOR_DB_PASSWORD:?set in .env}@db:5432/vc?sslmode=disable
      VC_OWNER_BINDING_SECRET: ${VC_OWNER_BINDING_SECRET:?set in .env}
      VC_ADMIN_SEED_USERNAME: ${VC_ADMIN_SEED_USERNAME:-}
      VC_ADMIN_SEED_PASSWORD: ${VC_ADMIN_SEED_PASSWORD:-}
      VC_ADMIN_SEED_DISPLAY_NAME: ${VC_ADMIN_SEED_DISPLAY_NAME:-管理员}
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: ${VC_EXPORT_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${VC_EXPORT_S3_SECRET_KEY:?set in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      VC_EXPORT_S3_ACCESS_KEY: ${VC_EXPORT_S3_ACCESS_KEY:?set in .env}
      VC_EXPORT_S3_SECRET_KEY: ${VC_EXPORT_S3_SECRET_KEY:?set in .env}
      VC_EXPORT_S3_BUCKET: ${VC_EXPORT_S3_BUCKET:-vc-exports}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$VC_EXPORT_S3_ACCESS_KEY" "$$VC_EXPORT_S3_SECRET_KEY"
        mc mb --ignore-existing local/"$$VC_EXPORT_S3_BUCKET"
        perm=$$(mc anonymous get local/"$$VC_EXPORT_S3_BUCKET")
        case "$$perm" in
          *none*|*private*) ;;
          *) echo 'export bucket must not allow anonymous access'; exit 1 ;;
        esac
    restart: "no"

  runtime:
    <<: *companiond-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      VC_MODE: full
      VC_HTTP_ADDR: 0.0.0.0:8080
      VC_HTTP_ORIGINS: https://${VC_DOMAIN:?set in .env}
      VC_DB_DSN: postgres://vc_runtime_login:${VC_RUNTIME_DB_PASSWORD:?set in .env}@db:5432/vc?sslmode=disable
      VC_DB_MAX_CONNS: ${VC_DB_MAX_CONNS:-8}
      VC_DB_TX_TIMEOUT: ${VC_DB_TX_TIMEOUT:-5s}
      VC_OWNER_BINDING_SECRET: ${VC_OWNER_BINDING_SECRET:?set in .env}
      VC_CRYPTO_REST_KEY: ${VC_CRYPTO_REST_KEY:?set in .env}
      VC_CRYPTO_REST_KEY_ID: ${VC_CRYPTO_REST_KEY_ID:-default}
      VC_CRYPTO_REST_KEY_VERSION: ${VC_CRYPTO_REST_KEY_VERSION:-1}
      VC_CRYPTO_PREVIOUS_REST_KEY: ${VC_CRYPTO_PREVIOUS_REST_KEY:-}
      VC_CRYPTO_PREVIOUS_REST_KEY_ID: ${VC_CRYPTO_PREVIOUS_REST_KEY_ID:-}
      VC_CRYPTO_PREVIOUS_REST_KEY_VERSION: ${VC_CRYPTO_PREVIOUS_REST_KEY_VERSION:-0}
      # Provider/model credentials and routes are managed by the ADMIN page and
      # stored encrypted in PostgreSQL. The env bootstrap route stays disabled.
      VC_PROVIDER_ENABLED: "false"
      VC_PROVIDER_ALLOW_LOOPBACK_HTTP: ${VC_PROVIDER_ALLOW_LOOPBACK_HTTP:-false}
      VC_PROVIDER_CONNECT_TIMEOUT: ${VC_PROVIDER_CONNECT_TIMEOUT:-10s}
      VC_PROVIDER_FIRST_TOKEN_TIMEOUT: ${VC_PROVIDER_FIRST_TOKEN_TIMEOUT:-60s}
      VC_PROVIDER_TOTAL_TIMEOUT: ${VC_PROVIDER_TOTAL_TIMEOUT:-240s}
      VC_PROVIDER_MAX_RESPONSE_BYTES: ${VC_PROVIDER_MAX_RESPONSE_BYTES:-262144}
      VC_BUDGET_MAX_INPUT_TOKENS: ${VC_BUDGET_MAX_INPUT_TOKENS:-8000}
      VC_BUDGET_MAX_OUTPUT_TOKENS: ${VC_BUDGET_MAX_OUTPUT_TOKENS:-2048}
      VC_BUDGET_MAX_RESPONSE_BYTES: ${VC_BUDGET_MAX_RESPONSE_BYTES:-262144}
      VC_BUDGET_CONNECT_TIMEOUT: ${VC_BUDGET_CONNECT_TIMEOUT:-10s}
      VC_BUDGET_FIRST_TOKEN_TIMEOUT: ${VC_BUDGET_FIRST_TOKEN_TIMEOUT:-60s}
      VC_BUDGET_TOTAL_TIMEOUT: ${VC_BUDGET_TOTAL_TIMEOUT:-240s}
      VC_BUDGET_MAX_ATTEMPTS: ${VC_BUDGET_MAX_ATTEMPTS:-2}
      VC_BUDGET_MAX_RESERVED_COST: ${VC_BUDGET_MAX_RESERVED_COST:-0}
      VC_SESSION_TTL: ${VC_SESSION_TTL:-168h}
      VC_SESSION_COOKIE_SECURE: "true"
      VC_SESSION_REAUTH_WINDOW: ${VC_SESSION_REAUTH_WINDOW:-15m}
      VC_MAX_OUTSTANDING_TURNS: ${VC_MAX_OUTSTANDING_TURNS:-8}
      VC_MAX_CONCURRENT_TURNS: ${VC_MAX_CONCURRENT_TURNS:-1}
      VC_QUEUE_TIMEOUT: ${VC_QUEUE_TIMEOUT:-5m}
      VC_JOB_CLAIM_LIMIT: ${VC_JOB_CLAIM_LIMIT:-8}
      VC_JOB_RECOVER_INTERVAL: ${VC_JOB_RECOVER_INTERVAL:-5s}
      VC_SHUTDOWN_TIMEOUT: ${VC_SHUTDOWN_TIMEOUT:-15s}
      VC_LOG_LEVEL: ${VC_LOG_LEVEL:-info}
      VC_VERSION: ${VC_VERSION:-0.1.0}
      VC_COMMIT: ${VC_COMMIT:-}
    restart: unless-stopped
    deploy:
      replicas: 1

  caddy:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile.web
    depends_on:
      runtime:
        condition: service_healthy
    ports:
      - "${VC_HTTP_PORT:-80}:80"
      - "${VC_HTTPS_PORT:-443}:443"
    environment:
      VC_DOMAIN: ${VC_DOMAIN:?set in .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:

# 本机真实 provider 配置（本地文件,不入库）——OpenCode Go / Hy3
virtual-companion:
  model-providers:
    enabled: true
    secret-root: /run/secrets
    deployments:
      - provider-id: weixin-ds-flash
        protocol: OPENAI_CHAT_COMPLETIONS
        supplier-name: WeChat
        model: Deepseek-v4-flash
        endpoint: https://chatapi.weixin.qq.com/openai/v1/chat/completions
        credential-secret: weixin-api-key
        max-tokens: 4096
        temperature: 0.8
        enabled: true
      - provider-id: weixin-glm
        protocol: OPENAI_CHAT_COMPLETIONS
        supplier-name: WeChat
        model: GLM-5.2
        endpoint: https://chatapi.weixin.qq.com/openai/v1/chat/completions
        credential-secret: weixin-api-key
        max-tokens: 4096
        temperature: 0.8
        enabled: true
      - provider-id: opencode-go
        protocol: OPENAI_CHAT_COMPLETIONS
        supplier-name: OpenCode
        model: hy3
        endpoint: https://opencode.ai/zen/go/v1/chat/completions
        credential-secret: opencode-go-api-key
        max-tokens: 2048
        temperature: 0.8
        enabled: true

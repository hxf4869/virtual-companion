# Loaded by the existing HTTPS Nginx, which joins vc-v2-edge.
# Replace __VC_PUBLIC_HOST__ with the public host from /etc/virtual-companion/compose.env before installing.
# Replace __VC_EDGE_INGRESS__ with VC_EDGE_INGRESS_IP from that same file. Do not commit a deployment address.
# Avoid logging IPs, request URLs, auth challenges, cookies, or headers.
log_format vc_v2_safe '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=vc_v2_auth:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __VC_PUBLIC_HOST__;
    access_log /var/log/nginx/virtual-companion.access.log vc_v2_safe;
    return 301 https://__VC_PUBLIC_HOST__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __VC_PUBLIC_HOST__;
    ssl_certificate /etc/nginx/cert/__VC_PUBLIC_HOST__.pem;
    ssl_certificate_key /etc/nginx/cert/__VC_PUBLIC_HOST__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/virtual-companion.access.log vc_v2_safe;
    error_log /var/log/nginx/virtual-companion.error.log crit;
    limit_req_status 429;
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_cookie_flags ~^session- secure httponly samesite=lax;
    proxy_buffering off;
    proxy_read_timeout 300s;

    location = /auth/api/login {
        limit_req zone=vc_v2_auth burst=5 nodelay;
        proxy_pass http://__VC_EDGE_INGRESS__:8080;
    }
    location ^~ /auth/api/challenges/ {
        limit_req zone=vc_v2_auth burst=5 nodelay;
        proxy_pass http://__VC_EDGE_INGRESS__:8080;
    }
    location / {
        proxy_pass http://__VC_EDGE_INGRESS__:8080;
    }
}

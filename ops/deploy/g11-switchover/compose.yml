# G11 switchover drill stack — standalone (not merged with the G1 measurement
# compose; the drill owns its stack definition so ports/volumes are exact).
# Topology: Caddy edge + Java runtime + PostgreSQL 18 + MinIO + loopback fake
# provider, mirroring §19.1 retained stack. Synthetic secrets only, from
# .run/compose.env (mode 0600). Never production, never a real provider.

name: vc-g11

services:
  db:
    image: pgvector/pgvector:0.8.5-pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    environment:
      POSTGRES_USER: vc_migrator
      POSTGRES_PASSWORD: ${VC_MIGRATOR_DB_PASSWORD:?}
      VC_MIGRATOR_DB_PASSWORD: ${VC_MIGRATOR_DB_PASSWORD:?}
      VC_RUNTIME_DB_PASSWORD: ${VC_RUNTIME_DB_PASSWORD:?}
      POSTGRES_DB: vc
    ports:
      # Host-visible PostgreSQL for the host Go companiond.
      - "127.0.0.1:${G11_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ../../../ops/deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc_migrator -d vc"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: ${VC_EXPORT_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${VC_EXPORT_S3_SECRET_KEY:?}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      VC_EXPORT_S3_ACCESS_KEY: ${VC_EXPORT_S3_ACCESS_KEY:?}
      VC_EXPORT_S3_SECRET_KEY: ${VC_EXPORT_S3_SECRET_KEY:?}
      VC_EXPORT_S3_BUCKET: ${VC_EXPORT_S3_BUCKET:-vc-exports}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        i=0
        while [ "$$i" -lt 15 ]; do
          if mc alias set local http://minio:9000 "$$VC_EXPORT_S3_ACCESS_KEY" "$$VC_EXPORT_S3_SECRET_KEY"; then
            break
          fi
          i=$$((i + 1))
          sleep 2
        done
        mc mb --ignore-existing local/"$$VC_EXPORT_S3_BUCKET"
        perm=$$(mc anonymous get local/"$$VC_EXPORT_S3_BUCKET")
        case "$$perm" in
          *none*|*private*|*disabled*) ;;
          *) echo 'export bucket must not allow anonymous access'; exit 1 ;;
        esac
        echo 'minio-init ok: bucket exists and is private'
    restart: "no"

  runtime:
    build:
      context: ../../..
      dockerfile: ops/deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: production
      VC_AUTH_ENABLED: "true"
      VC_AUTH_DATASOURCE_ENABLED: "true"
      VC_FLYWAY_ENABLED: "true"
      VC_MIGRATOR_DB_URL: jdbc:postgresql://db:5432/vc
      VC_MIGRATOR_DB_USERNAME: vc_migrator
      VC_MIGRATOR_DB_PASSWORD: ${VC_MIGRATOR_DB_PASSWORD:?}
      VC_DB_URL: jdbc:postgresql://db:5432/vc
      VC_DB_USERNAME: vc_runtime_login
      VC_DB_PASSWORD: ${VC_RUNTIME_DB_PASSWORD:?}
      VC_ENFORCE_DB_LEAST_PRIVILEGE: "true"
      VC_JWT_SECRET: ${VC_JWT_SECRET:?}
      VC_OWNER_BINDING_SECRET: ${VC_OWNER_BINDING_SECRET:?}
      VC_SHARED_RATE_LIMIT_ENABLED: "true"
      VC_SHARED_RATE_LIMIT_SECRET: ${VC_SHARED_RATE_LIMIT_SECRET:?}
      VC_CRYPTO_REST_KEY: ${VC_CRYPTO_REST_KEY:?}
      VC_CRYPTO_BACKFILL_ENABLED: "false"
      VC_ADMIN_USERNAME: ${VC_ADMIN_USERNAME:?}
      VC_ADMIN_PASSWORD: ${VC_ADMIN_PASSWORD:?}
      VC_ADMIN_DISPLAY_NAME: ${VC_ADMIN_DISPLAY_NAME:-G11 Admin}
      VC_MODEL_PROVIDERS_ENABLED: "true"
      VC_ZERO_LLM_ENABLED: "false"
      VC_GENERATION_PROVIDER_TERMS_VERIFIED: "true"
      VC_MODEL_BUDGET_MONTHLY_USD: "100"
      VC_MODEL_BUDGET_RESERVATION_OUTPUT_TOKENS: "256"
      VC_MODEL_SECRET_G1_CRED: ${VC_MODEL_SECRET_G1_CRED:?}
      VC_EXTERNAL_PROTOCOL: OPENAI_CHAT_COMPLETIONS
      VC_EXTERNAL_TIMEOUT_CONNECT: 2s
      VC_EXTERNAL_TIMEOUT_FIRST_TOKEN: 60s
      VC_EXTERNAL_TIMEOUT_TOTAL: 90s
      VC_EXPORT_S3_ENABLED: "true"
      VC_EXPORT_S3_ENDPOINT: http://minio:9000
      VC_EXPORT_S3_ACCESS_KEY: ${VC_EXPORT_S3_ACCESS_KEY:?}
      VC_EXPORT_S3_SECRET_KEY: ${VC_EXPORT_S3_SECRET_KEY:?}
      VC_EXPORT_S3_BUCKET: ${VC_EXPORT_S3_BUCKET:-vc-exports}
      VC_BETA_GENERATION_ENABLED: "true"
      VC_ADMISSION_ENFORCE: "true"
      VC_ADMISSION_REQUIRED_CONSENTS: "SERVICE_TERMS,PRIVACY_POLICY,AI_CONTENT_NOTICE"
      VC_CORS_ALLOWED_ORIGINS: http://${VC_DOMAIN:-localhost}
      VC_RUNTIME_REPLICAS: "1"
      VC_AUTH_COOKIE_SECURE: "true"
      VC_COMMIT: g11-drill
    ports:
      # Direct runtime port (operator drain path) and the loopback fake
      # provider port (fake provider shares the runtime netns).
      - "127.0.0.1:${G11_RUNTIME_SCRAPE_PORT:-18081}:8080"
      - "127.0.0.1:${G11_FAKE_PROVIDER_PORT:-19090}:19090"
    command:
      - --virtual-companion.model-providers.deployments[0].provider-id=g11-openai
      - --virtual-companion.model-providers.deployments[0].protocol=OPENAI_CHAT_COMPLETIONS
      - --virtual-companion.model-providers.deployments[0].supplier-name=g11-local-fake
      - --virtual-companion.model-providers.deployments[0].model=g1-model
      - --virtual-companion.model-providers.deployments[0].model-revision=g1-model-revision-v1
      - --virtual-companion.model-providers.deployments[0].config-version=g11-loopback-config-v1
      - --virtual-companion.model-providers.deployments[0].endpoint=http://127.0.0.1:19090/v1/chat/completions
      - --virtual-companion.model-providers.deployments[0].credential-secret=g1-cred
      - --virtual-companion.model-providers.deployments[0].enabled=true
    restart: "no"

  fake-provider:
    image: node:20-bookworm-slim
    depends_on:
      runtime:
        condition: service_started
    network_mode: "service:runtime"
    working_dir: /app
    volumes:
      - ../../../scripts/measure/g1-java-baseline/fake_provider.mjs:/app/fake_provider.mjs:ro
    environment:
      E2E_PROVIDER_PORT: "19090"
      G1_FIRST_TOKEN_MS: "200"
      G1_DELTA_MS: "50"
      G1_CHUNKS: "8"
      G1_HOLD_MS: "${G11_HOLD_MS:-0}"
    command: ["node", "fake_provider.mjs"]
    restart: "no"

  # Go-phase loopback provider in its OWN netns: the Java fake provider shares
  # the runtime netns and its host port forwarding dies with the runtime, so
  # the host Go companiond needs an independent one that survives the Java
  # stop/start during the cutover and rollback.
  go-fake-provider:
    image: node:20-bookworm-slim
    ports:
      - "127.0.0.1:${G11_GO_FAKE_PORT:-19091}:19091"
    working_dir: /app
    volumes:
      - ../../../scripts/measure/g1-java-baseline/fake_provider.mjs:/app/fake_provider.mjs:ro
    environment:
      # 0.0.0.0 so the host-published port can reach it (docker forwards to
      # the container eth0, not the container loopback).
      E2E_PROVIDER_HOST: "0.0.0.0"
      E2E_PROVIDER_PORT: "19091"
      G1_FIRST_TOKEN_MS: "200"
      G1_DELTA_MS: "50"
      G1_CHUNKS: "8"
      G1_HOLD_MS: "${G11_HOLD_MS:-0}"
    command: ["node", "fake_provider.mjs"]
    restart: "no"

  caddy:
    image: caddy:2
    depends_on:
      - runtime
    ports:
      - "127.0.0.1:${G11_CADDY_PORT:-18080}:80"
    environment:
      G11_UPSTREAM: "${G11_UPSTREAM:-runtime:8080}"
    volumes:
      - ./Caddyfile.serve:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.maintenance:/etc/caddy/Caddyfile.maintenance:ro
      - ./h5-stub:/srv/h5:ro
    restart: "no"

volumes:
  db-data:
  minio-data:

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VC 交互原型</title>
<style>
/* Apple 原生 App 语法：系统字体、单一 Action Blue、玻璃材质栏与弹层、角色氛围色、弹簧动效。tokens 对应仓库根 DESIGN.md；头像为合成示例 */
:root {
  --canvas: #f5f5f7; --surface: #ffffff; --surface-2: #fbfbfd; --fill: #ededf0; --fill-2: #e3e3e8;
  --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #aeaeb2; --sep: rgba(60, 60, 67, .16);
  --accent: #0071e3; --accent-text: #0066cc; --on-accent: #ffffff;
  --danger: #d70015; --warn: #b25000; --ok: #248a3d;
  --glass: rgba(250, 250, 252, .62); --glass-strong: rgba(250, 250, 252, .86);
  --glass-hi: rgba(255, 255, 255, .9); --glass-edge: rgba(0, 0, 0, .06); --glass-shadow: rgba(0, 0, 0, .10);
  --scrim: rgba(0, 0, 0, .22); --bubble: #ededf0; --tint-a: .16; --frame: #d9d9de;
  --group: #ffffff; --raise: #f5f5f7; --thumb: #ffffff; --bubble-2: #f3f3f6; --sheet: #f5f5f7; --sheet-group: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --spring: cubic-bezier(.32, .72, 0, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #000000; --surface: #000000; --surface-2: #1c1c1e; --fill: #2c2c2e; --fill-2: #3a3a3c;
  --ink: #f5f5f7; --ink-2: #98989d; --ink-3: #636366; --sep: rgba(84, 84, 88, .55);
  --accent-text: #2997ff; --danger: #ff6961; --warn: #ffb340; --ok: #30d158;
  --glass: rgba(36, 36, 38, .58); --glass-strong: rgba(36, 36, 38, .84);
  --glass-hi: rgba(255, 255, 255, .14); --glass-edge: rgba(255, 255, 255, .07); --glass-shadow: rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .5); --bubble: #2c2c2e; --tint-a: .34; --frame: #2c2c2e;
  --group: #1c1c1e; --raise: #1c1c1e; --thumb: #636366; --bubble-2: #1c1c1e; --sheet: #1c1c1e; --sheet-group: #2c2c2e; color-scheme: dark } }
:root[data-theme="dark"] {
  --canvas: #000000; --surface: #000000; --surface-2: #1c1c1e; --fill: #2c2c2e; --fill-2: #3a3a3c;
  --ink: #f5f5f7; --ink-2: #98989d; --ink-3: #636366; --sep: rgba(84, 84, 88, .55);
  --accent-text: #2997ff; --danger: #ff6961; --warn: #ffb340; --ok: #30d158;
  --glass: rgba(36, 36, 38, .58); --glass-strong: rgba(36, 36, 38, .84);
  --glass-hi: rgba(255, 255, 255, .14); --glass-edge: rgba(255, 255, 255, .07); --glass-shadow: rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .5); --bubble: #2c2c2e; --tint-a: .34; --frame: #2c2c2e;
  --group: #1c1c1e; --raise: #1c1c1e; --thumb: #636366; --bubble-2: #1c1c1e; --sheet: #1c1c1e; --sheet-group: #2c2c2e; color-scheme: dark }
@supports (transition-timing-function: linear(0, 1)) { :root {
  --spring: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
} }

html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 17px/1.47 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lucide { width: 22px; height: 22px; stroke-width: 1.75; flex: none; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--canvas); isolation: isolate; }
@media (min-width: 600px) {
  body { display: grid; place-items: center; background: var(--fill); }
  #app { width: 390px; height: min(844px, calc(100% - 48px)); border-radius: 48px;
    box-shadow: 0 0 0 10px var(--frame), 0 30px 80px rgba(0, 0, 0, .25); }
}

/* ——— 屏幕与滚动 ——— */
.screen { position: absolute; inset: 0; overflow: hidden; background: var(--canvas); }
.scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 56px 0 120px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.large-title { font-size: 32px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; margin: 8px 20px 12px;
  transform-origin: left center; transition: opacity .2s; }

/* ——— 玻璃 ——— */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 .5px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-edge), 0 8px 28px var(--glass-shadow); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-strong); } }

/* ——— 导航栏 ——— */
.navbar { position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center;
  gap: 8px; padding: 0 12px; pointer-events: none; }
.navbar > * { pointer-events: auto; }
.navbar::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: var(--nav-p, 0);
  background: var(--glass-strong); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: 0 .5px 0 var(--sep); transition: opacity .2s; }
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; opacity: var(--nav-p, 0);
  transition: opacity .2s; pointer-events: none; white-space: nowrap; }
.nav-spacer { flex: 1; }
.circle { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink);
  transition: transform .25s var(--spring); }
.circle:active, .press:active { transform: scale(.94); }
.capsule { height: 44px; border-radius: 22px; display: flex; align-items: center; }
.capsule button { width: 44px; height: 44px; display: grid; place-items: center; }
.avatar { border-radius: 50%; object-fit: cover; display: block; background: var(--fill); flex: none; }
.me-btn img { width: 36px; height: 36px; }

/* ——— 标签栏 ——— */
.tabbar { position: absolute; z-index: 20; left: 16px; right: 16px; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px;
  transition: transform .5s var(--spring), opacity .3s; }
.tabbar.hide { transform: translateY(140%); opacity: 0; }
.tab-lens { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 5); border-radius: 28px;
  background: color-mix(in srgb, var(--ink) 8%, transparent); transition: transform .55s var(--spring); }
.tab-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 10.5px; font-weight: 600; color: var(--ink-2); border-radius: 28px; transition: color .2s, transform .25s var(--spring); }
.tab-btn[aria-current="page"] { color: var(--accent-text); }
.tab-btn:active { transform: scale(.92); }
.tab-btn .lucide { width: 24px; height: 24px; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }

/* ——— 分组列表 ——— */
.search { margin: 0 16px 16px; height: 38px; border-radius: 12px; background: var(--fill); display: flex; align-items: center;
  gap: 6px; padding: 0 10px; color: var(--ink-2); font-size: 17px; }
.search .lucide { width: 18px; height: 18px; }
.group { margin: 0 16px 24px; background: var(--group); border-radius: 16px; overflow: hidden; }
.group-h { margin: 0 32px 6px; font-size: 13px; color: var(--ink-2); }
.cell { position: relative; width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  text-align: left; transition: background .15s; }
.cell:active { background: var(--fill); }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: .5px; background: var(--sep); }
.cell .grow { flex: 1; min-width: 0; }
.cell .val { color: var(--ink-2); font-size: 16px; display: flex; align-items: center; gap: 6px; }
.chev { color: var(--ink-3); }
.chev .lucide, .cell .chev { width: 16px; height: 16px; }
.tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.tile .lucide { width: 18px; height: 18px; stroke-width: 2; }
.meta { font-size: 13px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* 会话列表 */
.convo { --inset: 84px; gap: 14px; padding: 12px 16px; }
.convo .avatar { width: 56px; height: 56px; }
.convo .top { display: flex; align-items: baseline; gap: 6px; }
.convo .name { font-weight: 600; }
.convo .inst { color: var(--ink-2); font-size: 15px; }
.convo .time { margin-left: auto; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.convo .pv { padding-right: 18px; color: var(--ink-2); font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.convo .unread { position: absolute; right: 16px; top: 50px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

/* ——— 对话 ——— */
.chat { background: radial-gradient(130% 70% at 50% -10%, rgba(var(--tint), var(--tint-a)), transparent 70%), var(--surface); }
.chat .scroll { padding: 64px 0 112px; }
.chat .navbar::before { background: color-mix(in srgb, rgb(var(--tint)) 6%, var(--glass-strong)); }
.who { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 22px; margin: 0 auto; }
.who img { width: 34px; height: 34px; }
.who b { display: block; font-size: 15px; line-height: 1.2; }
.who small { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.2; }
.poster { display: flex; flex-direction: column; align-items: center; padding: 12px 20px 28px; gap: 4px; }
.poster .avatar { width: 112px; height: 112px; box-shadow: 0 0 0 4px var(--surface), 0 12px 32px rgba(var(--tint), .45); margin-bottom: 10px; }
.poster h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.poster p { margin: 0; color: var(--ink-2); font-size: 15px; }
.poster .acts { display: flex; gap: 28px; margin-top: 18px; }
.poster .acts button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.poster .acts span.c { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-text);
  background: color-mix(in srgb, rgb(var(--tint)) 14%, var(--fill)); transition: transform .25s var(--spring); }
.poster .acts button:active span.c { transform: scale(.9); }
.stamp { text-align: center; font-size: 12px; color: var(--ink-2); margin: 14px 0 10px; font-variant-numeric: tabular-nums; }
.msgs { padding: 0 20px; display: flex; flex-direction: column; gap: 18px; }
.msg { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.msg.selectable { -webkit-user-select: text; user-select: text; }
.msg.me { align-self: flex-end; max-width: 80%; background: var(--bubble); border-radius: 20px 20px 6px 20px; padding: 10px 14px;
  line-height: 1.55; transform-origin: 100% 100%; }
.msg.char { line-height: 1.7; }
.msg.char .hd { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.msg.char .hd img { width: 24px; height: 24px; }
.msg .body p { margin: 0; }
.msg .body p + p { margin-top: .7em; }
.bubbled .msg.char .body { background: color-mix(in srgb, rgb(var(--tint)) 10%, var(--bubble-2)); border-radius: 20px 20px 20px 6px;
  padding: 10px 14px; display: inline-block; max-width: 86%; }
.tok { animation: tokIn .5s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes tokIn { from { opacity: 0; filter: blur(5px); } to { opacity: 1; filter: blur(0); } }
.thinking { display: inline-flex; gap: 5px; padding: 8px 0; }
.thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: think 1.2s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 0%, 80%, 100% { transform: scale(.7); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
.tail { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 4px; vertical-align: middle;
  background: rgb(var(--tint)); animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.55); opacity: .5; } }
.tools { display: flex; align-items: center; margin-top: 8px; color: var(--ink-2); }
.tools .pager { display: flex; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.tools .pager button, .tools .act { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 18px; }
.tools .pager button:active, .tools .act:active { background: var(--fill); }
.tools .lucide { width: 18px; height: 18px; }
.tools .sp { flex: 1; }
.composer { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.field { flex: 1; min-height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 6px 0 16px; }
.field textarea { flex: 1; border: 0; background: transparent; resize: none; font: 17px/1.4 var(--font); color: var(--ink);
  padding: 11px 0; max-height: 140px; outline: none; caret-color: var(--accent); }
.field textarea::placeholder { color: var(--ink-3); }
.send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
  margin: 4px 0; transition: transform .3s var(--spring), opacity .2s, background .2s; }
.send[disabled] { opacity: .35; transform: scale(.86); }
.send .lucide { width: 20px; height: 20px; stroke-width: 2.25; }
.send.stop { background: var(--ink); color: var(--surface); }
.send.stop .lucide { width: 14px; height: 14px; fill: currentColor; }
.jump { position: absolute; z-index: 6; left: 50%; bottom: 84px; height: 36px; border-radius: 18px; padding: 0 14px; display: flex;
  align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--accent-text);
  transform: translate(-50%, 16px) scale(.9); opacity: 0; pointer-events: none; transition: transform .45s var(--spring), opacity .2s; }
.jump.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.jump .lucide { width: 16px; height: 16px; }

/* ——— 浮层：弹出菜单、上下文菜单、sheet、alert、toast ——— */
.scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; transition: opacity .3s; }
.scrim.blur { background: color-mix(in srgb, var(--surface) 30%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.scrim.on { opacity: 1; }
.menu { position: absolute; z-index: 32; min-width: 220px; border-radius: 18px; padding: 6px; transform-origin: var(--ox, 100%) var(--oy, 0%); }
.menu button { width: 100%; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; text-align: left; font-size: 16px; }
.menu button:active, .menu button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.menu button .lucide { width: 19px; height: 19px; margin-left: auto; color: var(--ink-2); }
.menu button.danger, .menu button.danger .lucide { color: var(--danger); }
.menu hr { border: 0; height: 6px; margin: 4px -6px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
.menu .check { width: 19px; color: var(--accent-text); margin-left: auto; }
.lift { position: absolute; z-index: 31; pointer-events: none; transition: transform .4s var(--spring), box-shadow .4s;
  border-radius: 20px; }
.lift.char-lift { background: var(--group); padding: 12px 16px; border-radius: 20px; }
.sheet { position: absolute; z-index: 40; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; display: flex; flex-direction: column;
  background: var(--sheet); box-shadow: 0 -10px 40px rgba(0, 0, 0, .12); will-change: transform; }
.sheet .group { background: var(--sheet-group); }
.sheet .grab { padding: 8px 0 4px; touch-action: none; cursor: grab; }
.sheet .grab::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--ink-3); margin: 0 auto; opacity: .7; }
.sheet .sh { display: flex; align-items: center; height: 48px; padding: 0 8px 0 20px; touch-action: none; }
.sheet .sh h3 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
.sheet .sh .done { height: 44px; padding: 0 12px; font-weight: 600; color: var(--accent-text); }
.sheet .sb { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 0 40px; position: relative; }
.sheet .pane { position: absolute; inset: 0; overflow-y: auto; padding: 8px 0 40px; background: var(--sheet); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 36px; padding: 2px; border-radius: 10px;
  background: var(--fill); margin: 0 16px 16px; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 8px; background: var(--thumb);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 .5px 0 rgba(0, 0, 0, .04); transition: transform .45s var(--spring); }
.seg button { position: relative; z-index: 1; font-size: 14px; font-weight: 600; color: var(--ink-2); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.toggle { position: relative; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); flex: none; transition: background .25s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .1); transition: transform .45s var(--spring), width .2s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.toggle:active::after { width: 33px; }
.toggle[aria-checked="true"]:active::after { transform: translateX(14px); }
.slider-cell { flex-wrap: wrap; row-gap: 4px; }
.slider-cell .num { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.range { width: 100%; -webkit-appearance: none; appearance: none; height: 28px; background: transparent; margin: 0; }
.range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
  background: linear-gradient(var(--accent), var(--accent)) 0 / var(--pct, 50%) 100% no-repeat, var(--fill-2); }
.range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--fill-2); }
.range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; margin-top: -12px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .18), 0 0 0 .5px rgba(0, 0, 0, .06); transition: transform .3s var(--spring); }
.range:active::-webkit-slider-thumb { transform: scale(1.12); }
.range::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 3px 8px rgba(0, 0, 0, .18); }
.alert { position: absolute; z-index: 50; left: 50%; top: 50%; width: 280px; border-radius: 22px; overflow: hidden; text-align: center;
  transform: translate(-50%, -50%); }
.alert .t { padding: 20px 18px 16px; }
.alert h4 { margin: 0 0 4px; font-size: 17px; }
.alert p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.alert .bs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 14px; }
.alert .bs button { height: 44px; border-radius: 22px; background: color-mix(in srgb, var(--ink) 8%, transparent); font-weight: 600; }
.alert .bs .danger { color: #fff; background: var(--danger); }
.toast { position: absolute; z-index: 60; left: 50%; top: 12px; height: 44px; padding: 0 18px; border-radius: 22px; display: flex;
  align-items: center; gap: 8px; font-size: 15px; font-weight: 600; transform: translate(-50%, -80px); transition: transform .5s var(--spring); }
.toast.on { transform: translate(-50%, 0); }
.toast .lucide { width: 18px; height: 18px; color: var(--ok); }
.btn-fill { height: 50px; border-radius: 25px; background: var(--accent); color: var(--on-accent); font-weight: 600; display: flex;
  align-items: center; justify-content: center; gap: 8px; transition: transform .3s var(--spring); }
.btn-fill:active { transform: scale(.96); }
.btn-plain { color: var(--accent-text); font-size: 15px; height: 36px; padding: 0 6px; }
.btn-plain.danger { color: var(--danger); }

/* ——— 角色 ——— */
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }

  const s = document.createElement('div'); s.className = 'sheet'; s.setAttribute('role', 'dialog'); s.style.height = H + 'px';

  s.querySelector('.sb').append(body); app.append(scrim, s); icons();

  const set = v => { y = v; s.style.transform = `translateY(${Math.max(v, -60)}px)`; scrim.style.opacity = Math.max(0, Math.min(1, 1 - (v - (H - M)) / M)); };

    const t = performance.now(); vel = (e.clientY - lastY) / Math.max(1, t - lastT) * 1000; lastY = e.clientY; lastT = t; };
  const up = () => { if (!drag) return; drag = false; const proj = y + vel * .18; if (proj > (large ? H * .28 : H - M * .62)) return close();
    const target = detents.reduce((a, b) => Math.abs(b - proj) < Math.abs(a - proj) ? b : a); to(target, vel); };

    <div class="group">${sl('温度', 0, 2, .05, .85, v => (+v).toFixed(2))}${sl('Top P', 0, 1, .01, .95, v => (+v).toFixed(2))}${sl('最大回复长度', 100, 4000, 50, 1200, v => v + ' tokens')}${sl('上下文长度', 4, 200, 4, 32, v => v + 'K')}</div>
    <div class="group"><div class="cell"><span class="grow">流式输出</span><button class="toggle" role="switch" aria-checked="true" aria-label="流式输出"></button></div><div class="cell"><span class="grow">连续生成</span><button class="toggle" role="switch" aria-checked="false" aria-label="连续生成"></button></div></div>`;
  sb.append(pane); icons(); bindToggles(pane);
  const fmts = [v => (+v).toFixed(2), v => (+v).toFixed(2), v => v + ' tokens', v => v + 'K'];
  $$('.range', pane).forEach((r, i) => { const upd = () => { r.style.setProperty('--pct', ((r.value - r.min) / (r.max - r.min) * 100) + '%'); r.previousElementSibling.textContent = fmts[i](r.value); }; r.oninput = upd; upd(); });
  $('#preset', pane).onclick = e => popMenu(e.currentTarget, [{ label: '长篇陪伴', check: true }, { label: '简短日常' }, { label: '剧情主持' }]);
  anim(pane, [{ transform: 'translateX(100%)' }, { transform: 'none' }]);
  $('[data-backpane]', pane).onclick = () => anim(pane, [{ transform: 'none' }, { transform: 'translateX(100%)' }], { d: 420 }).onfinish = () => pane.remove();
}

/* ——— 记忆页 ——— */
function renderMem(filter) {
  const st = ['', 'pending', 'stale'][filter]; const list = MEM.filter(m => !st || m.st === st);
  $('#memlist').innerHTML = list.map(m => `<button class="cell"><div class="grow">${esc(m.t)}<div class="meta">${m.m}${m.st === 'pending' ? ' · <span style="color:var(--warn)"><i class="dot" style="background:var(--warn)"></i> 待核验</span>' : m.st === 'stale' ? ' · 已失效' : ''}</div></div><span class="chev"><i data-lucide="chevron-right"></i></span></button>`).join('')
    || '<div class="cell"><div class="grow meta">没有记忆</div></div>';
  icons(); $$('#memlist .cell').forEach((c, i) => anim(c, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { d: 420, delay: i * 30 }));
}

/* ——— 角色 ——— */
function renderRoles() {
  const roles = [['cxday', '澄夏', '2 个实例'], ['lz', '林舟', '1 个实例'], ['bz', '白芷', '1 个实例'], ['wy', '温衍', '剧情 NPC']];
  $('#roles').innerHTML = roles.map(([a, n, s]) => `<button class="role" style="--tint:${TINT[a] || '140,140,150'}" data-a="${a}"><img class="avatar" src="${AV[a]}" alt=""><b>${n}</b><span>${s}</span></button>`).join('');
}
$('#roles').addEventListener('click', e => { const r = e.target.closest('.role'); if (!r) return; const id = { cxday: 'cxday', lz: 'lz', bz: 'bz' }[r.dataset.a]; if (id) openChat(id, r.querySelector('.avatar')); else toast('剧情 NPC 不在日常对话中', 'book-open'); });

/* ——— 陪伴 ——— */
$('#inbox').innerHTML = [['cxday', '澄夏 · 日常', '傍晚的湖边起风了，出门记得带外套。', '18:05', '邮箱已送达', 'ok'], ['lz', '林舟', '明天上午十点前把第三幕的稿子发我。', '17:40', '飞书已接受', 'ok']]
  .map(([a, n, t, time, st, k]) => `<button class="cell inbox"><img class="avatar" src="${AV[a]}" alt=""><div class="grow"><div style="display:flex"><b style="font-size:15px">${n}</b><span class="meta" style="margin-left:auto">${time}</span></div><div class="t">${t}</div><span class="state"><i class="dot" style="background:var(--${k})"></i>${st}</span></div></button>`).join('');

/* ——— 剧情 ——— */
const STORY = { npcs: [['sm', '老板娘 苏蔓'], ['ay', '侍者 阿岩'], ['wy', '画家 温衍']],
  lines: { sm: '“阿岩那晚一直在楼下帮我收拾。不过……十点半的时候，我好像听见楼上有人拖动椅子。”', ay: '“我说过了，十点以后我没上过二楼。您可以去问苏老板。”', wy: '“那幅画不是我画坏的。画布是湿的，有人在我离开后打开过窗户。”' } };
function enterStory() {
  const lb = document.createElement('div'); lb.className = 'letterbox'; lb.innerHTML = '<i></i><i></i><div class="card"><b>雾港旅馆</b><span>第二幕 · 询问</span></div>'; app.append(lb);
  requestAnimationFrame(() => requestAnimationFrame(() => lb.classList.add('close')));
  setTimeout(() => $('.card', lb).classList.add('on'), 650);
  setTimeout(() => { openStage(); $('.card', lb).classList.remove('on'); }, 2100);
  setTimeout(() => lb.classList.remove('close'), 2350);
  setTimeout(() => lb.remove(), 3400);
}
function openStage() {
  const el = document.createElement('section'); el.className = 'screen stage'; let who = 'ay';
  el.innerHTML = `<header class="navbar" style="--nav-p:1"><button class="circle glass press" data-back aria-label="离开剧情"><i data-lucide="x"></i></button>
    <div class="nav-title" style="text-align:center;line-height:1.2">雾港旅馆<div class="meta" style="font-weight:400">第二幕 · 询问</div></div><div class="nav-spacer"></div>
    <button class="circle glass press" aria-label="回档" data-rewind><i data-lucide="history"></i></button></header>
    <div class="scroll" style="padding-top:68px;padding-bottom:110px">
      <div class="npcs focus">${STORY.npcs.map(([a, n]) => `<button class="npc ${a === who ? 'on' : ''}" data-npc="${a}"><img src="${AV[a]}" alt="">${n}</button>`).join('')}</div>
      <div class="narr"><p class="dim">壁炉里的火星偶尔噼啪炸开，外面海潮一浪接着一浪。走廊尽头的座钟刚刚敲过三下。</p><p>阿岩把托盘放在桌上，手指在杯沿停了一下。</p><p class="say">“那晚十点以后，我没有再上过二楼。”</p></div>
      <div class="evi-h">证物</div>
      <div class="evis"><div class="evi"><div class="f"><i data-lucide="watch"></i><div><b>怀表</b><br><span>停在 22:47</span></div></div><div class="b"></div></div>
        <div class="evi"><div class="f"><i data-lucide="key-round"></i><div><b>二楼钥匙</b><br><span>黄铜 · 204</span></div></div><div class="b"></div></div>
        <div class="evi back" id="newevi"><div class="f"><i data-lucide="image"></i><div><b>湿掉的画布</b><br><span>窗边 · 未干</span></div></div><div class="b"><i data-lucide="sparkles"></i></div></div></div>
    </div>
    <footer class="composer"><div class="field glass"><textarea rows="1" placeholder="向阿岩发问或行动" aria-label="行动或发问"></textarea><button class="send" disabled aria-label="发送"><i data-lucide="arrow-up"></i></button></div></footer>`;
  push(el); const ta = $('textarea', el), send = $('.send', el), narr = $('.narr', el), scroll = $('.scroll', el);
  const npcs = $$('.npc', el); const names = Object.fromEntries(STORY.npcs);
  npcs.forEach(n => n.onclick = () => { who = n.dataset.npc; npcs.forEach(x => x.classList.toggle('on', x === n)); ta.placeholder = `向${names[who].split(' ')[1]}发问或行动`; });
  ta.addEventListener('input', () => send.disabled = !ta.value.trim());
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!send.disabled) send.click(); } });
  let flipped = false;
  send.onclick = () => { const q = ta.value.trim(); if (!q) return; ta.value = ''; send.disabled = true;
    const me = document.createElement('p'); me.textContent = `你：${q}`; me.className = 'dim'; narr.append(me); anim(me, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { d: 420 });
    const p = document.createElement('p'); p.className = 'say'; narr.append(p); scroll.scrollTo({ top: scroll.scrollHeight, behavior: 'smooth' });
    const text = STORY.lines[who]; let i = 0; setTimeout(function tick() { if (i >= text.length) { if (!flipped) { flipped = true; const ev = $('#newevi', el);
          ev.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' }); setTimeout(() => { ev.classList.remove('back'); ev.insertAdjacentHTML('beforeend', '<span class="new">+1</span>'); navigator.vibrate && navigator.vibrate([10, 40, 10]); }, 400); } return; }
      const s = document.createElement('span'); s.className = 'tok'; s.textContent = text.slice(i, i + 2); i += 2; p.append(s); scroll.scrollTop = scroll.scrollHeight; setTimeout(tick, 40 + Math.random() * 40); }, 700); };
  el.addEventListener('click', e => { if (e.target.closest('[data-back]')) pop(); if (e.target.closest('[data-rewind]')) alertBox('回到第二幕开始？', '之后的行动与新发现的证物会被撤销。', '回档', () => toast('已回到第二幕开始', 'history')); });
}
$('#enter-story').onclick = enterStory;

/* ——— 通用绑定与启动 ——— */
app.addEventListener('click', e => { const o = e.target.closest('[data-open="settings"]'); if (o) settingsSheet(); const t = e.target.closest('[data-toast]'); if (t) toast(t.dataset.toast, 'plus'); });
$$('.tabroot').forEach(s => bindNav($('.scroll', s), $('.navbar', s)));
seg($('[data-seg="mem"]'), renderMem);
Promise.all(Object.keys(AV).map(async k => TINT[k] = await tintOf(AV[k]))).then(renderRoles);
renderConvos(); renderRoles(); icons();
})();
</script>

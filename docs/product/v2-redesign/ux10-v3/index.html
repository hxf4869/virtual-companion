<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Virtual Companion · 双端组件样板</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:15px;line-height:1.5}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button{border:0;background:transparent;padding:8px 16px;min-height:44px;cursor:pointer;border-radius:999px}button:hover{background:#ededf0}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #0071e3;outline-offset:3px}button[aria-pressed=true]{background:#1d1d1f;color:white}.review-head{padding:20px 28px;background:white;border-bottom:1px solid #e3e3e8;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.review-head strong{font-size:17px;font-weight:600}.review-head span{font-size:13px;color:#6e6e73;margin-left:16px}.review-controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.review-controls label{display:flex;align-items:center;gap:8px;font-size:13px;color:#6e6e73}select{border:1px solid #e3e3e8;border-radius:8px;background:white;padding:8px;min-height:40px}nav{display:flex;gap:4px}main{padding:24px 28px 32px}.preview-tools{max-width:1442px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:16px}.preview-tools p{margin:0;color:#6e6e73;font-size:13px}.preview-tools a{color:#0066cc;text-decoration:none;font-size:13px}#stage{margin:auto;border:1px solid #e3e3e8;border-radius:16px;overflow:hidden;background:white;max-width:1442px}#stage.mobile{max-width:392px;border-radius:24px}iframe{border:0;display:block;transform-origin:top left;background:white}.device-controls{display:flex;gap:2px;background:#f5f5f7;padding:2px;border-radius:999px}.variant-nav{display:flex;justify-content:center;gap:12px;margin-top:20px}.variant-nav button{font-size:13px;color:#0066cc}.frame-only main{padding:0}.frame-only .review-head,.frame-only .preview-tools,.frame-only .variant-nav{display:none}.frame-only #stage{border:0;border-radius:0}#notice{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:#1d1d1f;color:white;box-shadow:0 8px 28px #0002;z-index:10;max-width:calc(100% - 32px)}#notice[hidden]{display:none}@media(max-width:800px){.review-head{padding:16px;gap:12px}.review-head span{display:block;margin:4px 0 0}.review-controls{gap:12px}main{padding:16px}.preview-tools{align-items:flex-start}.review-head nav{overflow:auto;max-width:100%}nav button{white-space:nowrap;padding:8px 12px}.review-controls label{gap:6px}.device-controls button{padding:8px 12px}}
</style></head><body>
<header class="review-head"><div><strong>双端组件样板</strong><span>DESIGN.md v3 · 合成数据 · 未发布</span></div><nav aria-label="样板页面"><button type="button" data-view="components">组件</button><button type="button" data-view="model">模型</button><button type="button" data-view="voice">语音</button><button type="button" data-view="identity">身份验证</button></nav><div class="review-controls"><div class="device-controls" role="group" aria-label="设备"><button type="button" data-device="desktop">电脑</button><button type="button" data-device="mobile">手机</button></div><label>宽度<select id="width" aria-label="预览宽度"></select></label><label>明暗<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label></div></header>
<main><div class="preview-tools"><p id="caption"></p><a id="full" target="_blank" rel="noopener">原尺寸查看 ↗</a></div><div id="stage"><iframe id="preview-frame" title="组件样板"></iframe></div><div class="variant-nav" id="subnav"></div></main><div id="notice" role="status" hidden></div>
<script>
const q=new URLSearchParams(location.search);const names={components:'组件样板',model:'模型',voice:'语音',identity:'身份验证'};const state={view:names[q.get('view')]?q.get('view'):'components',device:q.get('device')==='mobile'?'mobile':'desktop',theme:q.get('theme')==='dark'?'dark':'light',screen:q.get('screen')||'home'};let nativeWidth=Number(q.get('width'))||(state.device==='mobile'?390:1440);const $=id=>document.getElementById(id);if(q.get('full')==='1')document.body.classList.add('frame-only');
function frameQuery(){return new URLSearchParams({...state,width:nativeWidth})}function size(){const w=nativeWidth,h=state.device==='mobile'?844:900,scale=Math.min(1,$('stage').clientWidth/w);const f=$('preview-frame');f.style.width=w+'px';f.style.height=h+'px';f.style.transform=`scale(${scale})`;$('stage').style.height=h*scale+'px'}
function render(){for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===state.view));for(const b of document.querySelectorAll('[data-device]'))b.setAttribute('aria-pressed',String(b.dataset.device===state.device));$('theme').value=state.theme;const widths=state.device==='mobile'?[360,390,430]:[768,1024,1440];if(!widths.includes(nativeWidth))nativeWidth=widths.at(-1);$('width').innerHTML=widths.map(w=>`<option value="${w}"${w===nativeWidth?' selected':''}>${w}px</option>`).join('');$('stage').classList.toggle('mobile',state.device==='mobile');$('stage').style.maxWidth=nativeWidth+2+'px';$('caption').textContent=names[state.view]+' · '+(state.device==='mobile'?'手机':'电脑')+' · '+nativeWidth+' × '+(state.device==='mobile'?844:900)+(state.view==='identity'?' · 输入任意测试文字即可，无需真实密码':'');$('preview-frame').title=names[state.view];$('preview-frame').src='frame.html?'+frameQuery();$('full').href='?'+new URLSearchParams({...state,width:nativeWidth,full:1});$('subnav').innerHTML=state.view==='model'?['home','provider','model'].map((id,i)=>`<button type="button" data-screen="${id}">${['模型首页','供应商','模型配置'][i]}</button>`).join(''):state.view==='voice'?'<button type="button" data-screen="home">全局语音</button><button type="button" data-screen="relationship">角色声音</button>':'';size();history.replaceState(null,'','?'+new URLSearchParams({...state,width:nativeWidth,...(q.get('full')==='1'?{full:1}:{})}))}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),d=e.target.closest('[data-device]'),s=e.target.closest('[data-screen]');if(v){state.view=v.dataset.view;state.screen='home';render()}if(d){state.device=d.dataset.device;nativeWidth=state.device==='mobile'?390:1440;render()}if(s){state.screen=s.dataset.screen;render()}});$('theme').addEventListener('change',()=>{state.theme=$('theme').value;render()});$('width').addEventListener('change',()=>{nativeWidth=Number($('width').value);render()});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('preview-frame').contentWindow)return;if(e.data?.type==='vc-review-note'){const n=$('notice');n.textContent=e.data.text;n.hidden=false;clearTimeout(n.timer);n.timer=setTimeout(()=>n.hidden=true,4500)}if(e.data?.type==='vc-review-view'&&names[e.data.view]){state.view=e.data.view;state.screen=e.data.screen||'home';render()}});new ResizeObserver(size).observe($('stage'));render();
</script></body></html>

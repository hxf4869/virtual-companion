<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX-11 样板</title>
<style>html,body{margin:0;height:100%;font:14px system-ui}body{display:flex;flex-direction:column;background:#eee}form{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 12px}iframe{display:block;border:0;flex:1;min-height:0;align-self:center;width:100%}label{display:flex;gap:6px;align-items:center}</style>
<form id="controls"><label>视图<select name="view"><option value="components">组件</option><option value="chat">聊天</option><option value="characters">角色</option><option value="memory">记忆</option><option value="inbox">陪伴</option><option value="story">剧情</option><option value="settings">设置</option><option value="model">模型</option><option value="voice">语音</option></select></label><label>宽度<select name="width"><option value="0">适应窗口</option><option>1440</option><option>1280</option><option>1024</option><option>768</option><option>390</option><option>360</option></select></label><label>外观<select name="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="auto">跟随系统</option></select></label><label>状态<select name="state"><option value="ready">正常</option><option value="empty">空</option><option value="loading">载入</option><option value="error">错误</option><option value="long">长内容</option></select></label><label>层级<select name="screen"><option value="home">首页</option><option value="provider">供应商</option><option value="model">模型配置</option><option value="relationship">关系声音</option></select></label><span>仅合成数据 · 未接入生产</span></form><iframe title="UX-11 样板" id="preview"></iframe>
<script>const form=document.getElementById('controls'),frame=document.getElementById('preview');const initial=new URLSearchParams(location.search);for(const el of form.elements)if(initial.has(el.name))el.value=initial.get(el.name);let initialScreen=initial.get('screen')||(initial.get('selected')==='1'?'selected':initial.get('detail')==='1'?'detail':null);const screens={model:[['home','首页'],['provider','供应商'],['model','模型配置']],voice:[['home','全局声音'],['relationship','关系声音']],settings:[['model','模型'],['provider','供应商'],['profile','模型配置'],['voice','语音'],['appearance','外观'],['account','账户'],['data','账户与数据'],['notifications','通知'],['drawer','酒馆']],characters:[['home','列表'],['detail','详情'],['selected','选中']],memory:[['home','列表'],['detail','详情'],['edit','编辑']],inbox:[['home','默认'],['messages','消息'],['voice','语音条']],story:[['home','案件入口'],['continue','继续入口'],['stage','舞台']]};function load(){const view=form.elements.view.value,select=form.elements.screen,previous=initialScreen??select.value,choices=screens[view]||[['home','首页']];initialScreen=null;select.replaceChildren(...choices.map(([value,label])=>new Option(label,value)));select.value=choices.some(([value])=>value===previous)?previous:choices[0][0];const q=new URLSearchParams(new FormData(form)),screen=select.value;if(['characters','memory','story','inbox','chat','components'].includes(view)&&screen==='home')q.delete('screen');if(view==='characters'){q.delete('screen');if(screen==='detail')q.set('detail','1');if(screen==='selected')q.set('selected','1');}if(view==='inbox'&&screen!=='home'){q.set('messages','1');if(screen==='voice')q.set('voice','1');}frame.style.width=Number(q.get('width'))?q.get('width')+'px':'100%';frame.src='frame.html?'+q;history.replaceState(null,'','?'+q)}form.addEventListener('change',load);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='vc-review-view')return;form.elements.view.value=e.data.view;load()});load();</script>

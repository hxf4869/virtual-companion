schemaVersion: 1
policyId: NO_PAID_SOFTWARE_RUNTIME_PREREQUISITE
description: >-
  预录 license 清单：声明 Go 直接依赖的 license family，
  供 scripts/checks/check_licenses.py 与 scripts/checks/license-policy.yaml allowlist 比对。
  传递依赖不在此清单（由 CI SBOM 与依赖审计覆盖）。
# Go 直接依赖（backend/go.mod，排除 // indirect）
goDirectDependencies:
  - module: github.com/jackc/pgx/v5
    licenseFamily: MIT
  - module: github.com/wneessen/go-mail
    licenseFamily: MIT
  - module: github.com/minio/minio-go/v7
    licenseFamily: Apache-2.0
  - module: github.com/pquerna/otp
    licenseFamily: Apache-2.0
  - module: golang.org/x/crypto
    licenseFamily: BSD-3-Clause
# 例外账本（有到期日的受控接受；check_licenses.py 校验 expiresAt > 今天才生效）
exceptions: []
# integrations/sillytavern/package.json 直接依赖（按 license-policy.yaml domainPolicies.stIntegration 核对；
# 上游组件（含 MemoryCore MIT）与运行期自托管资源的许可直接读 upstream.lock.json / vendor.lock.json，不在此重复登记）
integrationDirectDependencies:
  - name: sqlite-vec
    licenseFamily: Apache-2.0
    scope: runtime
  - name: "@node-rs/jieba"
    licenseFamily: MIT
    scope: runtime
  - name: crc-32
    licenseFamily: Apache-2.0
    scope: runtime
  - name: playwright-core
    licenseFamily: Apache-2.0
    scope: dev   # 浏览器验收脚本驱动系统 Chrome；不进 check.sh
